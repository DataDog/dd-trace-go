---

create_tracer:
  target: main
  where:
    func: main
  do:
    - inject_code:
        raw: |
          tracer.Start()
          defer tracer.Stop()
  imports:
    tracer: github.com/DataDog/dd-trace-go/v2/ddtrace/tracer

span_directive:
  target: "**"
  where:
    directive: "otelc:span"
  do:
    - expand_directive:
        template: |-
          {{- $ctx := .FuncArgumentOfType "context.Context" -}}
          {{- $req := .FuncArgumentOfType "*net/http.Request" -}}
          {{- $opName := .DirectiveArg "span.name" -}}
          {{- if eq $opName "" -}}
            {{- $opName = .FuncName -}}
          {{- end }}
          var __dd_span *tracer.Span
          __dd_span_ctx := context.TODO()
          {{- if ne $ctx "" }}
          __dd_span_ctx = {{ $ctx }}
          {{- else if ne $req "" }}
          __dd_span_ctx = {{ $req }}.Context()
          {{- end }}
          __dd_span, __dd_span_ctx = tracer.StartSpanFromContext(__dd_span_ctx, {{ printf "%q" $opName }},
            tracer.Tag("function-name", {{ printf "%q" .FuncName }}),
            {{- range .DirectiveArgs }}
            {{- if ne .Key "span.name" }}
            tracer.Tag({{ printf "%q" .Key }}, {{ printf "%q" .Value }}),
            {{- end }}
            {{- end }}
          )
          {{- with $req }}
          {{ . }} = {{ . }}.WithContext(__dd_span_ctx)
          {{- end }}
          {{- $errRet := .FuncReturnOfType "error" }}
          {{- if ne $errRet "" }}
          defer func() {
            __dd_span.Finish(tracer.WithError({{ $errRet }}))
          }()
          {{- else }}
          defer __dd_span.Finish()
          {{- end -}}
  imports:
    tracer: github.com/DataDog/dd-trace-go/v2/ddtrace/tracer
    context: context