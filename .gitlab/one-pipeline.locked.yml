# One-pipeline template include + repo-specific neutralization of shared-pipeline jobs.
#
# These jobs are NOT gated by SKIP_SHARED_PIPELINE: they default to `when: manual` with
# non-optional `needs:` on the (skipped) packaging jobs, which would fail pipeline creation.
# Overriding them to `when: never` keeps only the config-registry jobs.
#
# NOTE: upstream one-pipeline.locked.yml is normally auto-generated by automation; if this repo
# onboards to that lock automation, these manual overrides would be clobbered.
include:
  - remote: https://gitlab-templates.ddbuild.io/libdatadog/include/versions/1.0.0/one-pipeline.yml

publish_dora_metrics:
  rules:
    - when: never

deploy_to_reliability_env:
  rules:
    - when: never
