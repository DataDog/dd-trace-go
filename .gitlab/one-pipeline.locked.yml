# One-pipeline template include for the shared config-registry jobs.
# NOTE: upstream one-pipeline.locked.yml is normally auto-generated by automation; if this repo
# onboards to that lock automation, the manual overrides below would be clobbered.
include:
  - remote: https://gitlab-templates.ddbuild.io/libdatadog/include/versions/1.4.0/one-pipeline.yml

# publish_dora_metrics is not gated by SKIP_SHARED_PIPELINE: it defaults to `when: manual` with
# non-optional `needs:` on the (skipped) packaging jobs, which would fail pipeline creation.
# Override it to `when: never` so only the config-registry jobs run.
publish_dora_metrics:
  rules:
    - when: never
