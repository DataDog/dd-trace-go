# One-pipeline template include for the shared config-registry jobs.
# NOTE: upstream one-pipeline.locked.yml is normally auto-generated by automation; if this repo
# onboards to that lock automation, the manual overrides below would be clobbered.
include:
  - remote: https://gitlab-templates.ddbuild.io/libdatadog/include/versions/1.13.0/one-pipeline.yml

# SKIP_SHARED_PIPELINE skips the packaging jobs these template jobs need, but their rules can still add
# them (promote-oci-to-prod on vX.Y.Z tags, promote-oci-to-staging on NIGHTLY_BUILD, publish_dora_metrics
# on older pins), which fails pipeline creation. Override them to `when: never`.
publish_dora_metrics:
  rules:
    - when: never

promote-oci-to-prod:
  rules:
    - when: never

promote-oci-to-staging:
  rules:
    - when: never
