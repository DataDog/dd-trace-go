name: dd-trace-go-agent
version: "0.1"

cases:
# ==== Contrib Tests ====
  - id: dd-trace-go-contrib-structure
    files:
      - contrib/AGENTS.md
    input: |
      I'm adding a new contrib integration for a library hosted at github.com/user/somelib.
      What directory structure should I create, and what is the correct import URL that users
      will use to import the integration?
    expected_criteria:
      - Creates the integration in a subdirectory at contrib/user/somelib/ (not a flat file at contrib/user/somelib.go)
      - States the integration is its own Go submodule with its own go.mod file
      - The correct import URL given ends with /contrib/user/somelib/v2 under the github.com/DataDog/dd-trace-go namespace
      - The Go package name is unversioned (somelib, not somelib.v2 or somerlibv2)
      - Mentions that the new module must be added to go.work with a use directive
      - Requires the three files -- a central somelib.go, somelib_test.go, and example_test.go
    bad_signals:
      - States the integration is a single file inside the existing root module (no submodule / no go.mod)
      - Gives an import URL that does not end in /v2 (e.g. github.com/DataDog/dd-trace-go/contrib/user/somelib)
      - Uses a versioned package name such as package somelib.v2 or package somerlibv2
      - Does not mention adding the module to go.work

  - id: dd-trace-go-contrib-tags
    files:
      - contrib/AGENTS.md
    input: |
      I'm writing a new contrib integration for an HTTP client library. What span tags are
      required on the spans I create, and what values should they have?
    expected_criteria:
      - Mentions the span.kind tag and states it should be set to client for an HTTP client
      - States that span.kind should be omitted (not set to internal) when the span kind is internal
      - Mentions the component tag and states it should be set to the full integration package naming convention
    bad_signals:
      - Says span.kind should always be set including for internal spans (i.e. set to internal)
      - Does not mention the component tag at all
      - Gives incorrect span.kind values such as outbound or request

  - id: dd-trace-go-contrib-telemetry-registration
    files:
      - contrib/AGENTS.md
    input: |
      I've created a new contrib integration for a library at github.com/user/somelib. What do I
      need to do to register instrumentation telemetry for it, and what other files besides the
      integration code itself need to be updated?
    expected_criteria:
      - Mentions adding an init() function that calls instrumentation.Load with a matching package
        constant (e.g. instrumentation.Load(instrumentation.PackageSomelib))
      - States that instrumentation/packages.go must be updated with a new constant and matching
        package info in the packages map
      - States that contribIntegrations in ddtrace/tracer/option.go must include the new package
      - Mentions that a corresponding PR should be opened in the Datadog/documentation repo to add
        the integration to the compatible integrations list
    bad_signals:
      - Says telemetry registration is automatic and requires no extra code or file updates
      - Omits updating instrumentation/packages.go or contribIntegrations in option.go
      - Does not mention the documentation repo PR at all

  - id: dd-trace-go-contrib-shared-instrumentation
    only_warn: true
    files:
      - contrib/AGENTS.md
    input: |
      I'm writing a new HTTP-based contrib integration and need to resolve the span's service name
      and operation name and get a logger, consistent with how the rest of the contrib packages do
      it. Where does this shared logic live and how should I access it instead of writing it myself?
    expected_criteria:
      - States that code shared across multiple contribs lives in the instrumentation/ directory
      - Mentions that instrumentation.Load(...) returns an Instrumentation instance whose methods
        (e.g. ServiceName, OperationName, Logger) should be used instead of reimplementing this logic
      - Advises against duplicating naming/service-resolution logic inside the new contrib package
    bad_signals:
      - Recommends writing bespoke service-name/operation-name resolution logic inside the new
        contrib package instead of using the instrumentation package
      - Does not reference the instrumentation package/directory at all
      - Says this shared logic lives in a different directory instead of instrumentation/

  - id: dd-trace-go-contrib-httptrace-server
    only_warn: true
    files:
      - contrib/AGENTS.md
    input: |
      My new contrib integration wraps a Go HTTP server-side framework. How should I start and
      finish the span for each incoming request so that it's consistent with other HTTP server
      contribs like net/http?
    expected_criteria:
      - Recommends using the shared httptrace package (instrumentation/httptrace) rather than
        manually calling tracer.StartSpan for each request
      - Mentions that the shared helper returns a wrapped ResponseWriter/Request plus a finish
        function that must be deferred/called to finish the span
      - Notes span.kind should be set to server for this server-side span, and the component tag
        should be set to the integration's naming-convention value
    bad_signals:
      - Has the integration call tracer.StartSpan directly instead of using the shared httptrace
        helper
      - Fails to mention finishing the span via the returned finish/cleanup function
      - Omits the span.kind server tag or sets an incorrect span.kind value for a server span

  - id: dd-trace-go-contrib-versioned-package
    files:
      - contrib/AGENTS.md
    input: |
      I'm building a contrib integration for github.com/some/queue, which has released major
      version v3, and my integration only works against the v3.x line. What should the import path
      and the Go package name be?
    expected_criteria:
      - States the import path includes a package-specific .v3 suffix in addition to the dd-trace-go
        module's own /v2 suffix (e.g. github.com/DataDog/dd-trace-go/contrib/some/queue.v3/v2)
      - States the Go package name itself stays unversioned (package queue, not queue.v3 or queuev3)
    bad_signals:
      - Omits either the package-specific .v3 suffix or the dd-trace-go module's /v2 suffix
      - Versions the Go package name itself (e.g. package queuev3 or package queue_v3)

  - id: dd-trace-go-contrib-deprecation-policy
    files:
      - contrib/AGENTS.md
    input: |
      One of our contrib integrations wraps a library that was just archived by its maintainer on
      GitHub, with no CVE currently reported against its latest available version. Can we deprecate
      this integration now?
    expected_criteria:
      - States that deprecation requires both conditions to be true -- the integrated package being
        deprecated/archived AND a CVE reported against its latest available version
      - Concludes that this integration does not yet qualify for deprecation since no CVE has been
        reported
    bad_signals:
      - Says the integration can be deprecated based on the archived status alone
      - Does not mention that both conditions (archived/deprecated AND a reported CVE) are required

  - id: dd-trace-go-contrib-test-files
    files:
      - contrib/AGENTS.md
    input: |
      I finished writing the new contrib package's core logic. What test file(s) do I need to add
      for it to be automatically run by CI on new pull requests, and are there any other files
      expected alongside it?
    expected_criteria:
      - States that a `<name>_test.go` file is required so tests run automatically in CI
      - Mentions that an example_test.go file is also expected, serving as public godoc
        documentation with an example of how to initialize and use the integration
    bad_signals:
      - Says tests are optional for a new contrib integration
      - Does not mention example_test.go as an expected file

# ==== Tracer Tests ====
  - id: dd-trace-go-tracer-api-break
    only_warn: true
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I need to rename an exported function in the ddtrace/tracer package. CI is now failing
      on the API diff check. What do I need to do to get the PR merged?
    expected_criteria:
      - Mentions adding the breaking-api-acknowledged label to the PR to acknowledge the intentional change
      - Mentions that make apidiff/incompatible can be used to check breaking changes locally before pushing
    bad_signals:
      - Says to revert the change without mentioning the label option for intentional breaks
      - Does not mention the CI label mechanism at all, giving only a vague answer about breaking changes
      - Suggests force-merging or skipping the CI check

  - id: dd-trace-go-control-general-go
    only_warn: true
    files:
      - AGENTS.md
    input: |
      How do I write an HTTP middleware in Go that adds a custom request ID header to every
      incoming request?
    expected_criteria:
      - Implements the middleware as a function that takes and returns http.Handler (or http.HandlerFunc)
      - Correctly extracts or generates a request ID and sets it via r.Header.Set or w.Header().Set
      - Calls the next handler via next.ServeHTTP to pass the request along the chain
    bad_signals:
      - Gives an implementation that only works with dd-trace-go-specific types and is not usable standalone
      - Fails to demonstrate the standard Go middleware pattern (wrapping http.Handler)
      - Confuses middleware with a tracer integration by importing dd-trace-go packages unnecessarily

  - id: dd-trace-go-tracer-doc-update-trigger
    only_warn: true
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I'm adding a new tracer option, WithAdaptiveSampling, which lets users enable an adaptive
      rate-sampling algorithm that adjusts itself based on traffic volume. Which files do I need
      to read before making this change, and where should I document the new behavior once it's done?
    expected_criteria:
      - States that ddtrace/tracer/README.md must be read first for handling API changes, and
        ddtrace/tracer/doc.go must be read for the tracer's existing abilities
      - Identifies this as a significant feature (it changes tracer sampling behavior) and states
        that doc.go must be updated to document it
    bad_signals:
      - Says no documentation update is required for this change
      - Points only to the top-level project README.md or CONTRIBUTING.md instead of the tracer
        package's own doc.go
      - Does not mention reading README.md/doc.go before making the change

  - id: dd-trace-go-tracer-readme-ci-stability
    only_warn: true
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I added a new make target, `make tracer-flake-detect`, that developers run in CI to catch
      flaky tests in the tracer package, helping keep the tracer stable in CI. Do I need to
      document this anywhere?
    expected_criteria:
      - States that ddtrace/tracer/README.md should be updated with the new command, since it is
        a script that enables tracer stability in CI
    bad_signals:
      - Says no documentation update is required
      - Suggests documenting the command only in the top-level project README.md instead of the
        tracer package's own README.md
      - Suggests updating doc.go instead of README.md for a CI script/command

  - id: dd-trace-go-tracer-sampling-env-config
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      Without changing any code, how can I configure the Go tracer at runtime to apply a 100%
      sampling rate to spans named "web.request" from service "test-service", and how does this
      interact with sampling rules already set via tracer.WithSamplingRules in code?
    expected_criteria:
      - Mentions the DD_TRACE_SAMPLING_RULES environment variable, set to a JSON array of objects
      - States that setting this environment variable overrides sampling rules set programmatically
        via tracer.WithSamplingRules
    bad_signals:
      - Says there is no way to configure sampling rules without changing code
      - Gives an incorrect environment variable name
      - Fails to mention that the environment variable takes precedence over WithSamplingRules

  - id: dd-trace-go-tracer-span-limit
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      What happens in the Go tracer if a single trace accumulates an extremely large number of
      spans, such as over 100,000?
    expected_criteria:
      - States that each trace has a hard limit of 100,000 spans
      - States that once the limit is exceeded, the trace is dropped and a diagnostic log message
        is emitted
    bad_signals:
      - Says there is no limit on the number of spans per trace
      - Gives an incorrect limit value
      - Says the trace is silently dropped with no diagnostic log message

  - id: dd-trace-go-tracer-stats-cardinality-limits
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I have a high-cardinality service using client-side stats computation (WithStatsComputation)
      in the Go tracer. What cardinality limits exist to protect memory usage, and what happens to
      spans that exceed one of these limits?
    expected_criteria:
      - Mentions at least two of the specific cardinality limit controls (e.g. the whole-key limit
        DD_TRACE_STATS_CARDINALITY_LIMIT / WithStatsCardinalityLimit, default 2048, and/or the
        per-resource limit DD_TRACE_STATS_RESOURCE_CARDINALITY_LIMIT / WithStatsResourceCardinalityLimit,
        default 1024)
      - States that spans exceeding a limit are still counted, but their grouping dimension is
        replaced with a sentinel/placeholder value rather than the span being dropped
      - Mentions the datadog.tracer.stats.collapsed_spans statsd metric used to observe when
        collapsing occurs
    bad_signals:
      - Says spans exceeding a cardinality limit are dropped entirely
      - Does not mention any specific cardinality limit env var or option
      - Gives incorrect default values for the limits

# ==== Profiling Tests ====

  - id: dd-trace-go-profiler-cpu-duration-clamp
    files:
      - profiler/AGENTS.md
    input: |
      I configured profiler.CPUDuration(5*time.Minute) but left the profiling period at its
      1-minute default. How long will the CPU profile actually sample for each cycle, and will I
      get a warning or error if the values conflict like this?
    expected_criteria:
      - States that cpuDuration is clamped down to equal the period when it exceeds the period, so
        the CPU profile will only sample for 1 minute, not 5
      - States that this clamping happens silently, with no error or warning logged
    bad_signals:
      - Says the CPU profile will run for the full 5 minutes configured, spanning multiple periods
      - Says Start will return an error because cpuDuration exceeds period

  - id: dd-trace-go-profiler-upload-queue-full-behavior
    files:
      - profiler/AGENTS.md
    input: |
      Our upload endpoint has been slow and profile batches are being produced faster than they can
      be sent. What happens once the internal upload queue fills up -- does collection block, does
      the queue grow unbounded, and which batch (oldest or newest) is discarded?
    expected_criteria:
      - States the upload queue is a small bounded/buffered channel (not unbounded)
      - States that when it's full, the profiler evicts the oldest queued batch to make room for the
        newest one rather than blocking collection
      - Mentions that a warning is logged and/or a queue-full metric is incremented when this eviction
        happens
    bad_signals:
      - Says the collection goroutine blocks until queue space frees up
      - Says the newest batch is dropped while older queued batches are kept
      - Says the queue grows without bound, risking unbounded memory growth

  - id: dd-trace-go-profiler-upload-retry-backoff
    files:
      - profiler/AGENTS.md
    input: |
      When a profile upload to the agent fails with a retriable error (like a 5xx response), what
      backoff strategy is used between retry attempts, and how many times will it retry before
      giving up?
    expected_criteria:
      - States retries are capped at a small fixed number (2 retries) rather than being unbounded
      - States the wait between retries is a random duration bounded by the profiling period
        (not a fixed or exponentially-doubling backoff)
      - Mentions that only retriable errors (server 5xx/transport errors) trigger a retry, while
        non-retriable errors (e.g. 4xx) fail immediately without retrying
    bad_signals:
      - Says the profiler uses exponential backoff (e.g. doubling delay starting at 1s)
      - Says uploads retry indefinitely until they succeed
      - Says all upload errors, including 4xx client errors, are retried the same way

  - id: dd-trace-go-profiler-stop-flush-on-exit
    files:
      - profiler/AGENTS.md
    input: |
      If profiler.Stop() is called while a profile batch is mid-collection or queued for upload,
      is that in-progress data flushed and uploaded before Stop returns, or is it discarded? Does
      this depend on any configuration?
    expected_criteria:
      - States that by default (flushOnExit disabled/false), in-flight/queued profile data is
        discarded rather than uploaded when Stop is called
      - Mentions that this behavior is controlled by the DD_PROFILING_FLUSH_ON_EXIT environment
        variable / flushOnExit setting, which defaults to false
      - States that enabling flush-on-exit causes the current batch to be completed and the queue
        drained/uploaded before Stop returns
    bad_signals:
      - Says Stop always waits for and uploads any in-progress or queued profile data regardless of
        configuration
      - Does not mention the flush-on-exit setting/env var at all

  - id: dd-trace-go-profiler-heap-partial-delta
    files:
      - profiler/AGENTS.md
    input: |
      The heap profile exposes four sample values: alloc_objects, alloc_space, inuse_objects, and
      inuse_space. When delta profiling is enabled, are all four converted into per-interval delta
      values, or only some of them?
    expected_criteria:
      - States that only alloc_objects and alloc_space are delta-encoded, since they are cumulative
        counters over the process lifetime
      - States that inuse_objects and inuse_space are left as absolute/snapshot values representing
        current heap state, since delta-encoding them would not make sense
    bad_signals:
      - Says all four heap sample values are delta-encoded the same way
      - Says none of the heap values are delta-encoded

  - id: dd-trace-go-profiler-goroutine-leak-forced-on
    files:
      - profiler/AGENTS.md
    input: |
      Our Go binary is built with GOEXPERIMENT=goroutineleakprofile. Can we disable the
      goroutine-leak profile for a given profiler.Start call by simply not including it in a
      WithProfileTypes(...) option call?
    expected_criteria:
      - States that when the goroutine-leak profile is available (detected via build info /
        GOEXPERIMENT at build time), it is added unconditionally after user options (including
        WithProfileTypes) have already been applied
      - Concludes that omitting it from WithProfileTypes does not disable it in this case -- there is
        currently no supported option to opt out when the GOEXPERIMENT is enabled at build time
    bad_signals:
      - Says passing WithProfileTypes without listing the goroutine-leak profile will disable it
      - Says the goroutine-leak profile is only enabled when explicitly requested via WithProfileTypes

  - id: dd-trace-go-profiler-execution-trace-not-a-profile-type
    files:
      - profiler/AGENTS.md
    input: |
      I want to programmatically check whether execution tracing is enabled and control it the same
      way as other profile types, e.g. by checking or setting it through WithProfileTypes/cfg.types.
      Will that work for execution traces?
    expected_criteria:
      - States that execution trace is deliberately excluded from the normal profile-types map used
        by WithProfileTypes, and is instead controlled by its own separate configuration
        (e.g. an executionTraceConfig / DD_PROFILING_EXECUTION_TRACE_ENABLED-style setting)
      - States that whether an execution trace runs in a given collection cycle is decided
        dynamically/probabilistically at collection time rather than via the static profile-types set
    bad_signals:
      - Says execution trace can be enabled or disabled via WithProfileTypes like any other profile
        type
      - Says execution trace is always collected every cycle once enabled, with no separate
        per-cycle decision logic

  - id: dd-trace-go-profiler-withprofiletypes-forces-metrics
    files:
      - profiler/AGENTS.md
    input: |
      I want to disable every profile type except CPU, including the metrics profile, by calling
      profiler.WithProfileTypes(profiler.CPUProfile). Will this leave only the CPU profile enabled?
    expected_criteria:
      - States that WithProfileTypes always force-adds MetricsProfile in addition to whatever types
        are explicitly passed, so metrics profiling cannot be disabled through this option
      - Concludes that after this call both CPUProfile and MetricsProfile are enabled, not just CPU
    bad_signals:
      - Says WithProfileTypes(profiler.CPUProfile) results in only the CPU profile being enabled
      - Says metrics profiling can be fully disabled by omitting it from WithProfileTypes

  - id: dd-trace-go-profiler-aws-lambda-disabled
    files:
      - profiler/AGENTS.md
    input: |
      We're deploying our Go service as an AWS Lambda function and still want to call profiler.Start
      with our usual options at init time. Will the profiler run there, or is there special handling
      for the Lambda environment?
    expected_criteria:
      - States that when the AWS_LAMBDA_FUNCTION_NAME environment variable is set, Start returns an
        error and profiling is not supported/started in AWS Lambda runtimes at all
      - States this check happens unconditionally, regardless of what other options are passed to
        Start
    bad_signals:
      - Says the profiler runs normally in Lambda with no special-casing
      - Says Lambda support just requires a different upload URL/agentless configuration rather than
        being entirely disabled

  - id: dd-trace-go-profiler-shared-zstd-encoder-forgotten-close
    files:
      - profiler/AGENTS.md
    input: |
      Multiple profile types (e.g. CPU and Heap) can end up sharing the same cached zstd encoder
      instance when they compress at the same level. If some code path acquires that shared encoder
      via Reset() but fails to call Close() on it (e.g. due to an early return on error), what
      happens to other profile types that later need the same encoder?
    expected_criteria:
      - States the shared encoder uses a size-1 channel acting as a semaphore/lock, acquired in
        Reset() and released in Close()
      - States that skipping Close() after Reset() leaves the semaphore permanently held, so any
        later Reset() call for that same cached encoder blocks forever (a deadlock), rather than
        erroring or silently proceeding
    bad_signals:
      - Says each profile type gets its own independent encoder instance so a missing Close() only
        affects that one profile type
      - Says a missing Close() call causes an error to be returned on the next Reset() rather than a
        blocking deadlock

# ==== Appsec Tests ====

  - id: dd-trace-go-appsec-purpose
    files:
      - internal/appsec/AGENTS.md
    input: |
      What is the internal/appsec package responsible for at a high level, and which external module
      does most of the actual decision-making about WAF events and actions?
    expected_criteria:
      - States the package secures the application by monitoring operations executed by the application
        and applying actions when a security threat is detected
      - Names github.com/DataDog/go-libddwaf as the module containing the WAF (Web Application Firewall)
        engine that does most of the decision making about events and actions
    bad_signals:
      - Says internal/appsec itself makes the WAF decisions rather than delegating to go-libddwaf
      - Does not mention go-libddwaf at all

  - id: dd-trace-go-appsec-dyngo-role
    files:
      - internal/appsec/AGENTS.md
    input: |
      I'm writing a contrib integration that needs to hook into AppSec instrumentation. What package
      underlies every AppSec-supporting API entrypoint in dd-trace-go/contrib, and what kind of system is it?
    expected_criteria:
      - Names internal/appsec/dyngo (the Instrumentation Gateway) as the package behind every
        appsec-supporting contrib entrypoint
      - Describes dyngo as a context-scoped event listener system that dynamically listens to events in
        customer code and can react to configuration changes / hot-swap event listeners at runtime
    bad_signals:
      - Says contrib integrations call the WAF or go-libddwaf directly without going through dyngo
      - Describes dyngo as a static/compile-time mechanism rather than a runtime event listener system

  - id: dd-trace-go-appsec-operation-requirements
    files:
      - internal/appsec/AGENTS.md
    input: |
      What are the requirements for defining a new AppSec operation type using the Start*/Finish pattern?
    expected_criteria:
      - States each operation must have a Start* function/method and a Finish method that call into dyngo
      - States the operation's argument and result types must not require any external package, at most
        the standard library
    bad_signals:
      - Omits either the Start*/Finish pairing or the standard-library-only constraint on args/results
      - Says operation argument/result types can freely import other internal or third-party packages

  - id: dd-trace-go-appsec-features-list
    files:
      - internal/appsec/AGENTS.md
    input: |
      What AppSec features currently exist, and specifically, what does the "WAF Context" feature do?
    expected_criteria:
      - Lists features matching the documented set, e.g. HTTP/GRPC/GraphQL WAF Protection, SQL/OS/CMDi/HTTP
        RASP, User Security, WAF Context, and Tracing
      - States WAF Context is responsible for setting up the request-scoped context system of the WAF
    bad_signals:
      - Invents features that are not part of the documented feature list
      - Misdescribes WAF Context, e.g. conflating it with HTTP WAF Protection specifically

  - id: dd-trace-go-appsec-circular-dependency-risk
    files:
      - internal/appsec/AGENTS.md
    input: |
      I want my new AppSec operation's argument struct to import a helper type from internal/appsec/config
      so I don't have to redefine it. Is this safe to do, and why or why not?
    expected_criteria:
      - States this is risky and likely to cause a circular dependency
      - Explains the mechanism -- the operation definition is used by the package it instruments, and the
        package that instruments it will probably import the operation definition, so pulling in another
        internal package from the operation's args/result types can create a cycle
      - Recommends keeping the operation's argument/result types limited to the standard library instead
    bad_signals:
      - Says importing internal/appsec/config from the operation definition is fine with no caveats
      - Does not explain why the circular dependency risk exists

  - id: dd-trace-go-appsec-swap-feature-error-rollback
    files:
      - internal/appsec/AGENTS.md
    input: |
      Look at (*appsec).SwapRootOperation in internal/appsec/features.go. If one of the feature builders
      in the `features` slice (e.g. sqlsec.NewSQLSecFeature) returns an error while building the new set
      of features for a config update, what happens to the other feature builders that already succeeded
      during that same call, and does the previously active root operation get replaced?
    expected_criteria:
      - States that the whole swap is aborted on any feature-builder error -- SwapRootOperation joins the
        errors and returns before calling dyngo.SwapRootOperation, so the previously active features/root
        operation are left untouched
      - States that any new features which had already been successfully built earlier in the same call
        are explicitly Stop()'d and discarded rather than being partially activated
    bad_signals:
      - Says the successfully-built features activate anyway while only the failing one is skipped
      - Says the old/previous features are torn down regardless of whether the new build succeeded

  - id: dd-trace-go-appsec-stop-inflight-requests
    files:
      - internal/appsec/AGENTS.md
    input: |
      Look at (*appsec).stop in internal/appsec/appsec.go. When AppSec is stopped, does it wait for
      requests that are currently inside an active dyngo operation to finish before the WAF manager's
      underlying resources are reset, or is there a known gap here?
    expected_criteria:
      - States that stop() does NOT wait for in-flight requests -- it swaps the dyngo root operation to
        nil and calls a.cfg.WAFManager.Reset() immediately after acquiring featuresMu
      - Identifies this as an acknowledged, unresolved gap in the code -- a TODO comment saying it should
        "block until no more requests are using dyngo operations" -- not a deliberately finished design
    bad_signals:
      - Says stop() blocks until all in-flight requests finish before releasing WAF resources
      - Says there is no known limitation or gap in this teardown path

  - id: dd-trace-go-appsec-feature-rebuild-atomicity
    files:
      - internal/appsec/AGENTS.md
    input: |
      When a configuration source (e.g. remote config) pushes a change affecting AppSec, how does AppSec
      apply that change without leaving the system in an inconsistent state mid-update?
    expected_criteria:
      - States features are rebuilt via their builder (a pure function of the configuration) on every
        configuration change
      - States the rebuilt feature listeners are registered to the Instrumentation Gateway and the root
        level operation is hot-swapped for the new one, making the whole update atomic
    bad_signals:
      - Says AppSec mutates existing feature or listener state in place rather than rebuilding and
        hot-swapping
      - Does not mention the hot-swap/atomicity guarantee at all

  - id: dd-trace-go-appsec-limiter-deny-safe-default
    files:
      - internal/appsec/AGENTS.md
    input: |
      Look at newLimiter in internal/appsec/limiter/limiter.go. If it's called with maxTokens <= 0 or a
      non-positive interval, does the resulting limiter allow every check through (fail open) or deny
      every check (fail closed)? Why was it built that way?
    expected_criteria:
      - States that in that case the function returns rate.NewLimiter(0, 0), a limiter whose Allow()
        always returns false -- it fails closed / deny-safe
      - Explains the reasoning given in the code -- computing a rate from a non-positive interval could
        otherwise produce an unbounded/"infinite" limiter, which would be an unsafe default for a
        security rate limiter
    bad_signals:
      - Says a zero/misconfigured maxTokens or interval results in an unlimited limiter that always allows
      - Says this configuration would panic or error instead of returning a deny-all limiter

  - id: dd-trace-go-appsec-doc-update-trigger
    only_warn: true
    files:
      - internal/appsec/AGENTS.md
    input: |
      I just added a new RASP feature to internal/appsec (a new protection type alongside the existing
      SQL/OS/CMDi/HTTP RASP features). Do I need to update any documentation for this, and if so, which
      file and why?
    expected_criteria:
      - States internal/appsec/README.md must be updated whenever changes to AppSec (ASM/AppSec) are
        introduced
      - Recognizes that adding a new feature qualifies as such a change
    bad_signals:
      - Says no documentation update is needed for this change
      - Points to a different file instead of internal/appsec/README.md, e.g. the top-level project
        README.md or CONTRIBUTING.md

