name: dd-trace-go-agent
version: "0.1"

cases:
# ==== Contrib Tests ====
  - id: dd-trace-go-contrib-structure
    files:
      - contrib/AGENTS.md
    input: |
      I'm adding a new contrib integration for a library hosted at github.com/user/somelib.
      What directory structure should I create, and what is the correct import URL that users
      will use to import the integration?
    expected_criteria:
      - Creates the integration in a subdirectory at contrib/user/somelib/ (not a flat file at contrib/user/somelib.go)
      - States the integration is its own Go submodule with its own go.mod file
      - The correct import URL given ends with /contrib/user/somelib/v2 under the github.com/DataDog/dd-trace-go namespace
      - The Go package name is unversioned (somelib, not somelib.v2 or somerlibv2)
      - Mentions that the new module must be added to go.work with a use directive
      - Requires the three files -- a central somelib.go, somelib_test.go, and example_test.go
    bad_signals:
      - States the integration is a single file inside the existing root module (no submodule / no go.mod)
      - Gives an import URL that does not end in /v2 (e.g. github.com/DataDog/dd-trace-go/contrib/user/somelib)
      - Uses a versioned package name such as package somelib.v2 or package somerlibv2
      - Does not mention adding the module to go.work

  - id: dd-trace-go-contrib-tags
    files:
      - contrib/AGENTS.md
    input: |
      I'm writing a new contrib integration for an HTTP client library. What span tags are
      required on the spans I create, and what values should they have?
    expected_criteria:
      - Mentions the span.kind tag and states it should be set to client for an HTTP client
      - States that span.kind should be omitted (not set to internal) when the span kind is internal
      - Mentions the component tag and states it should be set to the full integration package naming convention
    bad_signals:
      - Says span.kind should always be set including for internal spans (i.e. set to internal)
      - Does not mention the component tag at all
      - Gives incorrect span.kind values such as outbound or request

# ==== Tracer Tests ====
  - id: dd-trace-go-tracer-api-break
    only_warn: true
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I need to rename an exported function in the ddtrace/tracer package. CI is now failing
      on the API diff check. What do I need to do to get the PR merged?
    expected_criteria:
      - Mentions adding the breaking-api-acknowledged label to the PR to acknowledge the intentional change
      - Mentions that make apidiff/incompatible can be used to check breaking changes locally before pushing
    bad_signals:
      - Says to revert the change without mentioning the label option for intentional breaks
      - Does not mention the CI label mechanism at all, giving only a vague answer about breaking changes
      - Suggests force-merging or skipping the CI check

  - id: dd-trace-go-control-general-go
    only_warn: true
    files:
      - AGENTS.md
    input: |
      How do I write an HTTP middleware in Go that adds a custom request ID header to every
      incoming request?
    expected_criteria:
      - Implements the middleware as a function that takes and returns http.Handler (or http.HandlerFunc)
      - Correctly extracts or generates a request ID and sets it via r.Header.Set or w.Header().Set
      - Calls the next handler via next.ServeHTTP to pass the request along the chain
    bad_signals:
      - Gives an implementation that only works with dd-trace-go-specific types and is not usable standalone
      - Fails to demonstrate the standard Go middleware pattern (wrapping http.Handler)
      - Confuses middleware with a tracer integration by importing dd-trace-go packages unnecessarily

  - id: dd-trace-go-tracer-doc-update-trigger
    only_warn: true
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I'm adding a new tracer option, WithAdaptiveSampling, which lets users enable an adaptive
      rate-sampling algorithm that adjusts itself based on traffic volume. Which files do I need
      to read before making this change, and where should I document the new behavior once it's done?
    expected_criteria:
      - States that ddtrace/tracer/README.md must be read first for handling API changes, and
        ddtrace/tracer/doc.go must be read for the tracer's existing abilities
      - Identifies this as a significant feature (it changes tracer sampling behavior) and states
        that doc.go must be updated to document it
    bad_signals:
      - Says no documentation update is required for this change
      - Points only to the top-level project README.md or CONTRIBUTING.md instead of the tracer
        package's own doc.go
      - Does not mention reading README.md/doc.go before making the change

  - id: dd-trace-go-tracer-sampling-env-config
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      Without changing any code, how can I configure the Go tracer at runtime to apply a 100%
      sampling rate to spans named "web.request" from service "test-service", and how does this
      interact with sampling rules already set via tracer.WithSamplingRules in code?
    expected_criteria:
      - Mentions the DD_TRACE_SAMPLING_RULES environment variable, set to a JSON array of objects
      - States that setting this environment variable overrides sampling rules set programmatically
        via tracer.WithSamplingRules
    bad_signals:
      - Says there is no way to configure sampling rules without changing code
      - Gives an incorrect environment variable name
      - Fails to mention that the environment variable takes precedence over WithSamplingRules

  - id: dd-trace-go-tracer-span-limit
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      What happens in the Go tracer if a single trace accumulates an extremely large number of
      spans, such as over 100,000?
    expected_criteria:
      - States that each trace has a hard limit of 100,000 spans
      - States that once the limit is exceeded, the trace is dropped and a diagnostic log message
        is emitted
    bad_signals:
      - Says there is no limit on the number of spans per trace
      - Gives an incorrect limit value
      - Says the trace is silently dropped with no diagnostic log message

  - id: dd-trace-go-tracer-stats-cardinality-limits
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I have a high-cardinality service using client-side stats computation (WithStatsComputation)
      in the Go tracer. What cardinality limits exist to protect memory usage, and what happens to
      spans that exceed one of these limits?
    expected_criteria:
      - Mentions at least two of the specific cardinality limit controls (e.g. the whole-key limit
        DD_TRACE_STATS_CARDINALITY_LIMIT / WithStatsCardinalityLimit, default 2048, and/or the
        per-resource limit DD_TRACE_STATS_RESOURCE_CARDINALITY_LIMIT / WithStatsResourceCardinalityLimit,
        default 1024)
      - States that spans exceeding a limit are still counted, but their grouping dimension is
        replaced with a sentinel/placeholder value rather than the span being dropped
      - Mentions the datadog.tracer.stats.collapsed_spans statsd metric used to observe when
        collapsing occurs
    bad_signals:
      - Says spans exceeding a cardinality limit are dropped entirely
      - Does not mention any specific cardinality limit env var or option
      - Gives incorrect default values for the limits

