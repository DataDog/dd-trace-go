# ==== Orchestrion Tests ====

  - id: dd-trace-go-orchestrion-yml-structure
    files:
      - orchestrion/AGENTS.md
    input: |
      I'm writing a new orchestrion.yml file for a contrib integration. What are the required
      top-level sections in this file, and what does the "aspects" section actually define?
    expected_criteria:
      - States the file has a meta section (with at least a name and description) and an aspects
        section as its top-level keys
      - States each entry in aspects has an id, a join-point (where in the AST orchestrion should
        match code), and advice (what code/instrumentation gets injected at that match)
    bad_signals:
      - Omits the join-point/advice structure entirely or describes aspects as unstructured free text
      - Says the meta section is optional or unused

  - id: dd-trace-go-orchestrion-build-time-enabled-check
    files:
      - orchestrion/AGENTS.md
    input: |
      How can Go code check at runtime whether the current binary was actually compiled with
      Orchestrion (auto-instrumented), as opposed to a plain go build?
    expected_criteria:
      - Mentions the orchestrion.Enabled() function, backed by a package-level boolean variable
        that Orchestrion overwrites at build time via a //orchestrion:enabled directive comment
      - States this defaults to false when the binary was not built using Orchestrion
    bad_signals:
      - Says this can only be inferred indirectly, e.g. via environment variables
      - Says Enabled() always returns true merely because the orchestrion package is imported
      - Says there is no supported way to detect this at runtime

  - id: dd-trace-go-orchestrion-template-function-fields
    files:
      - orchestrion/AGENTS.md
    input: |
      Inside an orchestrion.yml advice template, I want to reference the name of the matched
      function's first argument and the name of its second return value. What expressions should I use?
    expected_criteria:
      - Gives `{{ .Function.Argument 0 }}` for the first argument, using 0-based indexing
      - Gives `{{ .Function.Result 1 }}` for the second return value, using 0-based indexing
    bad_signals:
      - Uses 1-based indexing for Argument/Result (e.g. `.Function.Argument 1` for the first argument)
      - Invents template syntax not documented for this purpose
      - Says Function.Argument/Result return an index/position rather than the identifier name

  - id: dd-trace-go-orchestrion-integration-test-harness
    files:
      - orchestrion/AGENTS.md
    input: |
      I'm adding a new orchestrion integration test under internal/orchestrion/_integration. What
      interface must my test case struct implement, what is each method responsible for, and what
      do I need to run afterward so the suite picks it up?
    expected_criteria:
      - States the struct must implement harness.TestCase, with Setup, Run, and ExpectedTraces methods
      - States Setup prepares dependencies (e.g. starting services) before the tracer is started,
        while Run performs the instrumented actions after the tracer has started
      - States ExpectedTraces returns the traces expected to be produced, matched against what the
        mock agent actually receives
      - Mentions running `go generate ./...` afterward to register the new test case
    bad_signals:
      - Says Setup runs after the tracer has already started
      - Omits ExpectedTraces from the required interface methods
      - Fails to mention running go generate to wire the new test into the generated test suite

  - id: dd-trace-go-orchestrion-argument-of-type-lookup
    files:
      - orchestrion/AGENTS.md
    input: |
      Inside an orchestrion.yml advice template, I don't know the positional index of the *http.Request
      argument on the matched function -- I only know its type. Is there a template expression that
      finds an argument by type instead of by position, and what does it produce if no argument of
      that type exists? How does that failure mode compare to looking up an out-of-range positional
      argument with .Function.Argument?
    expected_criteria:
      - States `{{ .Function.ArgumentOfType type }}` can be used to find the name of the first
        argument matching a given type, as an alternative to positional lookup
      - States that if no argument of that type exists, it returns a blank string -- not an error
      - Contrasts this with `.Function.Argument n` (or `.Function.Result n`), which returns an error
        when the index is out of range/there aren't enough arguments -- i.e. the two failure modes
        differ (blank string vs error)
    bad_signals:
      - Says there's no way to look up a function argument by type, only by position
      - Says ArgumentOfType also errors out when no match is found (same as the positional
        out-of-range case)

  - id: dd-trace-go-orchestrion-directive-args-access
    files:
      - orchestrion/AGENTS.md
    input: |
      A join point in my orchestrion.yml aspect matches based on a directive comment that carries its
      own key/value arguments. Inside the advice template, what expression gives me access to those
      directive arguments, and how do I read an individual key and its value from it?
    expected_criteria:
      - States `{{ .DirectiveArgs }}` is used to access the key/value list of directive arguments
        inside the advice template
      - States individual entries are read via `.Key` and `.Value` on that list
    bad_signals:
      - Says directive arguments cannot be accessed from within an advice template
      - Invents different/incorrect field names in place of .Key/.Value or .DirectiveArgs


