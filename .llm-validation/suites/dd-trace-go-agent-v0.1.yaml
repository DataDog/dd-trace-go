name: dd-trace-go-agent
version: "0.1"

cases:
# ==== Contrib Tests ====
  - id: dd-trace-go-contrib-structure
    files:
      - contrib/AGENTS.md
    input: |
      I'm adding a new contrib integration for a library hosted at github.com/user/somelib.
      What directory structure should I create, and what is the correct import URL that users
      will use to import the integration?
    expected_criteria:
      - Creates the integration in a subdirectory at contrib/user/somelib/ (not a flat file at contrib/user/somelib.go)
      - States the integration is its own Go submodule with its own go.mod file
      - The correct import URL given ends with /contrib/user/somelib/v2 under the github.com/DataDog/dd-trace-go namespace
      - The Go package name is unversioned (somelib, not somelib.v2 or somerlibv2)
      - Mentions that the new module must be added to go.work with a use directive
      - Requires the three files -- a central somelib.go, somelib_test.go, and example_test.go
    bad_signals:
      - States the integration is a single file inside the existing root module (no submodule / no go.mod)
      - Gives an import URL that does not end in /v2 (e.g. github.com/DataDog/dd-trace-go/contrib/user/somelib)
      - Uses a versioned package name such as package somelib.v2 or package somerlibv2
      - Does not mention adding the module to go.work

  - id: dd-trace-go-contrib-tags
    files:
      - contrib/AGENTS.md
    input: |
      I'm writing a new contrib integration for an HTTP client library. What span tags are
      required on the spans I create, and what values should they have?
    expected_criteria:
      - Mentions the span.kind tag and states it should be set to client for an HTTP client
      - States that span.kind should be omitted (not set to internal) when the span kind is internal
      - Mentions the component tag and states it should be set to the full integration package naming convention
    bad_signals:
      - Says span.kind should always be set including for internal spans (i.e. set to internal)
      - Does not mention the component tag at all
      - Gives incorrect span.kind values such as outbound or request

  - id: dd-trace-go-contrib-telemetry-registration
    files:
      - contrib/AGENTS.md
    input: |
      I've created a new contrib integration for a library at github.com/user/somelib. What do I
      need to do to register instrumentation telemetry for it, and what other files besides the
      integration code itself need to be updated?
    expected_criteria:
      - Mentions adding an init() function that calls instrumentation.Load with a matching package
        constant (e.g. instrumentation.Load(instrumentation.PackageSomelib))
      - States that instrumentation/packages.go must be updated with a new constant and matching
        package info in the packages map
      - States that contribIntegrations in ddtrace/tracer/option.go must include the new package
      - Mentions that a corresponding PR should be opened in the Datadog/documentation repo to add
        the integration to the compatible integrations list
    bad_signals:
      - Says telemetry registration is automatic and requires no extra code or file updates
      - Omits updating instrumentation/packages.go or contribIntegrations in option.go
      - Does not mention the documentation repo PR at all

  - id: dd-trace-go-contrib-shared-instrumentation
    only_warn: true
    files:
      - contrib/AGENTS.md
    input: |
      I'm writing a new HTTP-based contrib integration and need to resolve the span's service name
      and operation name and get a logger, consistent with how the rest of the contrib packages do
      it. Where does this shared logic live and how should I access it instead of writing it myself?
    expected_criteria:
      - States that code shared across multiple contribs lives in the instrumentation/ directory
      - Mentions that instrumentation.Load(...) returns an Instrumentation instance whose methods
        (e.g. ServiceName, OperationName, Logger) should be used instead of reimplementing this logic
      - Advises against duplicating naming/service-resolution logic inside the new contrib package
    bad_signals:
      - Recommends writing bespoke service-name/operation-name resolution logic inside the new
        contrib package instead of using the instrumentation package
      - Does not reference the instrumentation package/directory at all
      - Says this shared logic lives in a different directory instead of instrumentation/

  - id: dd-trace-go-contrib-httptrace-server
    only_warn: true
    files:
      - contrib/AGENTS.md
    input: |
      My new contrib integration wraps a Go HTTP server-side framework. How should I start and
      finish the span for each incoming request so that it's consistent with other HTTP server
      contribs like net/http?
    expected_criteria:
      - Recommends using the shared httptrace package (instrumentation/httptrace) rather than
        manually calling tracer.StartSpan for each request
      - Mentions that the shared helper returns a wrapped ResponseWriter/Request plus a finish
        function that must be deferred/called to finish the span
      - Notes span.kind should be set to server for this server-side span, and the component tag
        should be set to the integration's naming-convention value
    bad_signals:
      - Has the integration call tracer.StartSpan directly instead of using the shared httptrace
        helper
      - Fails to mention finishing the span via the returned finish/cleanup function
      - Omits the span.kind server tag or sets an incorrect span.kind value for a server span

  - id: dd-trace-go-contrib-versioned-package
    files:
      - contrib/AGENTS.md
    input: |
      I'm building a contrib integration for github.com/some/queue, which has released major
      version v3, and my integration only works against the v3.x line. What should the import path
      and the Go package name be?
    expected_criteria:
      - States the import path includes a package-specific .v3 suffix in addition to the dd-trace-go
        module's own /v2 suffix (e.g. github.com/DataDog/dd-trace-go/contrib/some/queue.v3/v2)
      - States the Go package name itself stays unversioned (package queue, not queue.v3 or queuev3)
    bad_signals:
      - Omits either the package-specific .v3 suffix or the dd-trace-go module's /v2 suffix
      - Versions the Go package name itself (e.g. package queuev3 or package queue_v3)

  - id: dd-trace-go-contrib-deprecation-policy
    files:
      - contrib/AGENTS.md
    input: |
      One of our contrib integrations wraps a library that was just archived by its maintainer on
      GitHub, with no CVE currently reported against its latest available version. Can we deprecate
      this integration now?
    expected_criteria:
      - States that deprecation requires both conditions to be true -- the integrated package being
        deprecated/archived AND a CVE reported against its latest available version
      - Concludes that this integration does not yet qualify for deprecation since no CVE has been
        reported
    bad_signals:
      - Says the integration can be deprecated based on the archived status alone
      - Does not mention that both conditions (archived/deprecated AND a reported CVE) are required

  - id: dd-trace-go-contrib-test-files
    files:
      - contrib/AGENTS.md
    input: |
      I finished writing the new contrib package's core logic. What test file(s) do I need to add
      for it to be automatically run by CI on new pull requests, and are there any other files
      expected alongside it?
    expected_criteria:
      - States that a `<name>_test.go` file is required so tests run automatically in CI
      - Mentions that an example_test.go file is also expected, serving as public godoc
        documentation with an example of how to initialize and use the integration
    bad_signals:
      - Says tests are optional for a new contrib integration
      - Does not mention example_test.go as an expected file

# ==== Tracer Tests ====
  - id: dd-trace-go-tracer-api-break
    only_warn: true
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I need to rename an exported function in the ddtrace/tracer package. CI is now failing
      on the API diff check. What do I need to do to get the PR merged?
    expected_criteria:
      - Mentions adding the breaking-api-acknowledged label to the PR to acknowledge the intentional change
      - Mentions that make apidiff/incompatible can be used to check breaking changes locally before pushing
    bad_signals:
      - Says to revert the change without mentioning the label option for intentional breaks
      - Does not mention the CI label mechanism at all, giving only a vague answer about breaking changes
      - Suggests force-merging or skipping the CI check

  - id: dd-trace-go-control-general-go
    only_warn: true
    files:
      - AGENTS.md
    input: |
      How do I write an HTTP middleware in Go that adds a custom request ID header to every
      incoming request?
    expected_criteria:
      - Implements the middleware as a function that takes and returns http.Handler (or http.HandlerFunc)
      - Correctly extracts or generates a request ID and sets it via r.Header.Set or w.Header().Set
      - Calls the next handler via next.ServeHTTP to pass the request along the chain
    bad_signals:
      - Gives an implementation that only works with dd-trace-go-specific types and is not usable standalone
      - Fails to demonstrate the standard Go middleware pattern (wrapping http.Handler)
      - Confuses middleware with a tracer integration by importing dd-trace-go packages unnecessarily

  - id: dd-trace-go-tracer-doc-update-trigger
    only_warn: true
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I'm adding a new tracer option, WithAdaptiveSampling, which lets users enable an adaptive
      rate-sampling algorithm that adjusts itself based on traffic volume. Which files do I need
      to read before making this change, and where should I document the new behavior once it's done?
    expected_criteria:
      - States that ddtrace/tracer/README.md must be read first for handling API changes, and
        ddtrace/tracer/doc.go must be read for the tracer's existing abilities
      - Identifies this as a significant feature (it changes tracer sampling behavior) and states
        that doc.go must be updated to document it
    bad_signals:
      - Says no documentation update is required for this change
      - Points only to the top-level project README.md or CONTRIBUTING.md instead of the tracer
        package's own doc.go
      - Does not mention reading README.md/doc.go before making the change

  - id: dd-trace-go-tracer-readme-ci-stability
    only_warn: true
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I added a new make target, `make tracer-flake-detect`, that developers run in CI to catch
      flaky tests in the tracer package, helping keep the tracer stable in CI. Do I need to
      document this anywhere?
    expected_criteria:
      - States that ddtrace/tracer/README.md should be updated with the new command, since it is
        a script that enables tracer stability in CI
    bad_signals:
      - Says no documentation update is required
      - Suggests documenting the command only in the top-level project README.md instead of the
        tracer package's own README.md
      - Suggests updating doc.go instead of README.md for a CI script/command

  - id: dd-trace-go-tracer-sampling-env-config
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      Without changing any code, how can I configure the Go tracer at runtime to apply a 100%
      sampling rate to spans named "web.request" from service "test-service", and how does this
      interact with sampling rules already set via tracer.WithSamplingRules in code?
    expected_criteria:
      - Mentions the DD_TRACE_SAMPLING_RULES environment variable, set to a JSON array of objects
      - States that setting this environment variable overrides sampling rules set programmatically
        via tracer.WithSamplingRules
    bad_signals:
      - Says there is no way to configure sampling rules without changing code
      - Gives an incorrect environment variable name
      - Fails to mention that the environment variable takes precedence over WithSamplingRules

  - id: dd-trace-go-tracer-span-limit
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      What happens in the Go tracer if a single trace accumulates an extremely large number of
      spans, such as over 100,000?
    expected_criteria:
      - States that each trace has a hard limit of 100,000 spans
      - States that once the limit is exceeded, the trace is dropped and a diagnostic log message
        is emitted
    bad_signals:
      - Says there is no limit on the number of spans per trace
      - Gives an incorrect limit value
      - Says the trace is silently dropped with no diagnostic log message

  - id: dd-trace-go-tracer-stats-cardinality-limits
    files:
      - ddtrace/tracer/AGENTS.md
    input: |
      I have a high-cardinality service using client-side stats computation (WithStatsComputation)
      in the Go tracer. What cardinality limits exist to protect memory usage, and what happens to
      spans that exceed one of these limits?
    expected_criteria:
      - Mentions at least two of the specific cardinality limit controls (e.g. the whole-key limit
        DD_TRACE_STATS_CARDINALITY_LIMIT / WithStatsCardinalityLimit, default 2048, and/or the
        per-resource limit DD_TRACE_STATS_RESOURCE_CARDINALITY_LIMIT / WithStatsResourceCardinalityLimit,
        default 1024)
      - States that spans exceeding a limit are still counted, but their grouping dimension is
        replaced with a sentinel/placeholder value rather than the span being dropped
      - Mentions the datadog.tracer.stats.collapsed_spans statsd metric used to observe when
        collapsing occurs
    bad_signals:
      - Says spans exceeding a cardinality limit are dropped entirely
      - Does not mention any specific cardinality limit env var or option
      - Gives incorrect default values for the limits

