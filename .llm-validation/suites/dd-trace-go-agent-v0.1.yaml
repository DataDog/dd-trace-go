# ==== CIVisibility Tests ====

  - id: dd-trace-go-civisibility-close-action-order
    files:
      - internal/civisibility/AGENTS.md
    input: |
      Does PushCiVisibilityCloseAction append new close actions to the end of the closeActions 
      slice or prepend them to the front, and what execution order does that produce when CI 
      Visibility shuts down?
    expected_criteria:
      - States it prepends the new action to the front of the slice
      - States this produces LIFO (last registered, first executed) order during shutdown
    bad_signals:
      - Says new actions are appended to the end of the slice
      - Says close actions execute in FIFO/registration order

  - id: dd-trace-go-civisibility-git-command-serialization
    files:
      - internal/civisibility/AGENTS.md
    input: |
      Can two git commands issued by CI Visibility run concurrently, and what specifically enforces the answer?
    expected_criteria:
      - States git command execution is serialized, not concurrent
      - Names the package-level gitCommandMutex, locked immediately before invoking exec.Command and
        unlocked via defer, as the mechanism enforcing this
    bad_signals:
      - Says git commands can run concurrently with no synchronization
      - Attributes the serialization to a different mechanism (e.g. a channel or semaphore) instead of
        gitCommandMutex

  - id: dd-trace-go-civisibility-doc-update-trigger
    only_warn: true
    files:
      - internal/civisibility/AGENTS.md
    input: |
      I just added a new CI Visibility feature (e.g. a new backend-negotiated toggle alongside the
      existing flaky retries/EFD/ITR/impacted tests features). Do I need to update any documentation for
      this, and if so, which file and why?
    expected_criteria:
      - States internal/civisibility/CIVISIBILITY_OVERVIEW.md must be updated when new CI Vis
        functionality is introduced
      - Recognizes that adding a new feature qualifies as such a change
    bad_signals:
      - Says no documentation update is needed for this change
      - Points to a different file instead of internal/civisibility/CIVISIBILITY_OVERVIEW.md, e.g. the
        top-level project README.md or CONTRIBUTING.md

  - id: dd-trace-go-civisibility-feature-override-logging
    files:
      - internal/civisibility/AGENTS.md
    input: |
      Backend settings negotiation enables early flake detection for our test run, but we also have a
      local environment-variable kill switch set that disables it. Does CI Visibility silently honor
      the local override with no trace of what happened, or is there something logged so we can tell
      why the feature ended up disabled?
    expected_criteria:
      - States the local env-var kill switch takes effect and disables the feature even though backend
        settings enabled it
      - States this is not silent -- it's logged when a local override disables a capability that
        backend settings had enabled, specifically to aid troubleshooting
    bad_signals:
      - Says the override happens with no logging at all
      - Says backend settings always win over a local environment-variable kill switch

  - id: dd-trace-go-civisibility-coverage-filename-only-entries
    files:
      - internal/civisibility/AGENTS.md
    input: |
      For a per-test Go code coverage upload, is a files[] entry required to always include
      line-coverage bitmap data, or can an entry validly contain just a filename with no bitmap? If
      the latter is possible, when would that happen?
    expected_criteria:
      - States a files[] entry can validly be filename-only, with no bitmap field, when there is no
        line-coverage data available for that file
      - States the bitmap field (raw Go FileBitmap bytes) is included specifically when line coverage
        is available, e.g. for test files or referenced resources that do have line-level data
    bad_signals:
      - Says every coverage file entry must include bitmap data or the upload is invalid
      - Says filename-only entries are dropped/rejected rather than treated as valid

