# LLM Validation Platform — dd-trace-go config
model: claude-opus-4-8
runs: 3

instruction_files:
  - AGENTS.md
  - contrib/AGENTS.md
  - ddtrace/tracer/AGENTS.md
  - internal/AGENTS.md
  - profiler/AGENTS.md
  - orchestrion/AGENTS.md
  - internal/appsec/AGENTS.md
  - internal/civisibility/AGENTS.md

default_level: gate
presets:
  # One short, low-ambiguity, blocking case per monitored instruction file.
  gate:
    cases:
      - dd-trace-go-general-code-coverage-flags-cap       # AGENTS.md
      - dd-trace-go-contrib-structure                     # contrib/AGENTS.md
      - dd-trace-go-tracer-span-limit                      # ddtrace/tracer/AGENTS.md
      - dd-trace-go-internal-config-source-precedence     # internal/AGENTS.md
      - dd-trace-go-profiler-cpu-duration-clamp            # profiler/AGENTS.md
      - dd-trace-go-appsec-purpose                         # internal/appsec/AGENTS.md
      - dd-trace-go-civisibility-close-action-order        # internal/civisibility/AGENTS.md
      - dd-trace-go-orchestrion-build-time-enabled-check   # orchestrion/AGENTS.md
    runs: 3
  # Three cases per monitored file (the gate case plus two additional ones).
  minimum:
    cases:
      - dd-trace-go-general-code-coverage-flags-cap
      - dd-trace-go-general-codeowners-dual-consumer
      - dd-trace-go-control-general-go
      - dd-trace-go-contrib-structure
      - dd-trace-go-contrib-tags
      - dd-trace-go-contrib-telemetry-registration
      - dd-trace-go-tracer-span-limit
      - dd-trace-go-tracer-sampling-env-config
      - dd-trace-go-tracer-stats-cardinality-limits
      - dd-trace-go-internal-config-source-precedence
      - dd-trace-go-internal-telemetry-dependencies-category
      - dd-trace-go-profiler-cpu-duration-clamp
      - dd-trace-go-profiler-withprofiletypes-forces-metrics
      - dd-trace-go-profiler-aws-lambda-disabled
      - dd-trace-go-appsec-purpose
      - dd-trace-go-appsec-dyngo-role
      - dd-trace-go-appsec-operation-requirements
      - dd-trace-go-civisibility-close-action-order
      - dd-trace-go-civisibility-git-command-serialization
      - dd-trace-go-civisibility-feature-override-logging
      - dd-trace-go-orchestrion-build-time-enabled-check
      - dd-trace-go-orchestrion-yml-structure
      - dd-trace-go-orchestrion-template-function-fields
    runs: 3
  full:
    runs: 3

policy:
  noise_threshold: 1.0
  pairwise_win_floor: 0.45
  blocking_fail_floor: 0.45
  blocking_fail_ci_upper: 0.55

defaults:
  bad_signals:
    - Recommends skipping, disabling, or deleting tests.