# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Git submodules — keeps canonical external test fixtures current.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions — pins to commit SHAs already used in workflows;
  # Dependabot keeps those SHAs current, preventing stale action hijacks.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/dd-ci-upload"
      - "/.github/actions/pr-status-updater"
      - "/.github/actions/setup-go"
      - "/.github/actions/supported_configurations_validation"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 2

  # Docker — updates base image digests (sha256 pins) to latest verified digests.
  - package-ecosystem: "docker"
    directories:
      - "/.gitlab/benchmarks/micro/container"
      - "/contrib/azure/apim-callout/cmd/apim-callout"
      - "/contrib/envoyproxy/go-control-plane/cmd/serviceextensions"
      - "/contrib/haproxy/stream-processing-offload/cmd/spoa"
      - "/contrib/k8s.io/gateway-api/cmd/request-mirror"
      - "/internal/apps"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    groups:
      docker:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 2

  # Docker Compose (dev/local) — updates image digests in the local-development
  # stacks. Version/tag upgrades are allowed here; maintainers curate them.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/internal/apps"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    groups:
      docker-compose-dev:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 2
    ignore:
      # localstack is frozen entirely — no version/tag bumps, no digest refreshes.
      - dependency-name: "localstack/localstack"

  # Docker Compose (reproduction harnesses) — stacks whose whole purpose is to
  # reproduce a customer issue against that customer's exact image version. A
  # bump here doesn't improve the harness, it invalidates it, so the pinned
  # image is frozen outright (tag *and* digest). Kept as its own entry because
  # `ignore` applies per update entry, not per directory, and the dev/local
  # stacks above must keep receiving datadog/agent digest refreshes.
  - package-ecosystem: "docker-compose"
    directories:
      - "/internal/apps/staleidle-soak"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    groups:
      docker-compose-harnesses:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 2
    ignore:
      # No update-types: frozen entirely, digest refreshes included. staleidle-soak
      # pins the agent version from APMS-19533; #5172 bumped it to 7.82.0 and had
      # to be reverted. Any image added to this directory later is still managed —
      # only datadog/agent is frozen.
      - dependency-name: "datadog/agent"

  # Docker Compose (test images) — CI service containers and the Testcontainers
  # image catalog intentionally pin specific (often old) versions to cover
  # compatibility matrices. Only digests are refreshed; version/tag bumps are
  # ignored so the test matrix doesn't silently drift.
  - package-ecosystem: "docker-compose"
    directories:
      - "/.github/testservices"
      - "/instrumentation/testutils/containers/images"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    groups:
      docker-compose-test-images:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 2
    ignore:
      # Dependabot does not support YAML aliases (dependabot-core#1582), so the
      # ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # list below is repeated verbatim for every entry instead of using an anchor/alias.
      - dependency-name: "ghcr.io/datadog/dd-apm-test-agent/ddapm-test-agent"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "cassandra"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "cimg/mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "cimg/postgres"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "mcr.microsoft.com/mssql/server"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "consul"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "elasticsearch"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "docker.elastic.co/elasticsearch/elasticsearch"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "mongo"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "memcached"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "confluentinc/confluent-local"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # No update-types here (unlike the entries above): localstack is frozen
      # entirely, digest refreshes included — see the matching entry in the
      # docker-compose (dev/local) block above for why.
      - dependency-name: "localstack/localstack"
      - dependency-name: "docker.io/postgres"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "vault"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "aerospike"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
