name: OTelc PR

# The pull-request half of the otelc integration lane: ubuntu legs only,
# gated by the changed-components classifier. The macOS and Windows legs
# do not gate pull requests; they run on main-based events through
# otelc.yml, where ci-lane-triage.yml turns their failures into issues.
# The lane body lives in otelc-lane.yml.
#
# No push trigger at all: the merge queue deliberately skips this lane
# (see .github/AGENTS.md), and a bare pull_request trigger cannot fire
# for queue branches.

on:
  pull_request:

permissions:
  id-token: write
  contents: read

concurrency:
  # Cancel superseded runs of the same pull request.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    uses: ./.github/workflows/otelc-lane.yml
    with:
      # Pull requests run the ubuntu legs only, except when the target
      # is a release branch: a macOS/Windows regression on a release
      # gates nothing on main and opens no issue, so those targets
      # keep the full matrix here. This file carries no push trigger,
      # so no merge-queue branch ever reaches it.
      os-list: >-
        ${{ startsWith(github.base_ref, 'release-v') &&
            '["ubuntu", "macos", "windows"]' || '["ubuntu"]' }}

  # A top-level join with the bare check name the lane's own join can
  # no longer report: inside the reusable workflow it reports as
  # "lane / OTelc Integration Tests", which no branch protection rule
  # matches, and it is gated on the classifier while this one runs on
  # !cancelled() so the name always reports.
  integration-test-done:
    name: OTelc Integration Tests
    needs: [lane]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - name: Failure
        if: >-
          contains(fromJSON('["failure", "cancelled"]'),
          needs.lane.result)
        run: echo "Failure!" && exit 1
      - name: Success
        if: needs.lane.result == 'success'
        run: echo "Success!"
