name: OTelc PR

# The pull-request half of the otelc integration lane: ubuntu legs only,
# gated by the changed-components classifier. The macOS and Windows legs
# do not gate pull requests; they run on main-based events through
# otelc.yml, where ci-lane-triage.yml turns their failures into issues.
# The lane body lives in otelc-lane.yml.
#
# No push trigger at all: the merge queue deliberately skips this lane
# (see .github/AGENTS.md), and a bare pull_request trigger cannot fire
# for queue branches.

on:
  pull_request:

permissions:
  id-token: write
  contents: read

concurrency:
  # Cancel superseded runs of the same pull request.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    uses: ./.github/workflows/otelc-lane.yml
    with:
      # Pull requests and the merge queue run the ubuntu legs only,
      # except when the target is a release branch: a macOS/Windows
      # regression on a release gates nothing on main and opens no
      # issue, so those targets keep the full matrix here.
      os-list: >-
        ${{ (startsWith(github.base_ref, 'release-v') ||
             startsWith(github.ref_name, 'mq-working-branch-release-v')) &&
            '["ubuntu", "macos", "windows"]' || '["ubuntu"]' }}

  # A top-level join with the check name the lane used to report
  # directly, so a branch protection rule on it keeps resolving: the
  # called workflow's own join is gated on the classifier, and a
  # skipped check satisfies no required-check rule.
  integration-test-done:
    name: OTelc Integration Tests
    needs: [lane]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - name: Failure
        if: >-
          contains(fromJSON('["failure", "cancelled"]'),
          needs.lane.result)
        run: echo "Failure!" && exit 1
      - name: Skipped
        if: needs.lane.result == 'skipped'
        run: >-
          echo "No changed path requires the integration matrix
          (see .github/ci-components.yml)."
      - name: Success
        if: needs.lane.result == 'success'
        run: echo "Success!"
