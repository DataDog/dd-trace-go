name: Check Pull Request CI Status

on:
  workflow_dispatch: # a manual run on main makes this check selectable in branch protection rules
  pull_request:

permissions:
  # actions: read lets the action resolve each check run to its workflow run
  # for ignore-check-runs-from-other-pull-requests.
  actions: read
  checks: read
  statuses: read

jobs:
  all-jobs-are-green:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ensure CI Success
        uses: DataDog/ensure-ci-success@cccc70e01e12f746739ac9ad158b93439fac4821
        with:
          # The action evaluates only the checks that exist when it polls.
          # The delay must outlast the GitHub fan-out of the trigger event.
          # max-retries holds the ceiling near 3 hours: the OTelc
          # integration matrix runs about 2.5 hours, so a 70-minute
          # ceiling failed the check while those jobs were still running.
          initial-delay-seconds: "300"
          max-retries: "180"
          # A fork PR and its shadow PR share the head commit, so both report
          # check runs with equal names. The action keeps one run per name and
          # can keep the fork run, which fails on permission-gated steps
          # because the fork GITHUB_TOKEN is read-only. This option ignores
          # the check runs of the fork PR.
          ignore-check-runs-from-other-pull-requests: "true"
          ignored-name-patterns: |
            devflow/merge
            devflow/mergegate
            label_issues
            check-title
            dd-gitlab/.*
            DDCI Status
            errtrack-audit

# Reason for ignored-name-patterns:
#
# * devflow/merge: merge-queue job. Do not remove it.
# * devflow/mergegate: stays pending until codeowners approve the PR and the
#   other checks pass. Ignoring it separates PRs that wait for review from
#   PRs with real CI failures.
# * check-title: validates the PR title. Branch protection enforces it. Do
#   not remove it.
# * dd-gitlab/.* and DDCI Status: internal GitLab statuses. GitHub cannot
#   re-run them, and DDCI Status is "Not required to merge". Reporting them
#   as failures of this workflow sends people to the wrong place.
# * errtrack-audit: advisory job. A run failure (infra, a broken package
#   graph) must not block the PR; the PR comment reports the findings. The
#   tool's own tests run in the gated check-modules job in static-checks, so
#   a regression in the tool still blocks.
