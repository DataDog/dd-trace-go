name: Check Pull Request CI Status

on:
  workflow_dispatch: # a manual run on main makes this check selectable in branch protection rules
  pull_request:

permissions:
  # actions: read lets the action resolve each check run to its workflow run
  # for ignore-check-runs-from-other-pull-requests.
  actions: read
  checks: read
  contents: read
  statuses: read

jobs:
  all-jobs-are-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adaptive wait script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/apps/adaptive-ci-wait.sh
          sparse-checkout-cone-mode: false
      - name: Adaptive CI Wait
        id: adaptive-wait
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_JOB_NAME: ${{ github.job }}
          IGNORED_NAME_PATTERNS: |
            devflow/merge
            devflow/mergegate
            label_issues
            check-title
            dd-gitlab/.*
            DDCI Status
        run: bash .github/workflows/apps/adaptive-ci-wait.sh
      - name: Run Ensure CI Success
        uses: DataDog/ensure-ci-success@c81123e3564e2474642c8c7337372b304d731c1b
        with:
          # The adaptive wait step checks at half the average running time of
          # the repo's longest jobs and halves the interval down to 5 minutes.
          # Once at 5 minutes, ensure-ci-success polls every 5 minutes until
          # the 3-hour ceiling is reached.
          initial-delay-seconds: ${{ steps.adaptive-wait.outputs.next-delay-seconds }}
          polling-interval-seconds: "300"
          max-retries: ${{ steps.adaptive-wait.outputs.remaining-retries }}
          # A fork PR and its shadow PR share the head commit, so both report
          # check runs with equal names. The action keeps one run per name and
          # can keep the fork run, which fails on permission-gated steps
          # because the fork GITHUB_TOKEN is read-only. This option ignores
          # the check runs of the fork PR.
          ignore-check-runs-from-other-pull-requests: "true"
          ignored-name-patterns: |
            devflow/merge
            devflow/mergegate
            label_issues
            check-title
            dd-gitlab/.*
            DDCI Status

# Reason for ignored-name-patterns:
#
# * devflow/merge: merge-queue job. Do not remove it.
# * devflow/mergegate: stays pending until codeowners approve the PR and the
#   other checks pass. Ignoring it separates PRs that wait for review from
#   PRs with real CI failures.
# * check-title: validates the PR title. Branch protection enforces it. Do
#   not remove it.
# * dd-gitlab/.* and DDCI Status: internal GitLab statuses. GitHub cannot
#   re-run them, and DDCI Status is "Not required to merge". Reporting them
#   as failures of this workflow sends people to the wrong place.
