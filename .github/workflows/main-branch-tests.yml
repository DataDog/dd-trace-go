name: Main Branch and Release Tests

on:
  push:
    branches:
      - release-v*
      - dev-v*
      - mq-working-branch-**
    tags-ignore:
      - 'contrib/**'
      - 'instrumentation/**'
      - 'internal/**'
      - 'orchestrion/**'
      - 'scripts/**'
  schedule: # nightly
    - cron: "0 0 * * *"

permissions: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration-tests:
    uses: ./.github/workflows/unit-integration-tests.yml
    permissions:
      contents: read
      id-token: write
    with:
      go-version: "1.27" # Should be the highest supported version of Go

  warm-repo-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actions/cache v6.1.0. This push-only producer intentionally saves `.git`
      # under a repository-ID and immutable commit-SHA key for downstream tests.
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning]
        with:
          path: .git
          key: gitdb-${{ github.repository_id }}-${{ github.sha }}

  multios-unit-tests:
    needs:
      - warm-repo-cache
    strategy:
      matrix:
        runs-on: [ macos-latest, windows-latest, ubuntu-latest ]
        go-version: [ "1.26", "1.27" ]
      fail-fast: false
    uses: ./.github/workflows/multios-unit-tests.yml
    permissions:
      contents: read
      id-token: write
    with:
      go-version: ${{ matrix.go-version }}
      runs-on: ${{ matrix.runs-on }}

  # Stable pre-tag gate consumed by Gardener. `always()` makes skipped or
  # cancelled dependencies visible; the explicit result checks then fail
  # closed rather than allowing a skipped aggregate to hide missing tests.
  release-tests-complete:
    if: ${{ always() }}
    needs:
      - unit-integration-tests
      - warm-repo-cache
      - multios-unit-tests
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every release test group to succeed
        env:
          UNIT_INTEGRATION_RESULT: ${{ needs.unit-integration-tests.result }}
          WARM_REPO_CACHE_RESULT: ${{ needs.warm-repo-cache.result }}
          MULTIOS_UNIT_RESULT: ${{ needs.multios-unit-tests.result }}
        run: |
          test "${UNIT_INTEGRATION_RESULT}" = success
          test "${WARM_REPO_CACHE_RESULT}" = success
          test "${MULTIOS_UNIT_RESULT}" = success