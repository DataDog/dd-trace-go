name: Main Branch and Release Tests

on:
  push:
    branches:
      - release-v*
      - mq-working-branch-**
    tags-ignore:
      - 'contrib/**'
      - 'instrumentation/**'
      - 'internal/**'
      - 'orchestrion/**'
      - 'otelc/**'
      - 'scripts/**'
  schedule: # nightly
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration-tests:
    uses: ./.github/workflows/unit-integration-tests.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      go-version: "1.27" # Should be the highest supported version of Go
    secrets: inherit

  warm-repo-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: gitdb-${{ github.repository_id }}-${{ github.sha }}

  multios-unit-tests:
    needs:
      - warm-repo-cache
    strategy:
      matrix:
        runs-on: [ macos-latest, windows-latest, ubuntu-latest ]
        go-version: [ "1.26", "1.27" ]
      fail-fast: false
    uses: ./.github/workflows/multios-unit-tests.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      go-version: ${{ matrix.go-version }}
      runs-on: ${{ matrix.runs-on }}
    secrets: inherit
  # Re-derives the reverse-dependency facts recorded in .github/ci-components.yml
  # against `go list -deps`. Those facts decide which tests a change to a leaf
  # package can skip, and they go stale the moment someone adds an import. Too
  # slow for the pull request path (it runs `go list` in every workspace module),
  # so it is verified here instead.
  ci-components-depgraph:
    name: Verify ci-components dependency facts
    # Nightly only. This workflow also triggers on push to
    # mq-working-branch-**, and these facts describe the dependency graph of
    # `main`, not of the pull request under test -- so in the merge queue the
    # check fails for whoever happens to be queued when somebody else's merge
    # changes an import. It reports drift; it must not gate a merge.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The dd-sts step below needs an OIDC token to mint a short-lived
    # Datadog API key. Nothing else in this job needs more than read access.
    permissions:
      contents: read
      id-token: write
    env:
      TEST_RESULTS: /tmp/test-results # path to where test results will be saved
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Restore and install development tools
        uses: ./.github/actions/tools-cache
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
      # The JUnit file makes failures of this nightly job visible in Datadog
      # CI Visibility, not only in the GitHub Actions log.
      - name: Verify dependent-modules
        run: |
          export PATH="${{ github.workspace }}/bin:${PATH}"
          mkdir -p "$TEST_RESULTS"
          gotestsum --junitfile "${TEST_RESULTS}/gotestsum-report-depgraph.xml" \
            -- -tags depgraph \
            -run TestDependentModulesAreAccurate ./scripts/ciselect/
      - name: Get Datadog credentials
        id: dd-sts
        if: always()
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2
        with:
          policy: dd-trace-go
      - name: Upload the results to Datadog CI App
        if: always()
        continue-on-error: true
        uses: ./.github/actions/dd-ci-upload
        with:
          dd-api-key: ${{ steps.dd-sts.outputs.api_key }}
          path: ${{ env.TEST_RESULTS }}
          tags: go:stable,arch:${{ runner.arch }},os:${{ runner.os }}
