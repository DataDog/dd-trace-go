# Cold-build A/B experiment for the Windows Dev Drive change (APMLP-2248).
#
# Tests the placement hypothesis in isolation: both arms run with NO cache
# restore at all, so the only difference is where GOCACHE and GOMODCACHE
# live (default user-profile paths on the OS volume vs the Dev Drive). The
# result survives any cache policy decided in #5907/#5908.
#
# Push-triggered on purpose: the push event uses the workflow file as it
# exists on the pushed ref, while workflow_dispatch only works for
# workflows registered on the default branch. This branch is dedicated to
# the experiment, so every push runs it. It is never registered in
# .github/ci-components.yml, so it cannot gate a pull request.
name: Windows cache-path cold-build experiment

on:
  push:
    branches: [windows-dev-drive-experiment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm:
    name: exp-${{ matrix.arm }}-${{ matrix.class }}-${{ matrix.repeat }}
    runs-on: >-
      ${{ matrix.class == 'shared8' &&
      fromJson('{"labels":"windows-shared-8core",
      "group":"LARGE WINDOWS SHARED"}') || 'windows-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arm: [default, devdrive]
        class: [standard, shared8]
        repeat: [1, 2, 3, 4, 5]
    env:
      DD_APPSEC_WAF_TIMEOUT: 1h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: recursive

      # The treatment: redirect GOCACHE and GOMODCACHE onto a Dev Drive
      # before anything Go runs. On standard runners this reuses the
      # image-provided D:; on the shared 8-core class it provisions the
      # VHDX, and that setup time is part of this arm's cost.
      - name: Provision Windows Dev Drive
        if: ${{ matrix.arm == 'devdrive' && runner.os == 'Windows' }}
        uses: ./.github/actions/windows-dev-drive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Record cache paths (the treatment check)
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
          CLASS: ${{ matrix.class }}
          REPEAT: ${{ matrix.repeat }}
        run: |
          echo "experiment: arm=${ARM} class=${CLASS} repeat=${REPEAT}"
          go env GOCACHE GOMODCACHE

      - name: Install gotestsum
        shell: bash
        run: |
          source ./.github/workflows/apps/go-retry.sh
          retry_on_corruption go install gotest.tools/gotestsum@latest

      # Same test selection and flags as the multios test job, so the
      # numbers are comparable to that lane's cold-miss runs.
      - name: Cold build and test (multios selection)
        shell: bash
        run: |
          go list ./... \
            | grep -v -e google.golang.org/api -e sarama \
                     -e confluent-kafka-go -e cmemprof \
            | sort >packages.txt
          # shellcheck disable=SC2046
          gotestsum --junitfile report.xml -- $(cat packages.txt) \
            -v -coverprofile=coverage.txt -covermode=atomic -timeout 15m
