name: Static Checks

on:
  pull_request:
  push:
    branches:
      - release-*
      - mq-working-branch-**
    tags-ignore:
      - "contrib/**"
      - "instrumentation/**"
      - "internal/**"
      - "orchestrion/**"
      - "scripts/**"
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string
      ref:
        description: "The branch to run the workflow on"
        required: true
        type: string

env:
  GOPROXY: "https://proxy.golang.org|direct" # fall back to `direct` on any proxy error (5xx, timeout, dropped stream) -- not just 404/410, which is all a comma-separated GOPROXY falls through on
  # Users may build our library with GOTOOLCHAIN=local. If they do, and our
  # go.mod file specifies a newer Go version than their local toolchain, their
  # build will break. Run our tests with GOTOOLCHAIN=local to ensure that
  # our library builds with all of the Go versions we claim to support,
  # without having to download a newer one.
  GOTOOLCHAIN: local
  GODEBUG: "x509negativeserial=1"
  GOLANGCI_LINT_VERSION: v2.12.2 # NOTICE: Make sure this is synced with the version in the _tools/go.mod file.

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Classifies the PR diff against .github/ci-components.yml. Fails open: every
  # gate is enabled if the diff cannot be determined or the classifier errors,
  # and for every event other than pull_request.
  #
  # These jobs set no `name:`, so their check-run names are the job keys, and
  # `DataDog/ensure-ci-success` in all-green.yml counts a 'skipped' conclusion
  # as success. No join job is needed here.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.detect.outputs.static-any }}
      actions: ${{ steps.detect.outputs.static-actions }}
      copyright: ${{ steps.detect.outputs.static-copyright }}
      modules: ${{ steps.detect.outputs.static-modules }}
      docs: ${{ steps.detect.outputs.static-docs }}
      format: ${{ steps.detect.outputs.static-format }}
      lint: ${{ steps.detect.outputs.static-lint }}
      supported-config: ${{ steps.detect.outputs.static-supported-config }}
      checklocks: ${{ steps.detect.outputs.static-checklocks }}
      cross-compile: ${{ steps.detect.outputs.static-cross-compile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # HEAD is the merge commit; HEAD^1 is the base tip
      - name: Detect
        id: detect
        uses: ./.github/actions/changed-components
  # Populate the shared tools cache once, before the jobs below need it. When every
  # job races to install tools and save the same cache key on a miss, only one wins
  # the cache reservation and a failing job never saves at all (actions/cache skips
  # the post step), so the cache can stay permanently cold. Mirrors the
  # warm-repo-cache pattern in pull-request.yml.
  warm-tools-cache:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version || 'stable' }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin

  copyright:
    needs: [changes, warm-tools-cache]
    if: github.event_name != 'pull_request' || needs.changes.outputs.copyright == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version || 'stable' }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin
      - name: Copyright
        run: |
          go run ./scripts/check_copyright.go
      - name: Run miscellaneous linters (copyright, Makefiles)
        run: |
          export PATH="${{ github.workspace }}/bin:${PATH}"
          make lint/misc

  check-github-actions:
    needs: [changes, warm-tools-cache]
    if: github.event_name != 'pull_request' || needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version || 'stable' }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin
      - name: Lint GitHub Actions workflows
        run: |
          export PATH="${{ github.workspace }}/bin:${PATH}"
          make lint/action

  check-modules:
    needs: [changes, warm-tools-cache]
    if: github.event_name != 'pull_request' || needs.changes.outputs.modules == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version || 'stable' }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin
      - name: Run fixmodules
        run: |-
          export PATH="${{ github.workspace }}/bin:${PATH}"
          ./scripts/fix_modules.sh
      - name: Check for changes
        run: git diff --exit-code

  check-docs:
    needs: [changes, warm-tools-cache]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version || 'stable' }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin
      - name: Update documentation
        run: |-
          export PATH="${{ github.workspace }}/bin:${PATH}"
          make docs
      - name: Check for changes
        run: git diff --exit-code

  check-format:
    needs: [changes, warm-tools-cache]
    if: github.event_name != 'pull_request' || needs.changes.outputs.format == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version || 'stable' }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin
      - name: Format
        run: |-
          export PATH="${{ github.workspace }}/bin:${PATH}"
          make format
      - name: Check for changes
        run: git diff --exit-code

  lint:
    needs: [changes, warm-tools-cache]
    if: github.event_name != 'pull_request' || needs.changes.outputs.lint == 'true'
    runs-on:
      group: "APM Larger Runners"
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2.10.0
        with:
          golangci_lint_flags: "--timeout 10m" # We are hitting timeout when there is no cache
          go_version: ${{ inputs.go-version }}
          golangci_lint_version: ${{ env.GOLANGCI_LINT_VERSION }}
          fail_level: error
          reporter: github-pr-review
          filter_mode: nofilter

      - name: golangci-lint (internal/orchestrion/_integration)
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2.10.0
        with:
          golangci_lint_flags: "--timeout 10m --disable=gocritic" # We are hitting timeout when there is no cache
          go_version: ${{ inputs.go-version }}
          golangci_lint_version: ${{ env.GOLANGCI_LINT_VERSION }}
          fail_level: error
          reporter: github-pr-review
          workdir: internal/orchestrion/_integration
          filter_mode: nofilter

      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version || 'stable' }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin

      - name: constantlogmsg analyzer (make lint/errlog)
        run: make lint/errlog

      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-go
          policy: self.static-checks-shellcheck

      - name: shellcheck
        uses: reviewdog/action-shellcheck@0722bbdb0d47f04c1b53b8734d2422ac63a45ec6 # v1.32.1
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          reporter: github-pr-review
          fail_level: warning
          path: ./scripts
          pattern: "**/*.sh"
          filter_mode: nofilter

  check-supported-config:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.supported-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || 'stable' }}
          cache: false
      - name: Verify supported_configurations.json and generated code are in sync
        run: go run ./scripts/configinverter/main.go check

  checklocks:
    needs: [changes, warm-tools-cache]
    if: github.event_name != 'pull_request' || needs.changes.outputs.checklocks == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: stable
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin
      - name: Run checklocks
        run: |-
          export PATH="${{ github.workspace }}/bin:${PATH}"
          ./scripts/checklocks.sh

  cross-compile:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.cross-compile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || 'stable' }}
          cache: false
      - name: Cross-compile all first-class Go ports
        run: ./scripts/cross_build.sh
