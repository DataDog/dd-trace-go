name: OTelc
on:
  workflow_dispatch:
    inputs:
      otelc-version:
        description: OTelc version to use for integration testing (defaults to the pinned one)
        type: string
        required: false
  pull_request:
  push:
    branches:
      - release-v*
      # The merge queue is not gated (see CONTRIBUTING.md): a queued commit
      # re-runs the lanes that trigger on mq-working-branch-** in full, this one
      # now included, so a narrowed pull request cannot skip this lane here.
      - mq-working-branch-**
    tags-ignore:
      - 'contrib/**'
      - 'instrumentation/**'
      - 'internal/**'
      - 'orchestrion/**'
      - 'otelc/**'
      - 'scripts/**'
  schedule: # nightly
    - cron: "0 0 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  # Automatically cancel previous runs if a new one is triggered to conserve resources.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ inputs.otelc-version && format('-{0}', inputs.otelc-version) }}
  cancel-in-progress: true

env:
  # The single place to bump the tested otelc release. Upstream only; do not point
  # this at a fork.
  OTELC_VERSION: ${{ inputs.otelc-version || 'v1.2.1-0.20261015110818-d3d72efe9f25' }}
  # Modules otelc reads, tidied by both jobs next to the application each one
  # builds.
  OTELC_MODULES: >-
    otelc/all
    contrib/99designs/gqlgen
    contrib/99designs/gqlgen/otelc
    contrib/aws/aws-sdk-go
    contrib/aws/aws-sdk-go/otelc
    contrib/net/http
    contrib/net/http/otelc
    contrib/database/sql
    contrib/database/sql/otelc
    contrib/gin-gonic/gin
    contrib/gin-gonic/gin/otelc
    contrib/go-chi/chi
    contrib/go-chi/chi/otelc
    contrib/go-chi/chi.v5
    contrib/go-chi/chi.v5/otelc
    contrib/gofiber/fiber.v2
    contrib/gofiber/fiber.v2/otelc
    contrib/julienschmidt/httprouter
    contrib/julienschmidt/httprouter/otelc
    contrib/gomodule/redigo
    contrib/gomodule/redigo/otelc
    contrib/google.golang.org/grpc
    contrib/google.golang.org/grpc/otelc
    contrib/go.mongodb.org/mongo-driver
    contrib/go.mongodb.org/mongo-driver/otelc
    contrib/go.mongodb.org/mongo-driver.v2
    contrib/go.mongodb.org/mongo-driver.v2/otelc
    contrib/gorilla/mux
    contrib/gorilla/mux/otelc
    contrib/labstack/echo.v4
    contrib/labstack/echo.v4/otelc
    contrib/labstack/echo.v5
    contrib/labstack/echo.v5/otelc
    contrib/valyala/fasthttp
    contrib/valyala/fasthttp/otelc
  # Suites under internal/orchestrion/_integration that run with otelc.
  OTELC_TEST_PACKAGES: >-
    otelc
    gls
    gls-leak
    gls-unfinished
    otelc-autostart
    net_http
    sql
    gin
    chi
    chi.v5
    fiber.v2
    julienschmidt_httprouter
    redigo
    grpc
    gorilla_mux
    99designs.gqlgen
    mongo
    mongo.v2
    echo.v4
    echo.v5
    aws.v1
    valyala_fasthttp

jobs:
  # Classifies the PR diff against .github/ci-components.yml. Fails open: every
  # gate is enabled if the diff cannot be determined or the classifier errors,
  # and for every event other than pull_request.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      otelc: ${{ steps.detect.outputs.otelc }}
      otelc-suites: ${{ steps.detect.outputs.otelc-suites }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # HEAD is the merge commit; HEAD^1 is the base tip
      - name: Detect
        id: detect
        uses: ./.github/actions/changed-components
  go-versions-matrix:
    name: Go Versions Matrix
    runs-on: ubuntu-latest
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.otelc == 'true'
    outputs:
      json: ${{ steps.matrix.outputs.json }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.26.4"
          workload: otelc-matrix
          cache-provider: github-cache
          cache: "false"
      - name: Compute Matrix
        id: matrix
        run: |-
          echo -n "json="                      >> "${GITHUB_OUTPUT}"
          go run ./internal/orchestrion/matrix >> "${GITHUB_OUTPUT}"

  integration-test:
    env:
      REPORT: gotestsum-report-otelc.xml
      # The suites the classifier selected: space-separated names, or the
      # tokens ALL / NONE (empty means the selector failed; read it as ALL).
      OTELC_SUITES: ${{ needs.changes.outputs.otelc-suites }}
      # Workspace mode resolves modules differently from the module graph otelc
      # analyzes, and it breaks outright when otelc and dd-trace-go disagree on
      # their `go` directive. Same reason the orchestrion lane disables it.
      GOWORK: 'off'
    needs:
      - changes
      - go-versions-matrix
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.otelc == 'true'
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu
          - macos
          - windows
        go-version: ${{ fromJSON(needs.go-versions-matrix.outputs.json) }}
    name: Integration Test (${{ matrix.runs-on }} | ${{ matrix.go-version }})
    runs-on: ${{ matrix.runs-on == 'ubuntu' && fromJson('{"labels":"ubuntu-8-core-latest","group":"Large Runner Shared Public"}') || (matrix.runs-on == 'windows' && fromJson('{"labels":"windows-shared-8core","group":"LARGE WINDOWS SHARED"}')) || format('{0}-latest', matrix.runs-on) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go-version }}
          workload: otelc-integration
          variant: |-
            {"runner":"${{ matrix.runs-on }}",
             "instrumentation":"otelc",
             "version":${{ toJSON(env.OTELC_VERSION) }},
             "workspace":"off"}

      # Deliberately not tools-cache: `make tools-install` also installs
      # checkmake, which the tools cache does not cover.
      - name: Install development tools
        run: make tools-install

      # `go install` is enough: unlike the upstream Makefile's `make install`, it
      # produces a binary that resolves rules purely from this repository's tool
      # files, which is all these suites need.
      # shell: bash matters here. The Windows default is PowerShell, where
      # ${OTELC_VERSION} expands to nothing and the install fails with
      # "version must not be empty".
      - name: Install otelc binary
        shell: bash
        run: go install "go.opentelemetry.io/otelc/tool/cmd/otelc@${OTELC_VERSION}"

      # GitHub runs this on a candidate merge commit, so dependency updates landed
      # on main since the branch was cut can leave go.mod/go.sum stale.
      #
      # otelc/all is tidied too, unlike the orchestrion lane. Auto-pin follows
      # _integration/otel.instrumentation.go into otelc/all and runs a read-only
      # `go list` there, so a stale go.mod in otelc/all fails the whole lane with
      # "updates to go.mod needed".
      - name: Run 'go mod tidy'
        shell: bash
        run: |-
          source .github/workflows/apps/go-retry.sh
          for dir in internal/orchestrion/_integration ${OTELC_MODULES}; do
            retry_on_corruption go -C "${dir}" mod tidy
          done

      # A rule that injects an import into a package otelc compiles inside a
      # nested build poisons the cache for that package: the nested build
      # drops -toolexec, so its archive is uninstrumented, and it lands under
      # the same action ID as the main build's. In a normal-parallelism run
      # that only races, which is why it surfaced as an intermittent
      # "fingerprint mismatch" link failure on random matrix legs (see the
      # dyngo fix that made the package import what its GLS rules inject).
      # Building aws.v1 serially makes the nested build cache the poisoned
      # archive before the main build reaches the dependency, so a
      # reintroduced nested resolution fails this step on every run instead
      # of flaking. It must run before "Run Tests": the warm cache that step
      # leaves behind would mask the poison.
      - name: Catch nested import resolution deterministically
        shell: bash
        run: otelc go build ./aws.v1/mainapp
        working-directory: internal/orchestrion/_integration
        env:
          # -p belongs in GOFLAGS, not on the command line: the nested build
          # otelc spawns re-reads GOFLAGS, and that is the build whose order
          # must be pinned. Archives produced here are reused by "Run Tests"
          # (same tag, same GOOS/GOARCH), so the lane pays only for the
          # serialization of a build it does anyway.
          GOFLAGS: -p=1 -tags=githubci

      - name: Run Tests
        shell: bash
        run: |-
          export PATH="${{ github.workspace }}/bin:${PATH}"
          otelc version

          PREFIX=github.com/DataDog/dd-trace-go/v2/internal/orchestrion/_integration
          # The classifier names the suites this change exercises. ALL, NONE
          # and empty keep the full list; the run script below skips suites
          # this platform cannot build either way.
          PACKAGE_NAMES=""
          case "${OTELC_SUITES}" in
          "" | "NONE" | "ALL")
            for pkg in ${OTELC_TEST_PACKAGES}; do
              PACKAGE_NAMES+=" ${PREFIX}/${pkg}"
            done
            ;;
          *)
            for pkg in ${OTELC_SUITES}; do
              PACKAGE_NAMES+=" ${PREFIX}/${pkg}"
            done
            ;;
          esac
          export PACKAGE_NAMES
          echo "Running otelc tests for: ${PACKAGE_NAMES}"

          RUN_SCRIPT="${RUNNER_TEMP}/run-otelc-tests.sh"
          cat > "${RUN_SCRIPT}" <<'EOF'
          #!/usr/bin/env bash
          set -o pipefail
          rc=0
          for pkg in ${PACKAGE_NAMES}; do
            # Some suites only build on Linux in CI (//go:build linux || !githubci),
            # and otelc fails on a package with no Go files left to build. Stdout
            # is parsed as test2json, so the notice goes to stderr.
            if [[ "$(go list -e -f '{{len .GoFiles}}{{len .TestGoFiles}}{{len .XTestGoFiles}}' "${pkg}")" == "000" ]]; then
              echo "Skipping ${pkg}: no Go files for this platform" >&2
              continue
            fi
            raw="${RUNNER_TEMP}/otelc-raw-$(echo "${pkg}" | tr '/' '_').log"
            otelc go test -v -shuffle=on "${pkg}" > "${raw}" 2>&1
            status=$?
            go tool test2json -t -p "${pkg}" < "${raw}"
            if [[ "${status}" -ne 0 ]]; then
              echo "::group::Raw output for ${pkg} (exit ${status})" >&2
              cat "${raw}" >&2
              echo "::endgroup::" >&2
              rc=1
            fi
          done
          exit "${rc}"
          EOF

          gotestsum --junitfile "${XML_PATH}" --raw-command -- bash "${RUN_SCRIPT}"
        working-directory: internal/orchestrion/_integration
        env:
          # otelc-autostart shells out to a nested `otelc go build`, which
          # recompiles the dependency closure, so this lane needs more headroom
          # than a normal test run.
          GOFLAGS: -timeout=30m ${{ matrix.runs-on == 'ubuntu' && '-p=4' || '' }} -tags=githubci
          XML_PATH: ${{ runner.temp }}${{ matrix.runs-on == 'windows' && '\' || '/' }}${{ env.REPORT }}

      - name: Run Config Inverter Check
        if: always()
        run: |
          git diff internal/env/supported_configurations.json
          cd scripts/configinverter && go run main.go -input ../../internal/env/supported_configurations.json check

      - name: Get Datadog credentials
        id: dd-sts
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2
        with:
          policy: dd-trace-go
      - name: Upload the results to Datadog CI App
        if: always()
        continue-on-error: true
        uses: ./.github/actions/dd-ci-upload
        with:
          dd-api-key: ${{ steps.dd-sts.outputs.api_key }}
          path: ${{ runner.temp }}${{ matrix.runs-on == 'windows' && '\' || '/' }}
          tags: go:${{ steps.setup-go.outputs.go-version }},arch:${{ runner.arch }},os:${{ runner.os }}

  # Catches breakage the suites above cannot see, since they are all applications
  # inside this module. See scripts/build_otelc_external_app.sh.
  external-app:
    name: External Application Build
    env:
      GOWORK: 'off'
    needs:
      - changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.otelc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.26.4"
          workload: otelc-external-app
          variant: |-
            {"instrumentation":"otelc",
             "version":${{ toJSON(env.OTELC_VERSION) }},
             "workspace":"off"}

      - name: Install otelc binary
        shell: bash
        run: go install "go.opentelemetry.io/otelc/tool/cmd/otelc@${OTELC_VERSION}"

      # Same reason as the integration-test lane: GitHub builds a candidate merge
      # commit, so dependency updates landed on main since the branch was cut can
      # leave these stale, and otelc fails with "updates to go.mod needed" for any
      # module it reads.
      - name: Run 'go mod tidy'
        shell: bash
        run: |-
          source .github/workflows/apps/go-retry.sh
          for dir in internal/apps/otelc-external-app ${OTELC_MODULES}; do
            retry_on_corruption go -C "${dir}" mod tidy
          done

      - name: Build an application outside this module
        shell: bash
        run: ./scripts/build_otelc_external_app.sh

  # A single join point, so branch protection has one check to require.
  integration-test-done:
    name: OTelc Integration Tests
    needs:
      - changes
      - go-versions-matrix
      - integration-test
      - external-app
    runs-on: ubuntu-latest
    if: '!cancelled()'
    steps:
      # 'skipped' is only a pass when the classifier actually turned the
      # suite off. GitHub applies an implicit success() to every `needs:`,
      # so a failing go-versions-matrix would skip integration-test, and
      # accepting that skip would carry this gate green. Both are
      # dependencies here, and when the gate is on integration-test and
      # external-app must have really succeeded.
      - name: Failure
        if: >-
          needs.changes.result != 'success'
          || contains(fromJSON('["failure", "cancelled"]'),
          needs.go-versions-matrix.result)
          || contains(fromJSON('["failure", "cancelled"]'),
          needs.integration-test.result)
          || contains(fromJSON('["failure", "cancelled"]'),
          needs.external-app.result)
          || (needs.changes.outputs.otelc == 'true'
              && (needs.integration-test.result != 'success'
                  || needs.external-app.result != 'success'))
        run: echo "Failure!" && exit 1
      - name: Skipped
        if: needs.integration-test.result == 'skipped'
        run: >-
          echo "No changed path requires otelc tests
          (see .github/ci-components.yml)."
      - name: Success
        run: echo "Success!"
