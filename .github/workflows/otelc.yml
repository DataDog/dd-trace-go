name: OTelc

# The main-based half of the otelc integration lane: every push to main
# re-runs the full OS matrix minutes after landing (macOS/Windows legs no
# longer gate pull requests), the nightly schedule keeps the full matrix
# and seeds the caches, release branches keep their coverage, and a
# dispatch can pin an upstream otelc version. Failures of the macOS and
# Windows legs are turned into issues by ci-lane-triage.yml.
#
# The lane body lives in otelc-lane.yml; pull requests run it through
# otelc-pr.yml with the ubuntu legs only.

on:
  workflow_dispatch:
    inputs:
      otelc-version:
        description: OTelc version override (defaults to the pinned one)
        type: string
        required: false
  push:
    branches:
      - main
      - release-v*
      # Not on mq-working-branch-**: the merge queue deliberately skips this
      # lane (see .github/AGENTS.md).
    tags-ignore:
      - 'contrib/**'
      - 'instrumentation/**'
      - 'internal/**'
      - 'orchestrion/**'
      - 'otelc/**'
      - 'scripts/**'
  schedule: # nightly
    - cron: "0 0 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  # Cancel superseded runs to conserve resources.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ inputs.otelc-version && format('-{0}', inputs.otelc-version) }}
  cancel-in-progress: true

jobs:
  lane:
    uses: ./.github/workflows/otelc-lane.yml
    with:
      # Main-based events run every OS: this is where the macOS and
      # Windows coverage lives now that pull requests do not gate on it.
      os-list: '["ubuntu", "macos", "windows"]'
      otelc-version: ${{ inputs.otelc-version }}
    secrets: inherit
