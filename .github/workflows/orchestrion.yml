name: Orchestrion
on:
  workflow_call: # From github.com/DataDog/orchestrion
    inputs:
      orchestrion-version:
        description: Orchestrion version to use for integration testing
        type: string
        required: true
      collect-coverage:
        description: Whether to collect orchestrion coverage data or not
        type: boolean
        default: false
        required: false
      benchmarks-ref:
        description: Branch of DataDog/apm-sdks-benchmarks to build the benchmark apps from
        type: string
        default: main
        required: false
  workflow_dispatch: # On-demand runs; the `push` trigger below only covers release-v* branches,
                     # so `main` is otherwise only exercised by the nightly schedule.
    inputs:
      benchmarks-ref:
        description: Branch of DataDog/apm-sdks-benchmarks to build the benchmark apps from
        type: string
        default: main
  pull_request:
  push:
    branches:
      - release-v*
    tags-ignore:
      - 'contrib/**'
      - 'instrumentation/**'
      - 'internal/**'
      - 'orchestrion/**'
      - 'otelc/**'
      - 'scripts/**'
  schedule: # nightly
    - cron: "0 0 * * *"

env:
  GOPROXY: "https://proxy.golang.org|direct" # fall back to `direct` on any proxy error (5xx, timeout, dropped stream) -- not just 404/410, which is all a comma-separated GOPROXY falls through on
  # The dd-trace-go commit the jobs in this workflow test. On a cross-repo
  # workflow_call (from DataDog/orchestrion) the caller's own sha is meaningless
  # here, so it is `main`, mirroring the repository:/ref: pattern of the other
  # jobs. On a pull request it is the PR head sha, which the module proxy can
  # resolve through refs/pull/N/head (github.sha is the ephemeral merge commit).
  DD_TRACE_GO_REF: ${{ inputs.orchestrion-version != '' && 'main' || github.event.pull_request.head.sha || github.sha }}

permissions:
  id-token: write
  contents: read

concurrency:
  # Automatically cancel previous runs if a new one is triggered to conserve resources.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ inputs.orchestrion-version && format('-{0}', inputs.orchestrion-version) }}
  cancel-in-progress: true

jobs:
  # Classifies the PR diff against .github/ci-components.yml. Fails open: every
  # gate is enabled if the diff cannot be determined or the classifier errors,
  # and for every event other than pull_request.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      orchestrion: ${{ steps.detect.outputs.orchestrion }}
      benchmark-apps: ${{ steps.detect.outputs.benchmark-apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # HEAD is the merge commit; HEAD^1 is the base tip
      - name: Detect
        id: detect
        uses: ./.github/actions/changed-components
  generate:
    name: Verify generated files are up-to-date
    needs:
      - changes
    # Don't run in workflow_call or workflow_dispatch
    if: >-
      (github.event_name == 'workflow_dispatch' || inputs.orchestrion-version == '')
      && (github.event_name != 'pull_request' || needs.changes.outputs.orchestrion == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.27"
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin
      - name: Run generator
        run: |-
          export PATH="${{ github.workspace }}/bin:${PATH}"
          ./scripts/generate.sh
      - name: Check for changes
        run: git diff --exit-code

  go-versions-matrix:
    name: Go Versions Matrix
    needs:
      - changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.orchestrion == 'true'
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.matrix.outputs.json }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.orchestrion-version != '' && 'DataDog/dd-trace-go' || github.repository }}
          ref: ${{ inputs.orchestrion-version != '' && 'main' || github.sha }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: '**/go.mod'
      - name: Compute Matrix
        id: matrix
        run: |-
          echo -n "json="                      >> "${GITHUB_OUTPUT}"
          go run ./internal/orchestrion/matrix >> "${GITHUB_OUTPUT}"

  service-containers:
    name: Service containers
    needs:
      - changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.orchestrion == 'true'
    runs-on: ubuntu-latest
    outputs:
      services_json: ${{ steps.set-services.outputs.services_json }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.orchestrion-version != '' && 'DataDog/dd-trace-go' || github.repository }}
          ref: ${{ inputs.orchestrion-version != '' && 'main' || github.sha }}
      - name: Define Services JSON
        id: set-services
        run: |
          echo "SERVICES_JSON=$(jq -c . ./internal/orchestrion/_integration/ci-services.json)" >> "${GITHUB_OUTPUT}"

  integration-test:
    services: ${{ fromJSON(matrix.runs-on == 'ubuntu' && needs.service-containers.outputs.services_json || '{}') }}
    env:
      # Path to where test results will be saved
      REPORT: gotestsum-report-orchestrion.xml
      # Disable go workspace as they complicate everything when orchestrion
      # updates its `go` directive in `go.mod` before `dd-trace-go` does;
      # ESPECIALLY on Windows.
      GOWORK: 'off'
    needs:
      - changes
      - go-versions-matrix
      - service-containers
    if: github.event_name != 'pull_request' || needs.changes.outputs.orchestrion == 'true'
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu
          - macos
          - windows
        go-version: ${{ fromJSON(needs.go-versions-matrix.outputs.json) }}
        mode: [DRIVER]
        include:
          # Alternate build modes (only on ubuntu with oldstable, so we save up CI time)
          - runs-on: ubuntu
            go-version: oldstable
            mode: TOOLEXEC
          - runs-on: ubuntu
            go-version: oldstable
            mode: GOFLAGS
    name: Integration Test (${{ matrix.runs-on }} | ${{ matrix.go-version }} | ${{ matrix.mode }})
    runs-on: ${{ matrix.runs-on == 'ubuntu' && fromJson('{"labels":"ubuntu-8-core-latest","group":"Large Runner Shared Public"}') || (matrix.runs-on == 'windows' && fromJson('{"labels":"windows-shared-8core","group":"LARGE WINDOWS SHARED"}')) || format('{0}-latest', matrix.runs-on) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ github.workspace }}/dd-trace-go
          repository: ${{ inputs.orchestrion-version != '' && 'DataDog/dd-trace-go' || github.repository }}
          ref: ${{ inputs.orchestrion-version != '' && 'main' || github.sha }}
      # If we're in workflow_dispatch/call, maybe we need to up/downgrade orchestrion
      - name: Check out orchestrion
        if: inputs.orchestrion-version != ''
        id: checkout-orchestrion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ github.workspace }}/orchestrion
          repository: DataDog/orchestrion
          ref: ${{ inputs.orchestrion-version }}

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |-
            ${{ github.workspace }}/dd-trace-go/internal/orchestrion/_integration/go.mod
            ${{ github.workspace }}/orchestrion/all/go.mod

      - name: Install development tools
        run: make -C ${{ github.workspace }}/dd-trace-go tools-install

      - name: Set up orchestrion
        if: inputs.orchestrion-version != ''
        # This does not pass `-go` so that it transparently uses the correct go
        # version, which is the highest one between that of dd-trace-go and
        # orchestrion. This way each can change their own minimum supported go
        # release without requiring coordination with the other. It also adds
        # the local checkout of orchestrion to the `go.work` so that its own
        # `go` directive is correctly managed.
        shell: bash
        run: |-
          # Relative to working-directory (.../dd-trace-go/internal/orchestrion/_integration): a
          # path built from ${{ github.workspace }} would be backslash-separated on Windows and
          # get mangled by bash's unquoted escape processing, so use a portable relative path.
          source ../../../.github/workflows/apps/go-retry.sh
          go mod edit -replace="github.com/DataDog/orchestrion=${{ github.workspace }}/orchestrion"
          retry_on_corruption go mod tidy
        working-directory: ${{ github.workspace }}/dd-trace-go/internal/orchestrion/_integration
        env:
          VERSION: ${{ inputs.orchestrion-version }}
      # We install the binary to the GOBIN, so it's easy to use
      - name: Install orchestrion binary
        if: '!inputs.collect-coverage'
        shell: bash
        run: |-
          source ../../../.github/workflows/apps/go-retry.sh
          retry_on_corruption go install "github.com/DataDog/orchestrion"
        working-directory: ${{ github.workspace }}/dd-trace-go/internal/orchestrion/_integration
      - name: Build orchestrion binary
        if: inputs.collect-coverage
        shell: bash
        run: |-
          source ../../../.github/workflows/apps/go-retry.sh
          bin=$(go env GOPATH)/bin/orchestrion
          if [[ '${{ matrix.runs-on }}' == 'windows' ]]; then
            bin="${bin}.exe"
          fi
          mkdir -p "$(dirname "${bin}")"
          build_orchestrion() {
            go build -cover -covermode=atomic -coverpkg="github.com/DataDog/orchestrion/..." "-o=${bin}" "github.com/DataDog/orchestrion"
          }
          retry_on_corruption build_orchestrion
          echo "GOCOVERDIR=$(mktemp -d)" >> "${GITHUB_ENV}"
        working-directory: ${{ github.workspace }}/dd-trace-go/internal/orchestrion/_integration

      # Run a `go mod tidy` because GitHub will run this on a candidate merge commit, and if there
      # have been dependecy updates on the `main` branch, the `go.mod` and `go.sum` files for the
      # integration test suite may no longer be up-to-date.
      - name: Run 'go mod tidy'
        shell: bash
        run: |-
          source ../../../.github/workflows/apps/go-retry.sh
          retry_on_corruption go mod tidy
        working-directory: ${{ github.workspace }}/dd-trace-go/internal/orchestrion/_integration

      # Pull docker images ahead of time so the pulls of large images don't have to fit within the
      # test timeout. Images (and their pinned digests) come from the shared Testcontainers catalog,
      # which Dependabot keeps up to date; dynamodb/postgres/vault are the largest images used by the
      # suite, hence worth pre-warming.
      - name: Pull container images
        # Docker is only supported on Linux runners at the moment
        if: runner.os == 'Linux'
        run: |-
          docker compose -f "${{ github.workspace }}/dd-trace-go/instrumentation/testutils/containers/images/docker-compose.yaml" pull dynamodb postgres vault

      # Enable VM overcommit memory, which is essential to ensure smooth operations of the Redis
      # servers. This VM setting is not namespaced, so changing it on the host also affects all
      # containerized workloads (which our Redis service is).
      - name: Enable memory overcommit
        if: runner.os == 'Linux'
        run: sudo sysctl vm.overcommit_memory=1

      # Finally, we run the test suite!
      # To avoid false negatives with failing tests, we do not run our CI Visibility `gotestsum`. Doing so would mark our
      # failure tests as real failures in the backend.
      - name: Run Tests
        shell: bash
        run: |-
          export PATH="${{ github.workspace }}/dd-trace-go/bin:${PATH}"
          echo "PATH: ${PATH}"
          echo "Working directory: ${PWD}"
          orchestrion version
          PACKAGE_NAMES=$(go list ./... | grep -v /civisibility)

          case "${MODE}" in
          "DRIVER")
            echo "Starting test suite in DRIVER mode"
            # shellcheck disable=SC2086
            gotestsum --junitfile "${XML_PATH}" --raw-command -- orchestrion go test -json -shuffle=on $PACKAGE_NAMES
            orchestrion go test -json -shuffle=on ./civisibility
            ;;
          "TOOLEXEC")
            echo "Starting test suite in TOOLEXEC mode"
            # shellcheck disable=SC2086
            gotestsum --junitfile "${XML_PATH}" -- -shuffle=on -toolexec='orchestrion toolexec' $PACKAGE_NAMES
            go test -shuffle=on -toolexec='orchestrion toolexec' ./civisibility
            ;;
          "GOFLAGS")
            echo "Starting test suite in GOFLAGS mode"
            export GOFLAGS="${GOFLAGS} '-toolexec=orchestrion toolexec'"
            # shellcheck disable=SC2086
            gotestsum --junitfile "${XML_PATH}" -- -shuffle=on $PACKAGE_NAMES
            go test -shuffle=on ./civisibility
            ;;
          *)
            echo "Unknown mode: ${MODE}"
            ;;
          esac
        working-directory: ${{ github.workspace }}/dd-trace-go/internal/orchestrion/_integration
        env:
          MODE: ${{ matrix.mode }}
          # The "buildtag" tag is used in //dd:span integration tests
          GOFLAGS: -timeout=30m ${{ matrix.runs-on == 'ubuntu' && '-p=4' || '' }} -tags=githubci${{ matrix.mode == 'DRIVER' && ',buildtag' || ''}}
          # Prevent auto-respawn, which is problematic with installs from commit SHA
          DD_ORCHESTRION_IS_GOMOD_VERSION: true
          # Ryuk is problematic with concurrent executions, and unnecessary in ephemeral environments like GHA.
          TESTCONTAINERS_RYUK_DISABLED: true
          # To enable sharing the reported JUnit XML, we need to save it into the temporary, shared directory by GHA.
          XML_PATH: ${{ runner.temp }}${{ matrix.runs-on == 'windows' && '\' || '/' }}${{ env.REPORT }}

        # Check for changes in the supported_configurations.json file
      - name: Run Config Inverter Check
        if: always()
        run: |
          git diff internal/env/supported_configurations.json
          cd scripts/configinverter && go run main.go -input ../../internal/env/supported_configurations.json check
        working-directory: ${{ github.workspace }}/dd-trace-go

      # If in workflow_call, we collected coverage data we need to upload
      - name: Consolidate coverage report
        if: inputs.collect-coverage
        shell: bash
        run: |-
          mkdir -p "${{ github.workspace }}/orchestrion/coverage"
          go tool covdata textfmt -i "${GOCOVERDIR}" -o "${WORKSPACE}/orchestrion/coverage/integration.out"
        env:
          WORKSPACE: ${{ github.workspace }}
      - name: Determine go minor version
        if: inputs.collect-coverage
        id: go
        shell: bash
        run: |-
          set -euo pipefail
          echo "version=$(echo '${{ steps.setup-go.outputs.go-version }}' | cut -d'.' -f1,2)" >> "${GITHUB_OUTPUT}"
      - name: Upload coverage report
        if: inputs.collect-coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration+${{ matrix.mode }}+go${{ steps.go.outputs.version }}+${{ runner.os }}+${{ runner.arch }}
          path: ${{ github.workspace }}/orchestrion/coverage/integration.out

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
        with:
          persist-credentials: false
          ref: ${{ inputs.orchestrion-version != '' && 'main' || github.sha }}
          clean: false
      - name: Get Datadog credentials
        id: dd-sts
        if: always()
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2
        with:
          policy: dd-trace-go
      - name: Upload the results to Datadog CI App
        if: always()
        continue-on-error: true
        uses: ./.github/actions/dd-ci-upload
        with:
          dd-api-key: ${{ steps.dd-sts.outputs.api_key }}
          path: ${{ runner.temp }}${{ matrix.runs-on == 'windows' && '\' || '/' }}
          tags: go:${{ steps.setup-go.outputs.go-version }},arch:${{ runner.arch }},os:${{ runner.os }}
  benchmark-apps:
    # Build the real benchmark apps from DataDog/apm-sdks-benchmarks against the
    # dd-trace-go commit under test. The apps resolve dd-trace-go from the module
    # proxy with their committed go.sum files and no replace directives.
    #
    # Every other consumer simulation in this repository neutralizes that
    # resolution: internal/orchestrion/_integration and internal/setup-smoke-test
    # replace dd-trace-go with the working tree, and check-orchestrion-all-resolves
    # (smoke-tests.yml) tidies a throwaway module before it resolves.
    #
    # A merge that makes orchestrion/all/v2 import a package or a nested module
    # that no published version contains breaks the app builds until the next
    # dev tag is cut. The job reuses the apps' own build flow for the version
    # selection on purpose. A `go mod edit -replace` pin of the root module at
    # the commit under test would hide exactly that break: the commit contains
    # the new package, and the published tags do not. The root module and every
    # contrib module must keep resolving from published tags.
    name: Benchmark Apps Build
    needs:
      - changes
    # The apm-sdks-benchmarks access policy grants the workflow of this
    # repository only. Runs from other repositories (the workflow_call from
    # DataDog/orchestrion) skip this job, so they stay green until that policy
    # covers them too.
    if: >-
      (github.event_name != 'pull_request' || needs.changes.outputs.benchmark-apps == 'true')
      && github.repository == 'DataDog/dd-trace-go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The apps resolve dd-trace-go at the pseudo-version of the commit under
      # test, which the checksum database has not necessarily indexed yet.
      GOSUMDB: "off"
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: dd-trace-go
          repository: ${{ inputs.orchestrion-version != '' && 'DataDog/dd-trace-go' || github.repository }}
          ref: ${{ env.DD_TRACE_GO_REF }}
      - name: Get token for apm-sdks-benchmarks
        # apm-sdks-benchmarks is a private repository, so the repository-scoped
        # GITHUB_TOKEN cannot clone it. This step mints a short-lived read token
        # through the dd-trace-go.orchestrion-benchmark-apps.read policy, which
        # the maintainers of that repository own under .github/chainguard/.
        id: benchmarks-token
        continue-on-error: true
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/apm-sdks-benchmarks
          policy: dd-trace-go.orchestrion-benchmark-apps.read
      - name: Check apm-sdks-benchmarks access
        if: steps.benchmarks-token.outcome != 'success'
        run: |-
          echo "::error::This job needs a contents:read token for DataDog/apm-sdks-benchmarks. Ask the maintainers of that repository to add the dd-trace-go.orchestrion-benchmark-apps.read policy under .github/chainguard/."
          exit 1
      - name: Checkout benchmark apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.benchmarks-token.outputs.token }}
          repository: DataDog/apm-sdks-benchmarks
          ref: ${{ inputs.benchmarks-ref || 'main' }}
          fetch-depth: 1
          path: benchmarks
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Mirrors the golang:1.26 image the apps' Dockerfiles build with.
          go-version: "1.26"
          cache: false
      - name: Resolve dd-trace-go pseudo-version
        id: pin
        shell: bash
        env:
          ORCHESTRION_VERSION: ${{ inputs.orchestrion-version || 'latest' }}
        run: |-
          set -euo pipefail
          work="$(mktemp -d)"
          cd "${work}"
          go mod init ddtrace-go-ci.local/pin >/dev/null
          pseudo="$(go list -m -f '{{.Version}}' github.com/DataDog/dd-trace-go/v2@"${DD_TRACE_GO_REF}")"
          echo "Resolved github.com/DataDog/dd-trace-go/v2@${DD_TRACE_GO_REF} to ${pseudo}"
          echo "pseudo=${pseudo}" >> "${GITHUB_OUTPUT}"
          {
            echo "TRACER_VERSION=${pseudo}"
            echo "ORCHESTRION_VERSION=${ORCHESTRION_VERSION}"
          } >> "${GITHUB_ENV}"
      - name: Build go-prof-app (datadog-latest)
        id: build-go-prof-app
        shell: bash
        run: |-
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/dd-trace-go/.github/workflows/apps/go-retry.sh"
          gobin="$(go env GOPATH)/bin"
          export PATH="${gobin}:${PATH}"
          bench="${GITHUB_WORKSPACE}/benchmarks"

          # Stage the build root the way the app's Dockerfile assembles /app:
          # the instrumentation diff is renamed, which is the name prepare.Makefile
          # looks it up by in $(BUILDROOT).
          buildroot="${RUNNER_TEMP}/go-prof-app-buildroot"
          mkdir -p "${buildroot}"
          cp "${bench}/app/go/go-prof-app/prepare.patch" "${buildroot}/prepare.patch"
          cp "${bench}/tracing-libs/go/go-prof-app.orchestrion-instrumentation.diff" \
            "${buildroot}/orchestrion-instrumentation.diff"
          cp "${bench}/app/go/go-prof-app/prepare.Makefile" "${bench}/app/go/go-prof-app/build.Makefile" "${buildroot}/"

          # Clone the application repository at the commit its Dockerfile pins.
          app="${GITHUB_WORKSPACE}/go-prof-app"
          git clone --quiet --depth 1 https://github.com/felixge/go-prof-app "${app}"
          git -C "${app}" checkout --quiet 5c383265bb2999ff1789c66f01991ece59382a29
          cd "${app}"
          export BUILDROOT="${buildroot}"

          # The same command sequence as the Dockerfile's builder stage, decomposed
          # so each network-bound command retries individually:
          #   - `prepare` applies prepare.patch (strips the upstream dd-trace-go
          #     requirements, returning the app to its baseline state);
          #   - the instrumentation diff adds the //dd:span directives;
          #   - `orchestrion pin` writes the tools file and runs the last
          #     `go mod tidy` the app sees, resolving dd-trace-go from published
          #     versions only;
          #   - the `go get` pair bumps orchestrion/all/v2 (and the root module
          #     requirement, which MVS re-selects from published tags) to
          #     ${TRACER_VERSION} -- nothing tidies after this point, so the first
          #     build attempt runs against the go.sum state of an external
          #     consumer that does not tidy;
          #   - `go mod download`, then the -toolexec build.
          retry_on_corruption make -f "${buildroot}/prepare.Makefile" prepare
          retry_on_corruption go install "github.com/DataDog/orchestrion@${ORCHESTRION_VERSION}"
          git apply "${buildroot}/orchestrion-instrumentation.diff"
          retry_on_corruption orchestrion pin
          retry_on_corruption go get "github.com/DataDog/dd-trace-go/v2@${TRACER_VERSION}"
          retry_on_corruption go get "github.com/DataDog/dd-trace-go/orchestrion/all/v2@${TRACER_VERSION}"
          retry_on_corruption go mod download
          retry_on_corruption make -f "${buildroot}/build.Makefile" datadog-latest 2>&1 | tee "${RUNNER_TEMP}/go-prof-app-build.log"

          # Guard against a false pass: the whole point is building against the
          # commit under test, so the build must not have silently settled on a
          # published orchestrion/all/v2 tag instead of ${TRACER_VERSION}.
          resolved="$(go list -m -f '{{.Version}}' github.com/DataDog/dd-trace-go/orchestrion/all/v2)"
          if [[ "${resolved}" != "${TRACER_VERSION}" ]]; then
            echo "::error::expected github.com/DataDog/dd-trace-go/orchestrion/all/v2@${TRACER_VERSION}, resolved ${resolved}"
            exit 1
          fi
      - name: Build fibonacci (datadog-orchestrion)
        id: build-fibonacci
        shell: bash
        run: |-
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/dd-trace-go/.github/workflows/apps/go-retry.sh"
          bench="${GITHUB_WORKSPACE}/benchmarks"
          work="${RUNNER_TEMP}/fibonacci"
          mkdir -p "${work}"
          cd "${work}"
          # build.sh copies the baseline go.mod and the datadog-orchestrion main.go
          # into the working directory, installs orchestrion, pins, resolves
          # dd-trace-go at ${TRACER_VERSION} with its own `go get` pair, and builds
          # with -toolexec. Every step it takes is idempotent, so the retry wrapper
          # cannot corrupt a partial attempt. Nothing tidies after the version
          # bump, so the build runs against the app's committed go.sum state.
          export BP_PRODUCT=datadog-orchestrion
          retry_on_corruption bash "${bench}/app/go/fibonacci/src/build.sh" 2>&1 | tee "${RUNNER_TEMP}/fibonacci-build.log"

          # Same false-pass guard as the go-prof-app build.
          resolved="$(go list -m -f '{{.Version}}' github.com/DataDog/dd-trace-go/orchestrion/all/v2)"
          if [[ "${resolved}" != "${TRACER_VERSION}" ]]; then
            echo "::error::expected github.com/DataDog/dd-trace-go/orchestrion/all/v2@${TRACER_VERSION}, resolved ${resolved}"
            exit 1
          fi
      - name: Diagnose failure
        if: failure()
        shell: bash
        run: |-
          set -uo pipefail
          {
            echo "## Benchmark apps build failure"
            echo
            echo "Pinned dd-trace-go version: \`${TRACER_VERSION:-unresolved}\` (ref: \`${DD_TRACE_GO_REF}\`)."
            echo "The apps resolved dd-trace-go from the module proxy, with committed"
            echo "\`go.sum\` files and no \`replace\` directives -- the way their own"
            echo "build scripts do. The decisive error:"
            echo
            for log in "${RUNNER_TEMP}/go-prof-app-build.log" "${RUNNER_TEMP}/fibonacci-build.log"; do
              [ -f "${log}" ] || continue
              echo "### $(basename "${log}")"
              echo
              echo '```'
              decisive="$(grep -E -m 5 'no required module provides package|missing go\.sum entry|unknown revision|invalid version|cannot find module' "${log}" || true)"
              if [ -n "${decisive}" ]; then
                echo "${decisive}"
              else
                echo '(no known failure signature; tail of the build log:)'
                tail -10 "${log}" || true
              fi
              echo '```'
              echo
            done
            echo "Likely fixes:"
            echo
            echo "1. Cut a dev tag, so the packages and modules \`orchestrion/all/v2\` imports at this commit are resolvable from the module proxy:"
            echo
            echo '   ```sh'
            echo '   git checkout -b dev-vX.Y.x origin/main'
            echo '   go run ./scripts/autoreleasetagger --version vX.Y.0-dev.N --root .'
            echo '   ```'
            echo
            echo "2. If the benchmark apps themselves need a change (e.g. an import was renamed), coordinate an \`apm-sdks-benchmarks\` update with the benchmarking team. This job never modifies that repository."
          } >> "${GITHUB_STEP_SUMMARY}"

          # Post-failure diagnostics only: a `go mod tidy` names exactly what the
          # apps' go.sum files are missing. Never run this before the first build
          # attempt. A tidy adds the missing entries, and the failure stays hidden.
          for dir in "${GITHUB_WORKSPACE}/go-prof-app" "${RUNNER_TEMP}/fibonacci"; do
            [ -f "${dir}/go.mod" ] || continue
            echo "::group::go mod tidy diagnostics (${dir})"
            (
              cd "${dir}"
              cp go.mod go.mod.before
              [ -f go.sum ] && cp go.sum go.sum.before
              go mod tidy 2>&1 | head -10 || true
              diff -u go.mod.before go.mod || true
              [ -f go.sum.before ] && diff -u go.sum.before go.sum || true
              rm -f go.mod.before go.sum.before
            ) || true
            echo "::endgroup::"
          done
  # This is a simple join point to make it easy to set up branch protection rules in GitHub.
  integration-test-done:
    name: Orchestrion Integration Tests
    needs:
      - changes
      - generate
      - go-versions-matrix
      - service-containers
      - integration-test
      - benchmark-apps
    runs-on: ubuntu-latest
    if: '!cancelled()'
    steps:
      # 'skipped' is only a pass when the classifier actually turned the suite
      # off. GitHub applies an implicit success() to every `needs:`, so a failing
      # go-versions-matrix or service-containers would skip integration-test, and
      # accepting that skip would carry this gate green. Both are dependencies
      # here, and when the gate is on integration-test must have really succeeded.
      #
      # generate gets no strict clause: it carries its own
      # `inputs.orchestrion-version == ''` condition, so a legitimate skip on a
      # cross-repo workflow_call must stay a pass. benchmark-apps gets the same
      # strict clause shape as integration-test, plus the repository guard: the
      # apm-sdks-benchmarks access policy grants this repository only, so the
      # job legitimately skips on a cross-repo workflow_call and that skip must
      # not read as a failure.
      - name: Failure
        if: >-
          needs.changes.result != 'success'
          || contains(fromJSON('["failure", "cancelled"]'), needs.generate.result)
          || contains(fromJSON('["failure", "cancelled"]'), needs.go-versions-matrix.result)
          || contains(fromJSON('["failure", "cancelled"]'), needs.service-containers.result)
          || contains(fromJSON('["failure", "cancelled"]'), needs.integration-test.result)
          || contains(fromJSON('["failure", "cancelled"]'), needs.benchmark-apps.result)
          || (needs.changes.outputs.orchestrion == 'true'
              && needs.integration-test.result != 'success')
          || (needs.changes.outputs.benchmark-apps == 'true'
              && github.repository == 'DataDog/dd-trace-go'
              && needs.benchmark-apps.result != 'success')
        run: echo "Failure!" && exit 1
      - name: Skipped
        if: needs.integration-test.result == 'skipped'
        run: echo "No changed path requires orchestrion tests (see .github/ci-components.yml)."
      - name: Success
        run: echo "Success!"
