name: Orchestrion

# The main-based half of the orchestrion integration lane: every push to
# main re-runs the full OS matrix minutes after landing (macOS/Windows
# legs no longer gate pull requests), the nightly schedule keeps the full
# matrix, release branches keep their coverage, a dispatch can pin an
# orchestrion version, and DataDog/orchestrion calls this file
# cross-repository with the same effect. Failures of the macOS and
# Windows legs are turned into issues by ci-lane-triage.yml.
#
# The lane body lives in orchestrion-lane.yml; pull requests and the
# merge queue run it through orchestrion-pr.yml with the ubuntu legs
# only.

on:
  workflow_call: # From github.com/DataDog/orchestrion
    inputs:
      orchestrion-version:
        description: Orchestrion version to use for integration testing
        type: string
        required: true
      collect-coverage:
        description: Whether to collect orchestrion coverage data or not
        type: boolean
        default: false
        required: false
  workflow_dispatch: # On-demand runs; a deliberate full-matrix run.
  push:
    branches:
      - main
      - release-v*
      # The merge queue is not gated (see CONTRIBUTING.md); a queued
      # commit runs the ubuntu legs of the lane through
      # orchestrion-pr.yml before landing on main, so no queue branch
      # may appear here.
    tags-ignore:
      - 'contrib/**'
      - 'instrumentation/**'
      - 'internal/**'
      - 'orchestrion/**'
      - 'otelc/**'
      - 'scripts/**'
  schedule: # nightly
    - cron: "0 0 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  # Cancel superseded runs to conserve resources.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{
    inputs.orchestrion-version && format('-{0}', inputs.orchestrion-version) }}
  cancel-in-progress: true

jobs:
  lane:
    uses: ./.github/workflows/orchestrion-lane.yml
    with:
      # Main-based events and the cross-repository call run every OS.
      os-list: '["ubuntu", "macos", "windows"]'
      orchestrion-version: ${{ inputs.orchestrion-version }}
      # inputs.collect-coverage exists only for the workflow_call
      # event: on push, schedule and dispatch it evaluates to an empty
      # value, which a boolean-typed reusable input rejects. Default
      # it so those events keep the full matrix.
      collect-coverage: ${{ inputs.collect-coverage || false }}
