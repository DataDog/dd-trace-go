name: Orchestrion PR

# The pull-request half of the orchestrion integration lane: pull
# requests and merge-queue branches, ubuntu legs only, gated by the
# changed-components classifier. The macOS and Windows legs do not gate
# pull requests; they run on main-based events through orchestrion.yml,
# where ci-lane-triage.yml turns their failures into issues. The lane
# body lives in orchestrion-lane.yml.

on:
  pull_request:
  push:
    # The merge queue builds every queued commit on an
    # mq-working-branch-<target>-<hash> branch before it lands (see
    # .github/AGENTS.md): the queue runs the ubuntu legs of this lane, so
    # a queued commit cannot land without them.
    branches:
      - mq-working-branch-**
    tags-ignore:
      - 'contrib/**'
      - 'instrumentation/**'
      - 'internal/**'
      - 'orchestrion/**'
      - 'otelc/**'
      - 'scripts/**'

permissions:
  id-token: write
  contents: read

concurrency:
  # Cancel superseded runs of the same pull request or queue branch.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    uses: ./.github/workflows/orchestrion-lane.yml
    with:
      # Pull requests and the merge queue run the ubuntu legs only,
      # except when the target is a release branch: a macOS/Windows
      # regression on a release gates nothing on main and opens no
      # issue, so those targets keep the full matrix here.
      os-list: >-
        ${{ (startsWith(github.base_ref, 'release-v') ||
             startsWith(github.ref_name, 'mq-working-branch-release-v')) &&
            '["ubuntu", "macos", "windows"]' || '["ubuntu"]' }}

  # A top-level join with the check name the lane used to report
  # directly, so a branch protection rule on it keeps resolving: the
  # called workflow's own join is gated on the classifier, and a
  # skipped check satisfies no required-check rule.
  integration-test-done:
    name: Orchestrion Integration Tests
    needs: [lane]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - name: Failure
        if: >-
          contains(fromJSON('["failure", "cancelled"]'),
          needs.lane.result)
        run: echo "Failure!" && exit 1
      - name: Success
        if: needs.lane.result == 'success'
        run: echo "Success!"
