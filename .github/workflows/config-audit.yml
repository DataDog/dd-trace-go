name: config-audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run config audit
        run: |
          mkdir -p out
          status=0
          (cd scripts/configaudit && GOWORK=off go run . -root ../.. -format json) > out/audit.json || status=1
          (cd scripts/configaudit && GOWORK=off go run . -root ../.. -format table) > out/audit.txt || status=1
          exit "$status"
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: config-audit
          path: out/
          retention-days: 14
