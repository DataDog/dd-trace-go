name: Unit and Integration Tests

on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string
      build_tags:
        description: 'Build tags to use for testing (e.g., "debug,deadlock")'
        required: false
        type: string
        default: ""

env:
  DD_APPSEC_WAF_TIMEOUT: 1m # Increase time WAF time budget to reduce CI flakiness
  # Users may build our library with GOTOOLCHAIN=local. If they do, and our
  # go.mod file specifies a newer Go version than their local toolchain, their
  # build will break. Run our tests with GOTOOLCHAIN=local to ensure that
  # our library builds with all of the Go versions we claim to support,
  # without having to download a newer one.
  GOTOOLCHAIN: local
  GODEBUG: "x509negativeserial=1"
  TEST_RESULT_PATH: /tmp/test-results

permissions:
  id-token: write
  contents: read

jobs:
  set-up:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Restore repo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: gitdb-${{ github.repository_id }}-${{ github.sha }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          clean: false
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Compute Matrix
        id: matrix
        run: |-
          echo -n "matrix="                      >> "${GITHUB_OUTPUT}"
          go run ./scripts/ci_contrib_matrix.go  >> "${GITHUB_OUTPUT}"

  test-contrib-matrix:
    needs: set-up
    runs-on:
      group: "APM Larger Runners"
    env:
      INTEGRATION: true
      COMPOSE_FILE: .github/testservices/docker-compose.yaml
      COMPOSE_PROJECT_NAME: dd-trace-go-ci
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.set-up.outputs.matrix) }}
    steps:
      - name: Restore repo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: gitdb-${{ github.repository_id }}-${{ github.sha }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          clean: false
          submodules: recursive

      - name: Start CI service containers
        run: docker compose up -d

      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin

      # Containers were started (non-blocking) before Go setup above, so most of
      # the wait time already overlapped with it; this just waits out whatever's left.
      - name: Wait for CI service containers
        run: docker compose up -d --wait --wait-timeout 120

      - name: Test Contrib
        if: always()
        env:
          TEST_RESULTS: ${{ env.TEST_RESULT_PATH }}
          BUILD_TAGS: ${{ inputs.build_tags }}
        run: |
          export PATH="${{ github.workspace }}/bin:${PATH}"
          ./scripts/ci_test_contrib.sh default ${{ toJson(matrix.chunk) }}

      - name: Get Datadog credentials
        id: dd-sts
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2
        with:
          policy: dd-trace-go

      - name: Upload the results to Datadog CI App
        if: always()
        continue-on-error: true
        uses: ./.github/actions/dd-ci-upload
        with:
          dd-api-key: ${{ steps.dd-sts.outputs.api_key }}
          path: ${{ env.TEST_RESULT_PATH }}
          tags: go:${{ inputs.go-version }},arch:${{ runner.arch }},os:${{ runner.os }},analysis:${{ inputs.build_tags || 'standard' }}

      - name: Merge contrib coverage files
        if: always()
        run: |
          echo "mode: atomic" > coverage-contrib-merged.txt
          find . \( -path "*/contrib/*" -o -path "*/instrumentation/*" \) \
            -name "coverage-*.txt" -print0 \
            | xargs -0 grep -h -v "^mode:" >> coverage-contrib-merged.txt 2>/dev/null || true

      - name: Upload Coverage to Datadog
        if: always()
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: coverage-contrib-merged.txt
          format: go-coverprofile

      # Check for changes in the supported_configurations.json file
      - name: Supported Configurations Diff Check
        if: always()
        uses: ./.github/actions/supported_configurations_validation

      - name: Get Datadog APM Test Agent Logs
        if: always()
        shell: bash
        run: docker compose logs testagent

      - name: Get Datadog APM Test Agent Trace Check Summary Results
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/trace-check-results
          RESPONSE_CODE=$(curl -s -w "%{http_code}" -o /tmp/trace-check-results/failures-${{ strategy.job-index }}.json "http://127.0.0.1:9126/test/trace_check/failures?return_all=true")
          curl -s -o /tmp/trace-check-results/summary-${{ strategy.job-index }}.json "http://127.0.0.1:9126/test/trace_check/summary?return_all=true"
          echo "$RESPONSE_CODE" > /tmp/trace-check-results/response_code-${{ strategy.job-index }}.txt
          echo "APM Test Agent Check Traces Summary Results:"
          jq "." /tmp/trace-check-results/summary-${{ strategy.job-index }}.json
          if [[ $RESPONSE_CODE -eq 200 ]]; then
              echo " - All APM Test Agent Check Traces returned successful!"
          else
              echo "APM Test Agent Check Traces failed with response code: $RESPONSE_CODE"
              echo "Failures:"
              cat /tmp/trace-check-results/failures-${{ strategy.job-index }}.json
              exit 1
          fi

      - name: Upload Trace Check Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-check-results-${{ strategy.job-index }}
          path: /tmp/trace-check-results/
          retention-days: 1
          if-no-files-found: ignore

      - name: Stop CI service containers
        if: always()
        run: docker compose down

  test-contrib:
    needs:
      - test-contrib-matrix
    runs-on:
      group: "APM Larger Runners"
    if: success() || failure()
    continue-on-error: true
    steps:
      - name: Download Trace Check Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/trace-check-results
          pattern: trace-check-results-*
          merge-multiple: true

      - name: Aggregate Trace Check Results
        if: always()
        shell: bash
        run: |
          echo "=== Aggregated APM Test Agent Trace Check Results ==="
          FOUND_RESPONSE_CODES=0
          FAILED=0
          for rc_file in /tmp/trace-check-results/response_code-*.txt; do
              if [[ -f "$rc_file" ]]; then
                  FOUND_RESPONSE_CODES=1
                  RC=$(cat "$rc_file")
                  if [[ "$RC" -ne 200 ]]; then
                      FAILED=1
                  fi
              fi
          done
          if [[ $FOUND_RESPONSE_CODES -eq 0 ]]; then
              echo "::warning::No trace-check artifacts were downloaded; skipping strict aggregation."
              exit 0
          fi
          for summary in /tmp/trace-check-results/summary-*.json; do
              if [[ -f "$summary" ]]; then
                  echo "Summary ($summary):"
                  jq "." "$summary"
              fi
          done
          if [[ $FAILED -ne 0 ]]; then
              echo "Trace check failures detected:"
              for f in /tmp/trace-check-results/failures-*.json; do
                  if [[ -f "$f" ]]; then
                      echo "--- $f ---"
                      cat "$f"
                  fi
              done
              exit 1
          fi
          echo " - All APM Test Agent Check Traces returned successful!"

      - name: Success
        if: needs.test-contrib-matrix.result == 'success'
        run: echo "Success!"
      - name: Failure
        if: needs.test-contrib-matrix.result != 'success'
        run: echo "Failure!" && exit 1

  test-core:
    runs-on:
      group: "APM Larger Runners"
    env:
      INTEGRATION: true
      COMPOSE_FILE: .github/testservices/docker-compose.yaml
      COMPOSE_PROJECT_NAME: dd-trace-go-ci
    steps:
      - name: Restore repo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: gitdb-${{ github.repository_id }}-${{ github.sha }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          clean: false
          submodules: recursive

      - name: Start CI service containers
        run: docker compose up -d datadog-agent

      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin

      # Containers were started (non-blocking) before Go setup above, so most of
      # the wait time already overlapped with it; this just waits out whatever's left.
      - name: Wait for CI service containers
        run: docker compose up -d --wait --wait-timeout 120 datadog-agent

      - name: Test Core
        env:
          DD_APPSEC_WAF_TIMEOUT: 1h
          TEST_RESULTS: ${{ env.TEST_RESULT_PATH }}
          BUILD_TAGS: ${{ inputs.build_tags }}
        run: |
          export PATH="${{ github.workspace }}/bin:${PATH}"
          ls -al "${{ github.workspace }}/bin"
          ./scripts/ci_test_core.sh

      - name: Get Datadog credentials
        id: dd-sts
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2
        with:
          policy: dd-trace-go

      - name: Upload the results to Datadog CI App
        if: always()
        continue-on-error: true
        uses: ./.github/actions/dd-ci-upload
        with:
          dd-api-key: ${{ steps.dd-sts.outputs.api_key }}
          path: ${{ env.TEST_RESULT_PATH }}
          tags: go:${{ inputs.go-version }},arch:${{ runner.arch }},os:${{ runner.os }},analysis:${{ inputs.build_tags || 'standard' }}

      - name: Upload Coverage to Datadog
        if: always()
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: coverage.txt coverage-noshuffle.txt internal/exectracetest/coverage.txt
          format: go-coverprofile

      # Check for changes in the supported_configurations.json file
      - name: Supported Configurations Diff Check
        if: always()
        uses: ./.github/actions/supported_configurations_validation

      - name: Stop CI service containers
        if: always()
        run: docker compose down

  # Automates internal/apps/telemetry-errors/README.md's memfd/OTel-process-context
  # recipe: runs the harness in a Docker container whose seccomp profile blocks
  # memfd_create, forcing storeConfig's two error sites (ddtrace/tracer/tracer.go)
  # and asserting on the resulting payload-file dump - no real agent or backend
  # needed. continue-on-error because the second site's own dependency on the
  # runner's kernel supporting the mmap/prctl fallback isn't fully understood yet
  # (see the harness README's "Known gaps"); the test itself only hard-fails on
  # the first, fully-deterministic site.
  test-telemetry-errors-e2e:
    runs-on:
      group: "APM Larger Runners"
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          clean: false
          submodules: recursive

      - name: Setup Go and development tools
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}
          tools-dir: ${{ github.workspace }}/_tools
          tools-bin: ${{ github.workspace }}/bin

      - name: Test telemetry-errors seccomp E2E
        working-directory: internal/apps
        env:
          INTEGRATION: true
        run: go test ./telemetry-errors/... -run TestSeccompMemfdBlocked -v
