name: Publish DORA metrics

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish-dora-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Get Datadog credentials
        id: dd-sts
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2
        with:
          policy: dd-trace-go

      - name: Publish deployment event
        if: steps.dd-sts.outcome == 'success'
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          GIT_TAG: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${GIT_TAG#v}"
          STARTED=$(($(date +%s) * 1000))
          FINISHED=$((STARTED + 1000)) # finished_at must differ from started_at or the API returns 400

          curl --fail --silent --show-error -X POST "https://api.datadoghq.com/api/v2/dora/deployment" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d @- << EOF
          {
            "data": {
              "attributes": {
                "service": "dd-trace-go",
                "started_at": $STARTED,
                "finished_at": $FINISHED,
                "git": {
                  "commit_sha": "$GIT_SHA",
                  "repository_url": "https://github.com/DataDog/dd-trace-go"
                },
                "env": "prod",
                "team": "apm-go",
                "version": "$VERSION",
                "custom_tags": [ "department:engineering", "app_type:sdk" ]
              }
            }
          }
          EOF
