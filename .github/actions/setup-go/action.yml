# The minimal Go setup action: selects the toolchain and manages the
# isolated build/module caches.
#
# WHEN TO USE: any job that needs the Go toolchain. Jobs that also run
# the repository's development tools (gotestsum, golangci-lint, ...)
# should add .github/actions/tools-cache after this action; it caches
# the tool binaries and is fully independent of this action.
#
# Compatibility layer between the repository's cache policy and the
# isolated-cache provider.
#
# Cache provider policy (input `cache-provider`; caching is ON everywhere):
#   - cloudx (default): compile-heavy workloads, where the provider's
#     trimming of GOCACHE to the job's working set pays for its restore cost.
#   - github-cache: light jobs that compile little (matrix computation, small
#     `go run` scripts). Every cloudx job saves a new run_id-keyed entry into
#     the repository's shared 10 GB pool, so jobs that gain nothing from it
#     must not add entries. This uses actions/setup-go's built-in cache with
#     its default dependency path, as the base branch did.
# Moving a job between providers: after a measurement window, compare the
# job's stratum in `go run ./scripts/citiming compare`. If cloudx does not
# lower its p50, or saves less time than it adds in restore, trim and save
# (post p50), move the job to github-cache.
#
# Contract (mirrors the semantics the tools wrapper had before the migration):
#   1. Select the Go toolchain with the repository's pinned official
#      actions/setup-go. With cache-provider cloudx, caching is disabled there
#      (the provider owns the build/module cache instead); with github-cache
#      it is that action's own cache.
#   2. Align GOROOT with the selected toolchain BEFORE any step asks `go env`
#      for cache paths, so stale GOROOT values exported by earlier tools
#      cannot redirect GOCACHE/GOMODCACHE.
#   3. With caching enabled, hand the RESOLVED, exact Go version to the
#      isolated-cache provider (cloudx-io/setup-go, pinned). Its nested
#      installer must find that exact version already on disk; if it ever
#      downloads one, that is a bug to investigate, not normal behaviour.
#   4. With caching disabled, or with cache-provider github-cache, the cloudx
#      provider is never invoked: no restore, no trimming, no save.
#
# Cache key shape: ddtg-cx1-<family>-<variant digest>. The digest is the first
# 16 hex characters of SHA-256 over the caller's variant description,
# canonicalized by this action (object keys and the `modules` list sorted).
# Callers must describe the workload itself — runner class, module selection,
# build tags, workspace/instrumentation/coverage mode — and never the workflow
# title, SHA, run ID, or branch: the provider already keys on branch/run
# identity, OS/architecture and Go version. Identical nightly and PR workloads
# must therefore pass identical family+variant so default-branch seeding
# stays possible.
#
# Observability: emits the same structured `cache-observation:` record as the
# pre-migration action, so scripts/citiming keeps working unchanged. The
# provider's raw cache-hit boolean is recorded but NOT exposed as an output:
# its save key ends in the run ID, so it is `true` only on the near
# impossible exact-key hit. The restore entry instead carries, from the
# provider's `cache-matched-key` output: `restored` ("true" when the module
# cache was non-empty after the provider ran, kept as a cross-check of the
# matched key), `cache_matched_key`, `restore_source` (exact / default /
# branch / none — `default` marks a default-branch fallback restore from
# a different branch, the signal the seed program measures), and `dep_match` ("true" when the
# matched entry was keyed with this job's `hashFiles('**/go.*')` digest,
# i.e. the same dependency set). The action exposes `cache-matched-key` and
# `restore-source` as outputs for callers.
name: 'Setup Go runtime'
description: 'Select Go, then isolate and refresh the build and module caches'
inputs:
  go-version:
    required: true
    description: Go version to setup; may be a semantic alias.
  cache:
    required: false
    default: "true"
    description: Whether to restore and save Go build and module caches.
  check-latest:
    required: false
    default: "false"
    description: >-
      Whether to check for the latest available patch release matching the
      requested version. The tools wrapper passes "true" (its historical
      behaviour); direct callers keep the setup-go default.
  workload:
    required: false
    default: ""
    description: >-
      Logical workload family (e.g. unit-core, orchestrion-integration) used
      as the cache-key family and in cache observations. Defaults to the job
      name.
  cache-provider:
    required: false
    default: cloudx
    description: >-
      Cache implementation: `cloudx` (isolated, trimmed caches; for
      compile-heavy workloads) or `github-cache` (actions/setup-go's built-in
      cache; for light jobs). Any other value fails the action.
  variant:
    required: false
    default: ""
    description: >-
      JSON object describing the workload variant (runner class, sorted module
      selection, build tags, workspace/instrumentation/coverage mode). The
      module selection may be a JSON array or a space-separated string;
      either form is canonicalized (sorted) and hashed by this action into the
      cache-key digest. Omit for jobs whose family alone identifies the
      workload.
outputs:
  go-version:
    description: The resolved, exact Go version installed.
    value: ${{ steps.select-go.outputs.go-version }}
  cache-key-prefix:
    description: The computed provider cache-key prefix (evidence only).
    value: ${{ steps.cache-key.outputs.prefix }}
  cache-matched-key:
    description: >-
      The provider's matched cache key, including prefix matches; empty on
      a cold miss and whenever caching did not run.
    value: ${{ steps.restore-source.outputs.cache-matched-key }}
  restore-source:
    description: >-
      Where the restore came from: exact, default (a default-branch
      fallback), branch, or none (cold miss).
    value: ${{ steps.restore-source.outputs.restore-source }}
  cache-metrics:
    description: Raw cache observations and cache paths as JSON.
    value: ${{ steps.cache-metrics.outputs.cache-metrics }}
runs:
  using: "composite"
  steps:
    - name: Validate cache provider
      shell: bash
      env:
        CACHE_PROVIDER: ${{ inputs.cache-provider }}
      run: |
        case "$CACHE_PROVIDER" in
          cloudx | github-cache) ;;
          *)
            echo "::error::cache-provider must be 'cloudx' or 'github-cache', got '${CACHE_PROVIDER}'"
            exit 1
            ;;
        esac

    # Make transient module-proxy failures survivable for every step that
    # follows in the job. The separator is load-bearing: with a comma the go
    # command falls through to `direct` ONLY on 404/410, while with a pipe it
    # falls through on any error. Set only when unset, so a workflow or step
    # that deliberately pins GOPROXY still wins.
    - name: Configure GOPROXY fallback
      shell: bash
      run: |
        if [[ -z "${GOPROXY:-}" ]]; then
          echo 'GOPROXY=https://proxy.golang.org|direct' >> "$GITHUB_ENV"
        fi

    - name: Select Go toolchain
      id: select-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache-provider == 'github-cache' && inputs.cache == 'true' }}
        check-latest: ${{ inputs.check-latest }}

    # Callers that run a tool exporting its own GOROOT into $GITHUB_ENV before
    # this action (e.g. reviewdog/action-golangci-lint installs a different Go
    # release) leave a stale GOROOT behind that overrides the toolchain
    # selected above. Re-align GOROOT so the `go` binary on PATH and its tool
    # directory always come from the same tree, BEFORE the provider asks
    # `go env` for the cache paths.
    - name: Align GOROOT with the selected toolchain
      id: align-goroot
      shell: bash
      run: |
        unset GOROOT
        goroot="$(go env GOROOT)"
        echo "GOROOT=${goroot}" >> "$GITHUB_ENV"
        echo "goroot=${goroot}" >> "$GITHUB_OUTPUT"

    - name: Compute cache key prefix
      id: cache-key
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
        FAMILY: ${{ inputs.workload || github.job }}
      # Canonicalization and hashing live in a script so scripts/actiontest
      # can exercise them without a workflow run.
      run: bash "${GITHUB_ACTION_PATH}/cache-key-prefix.sh"

    # The provider caches GOCACHE and GOMODCACHE together, trims GOCACHE to
    # the job's working set before saving, and restores branch-aware with a
    # default-branch fallback. max-staleness-hours keeps the documented
    # allowance for Go's mtime-touch granularity; no other tuning.
    - name: Isolate and refresh Go build caches
      id: cloudx
      if: ${{ inputs.cache == 'true' && inputs.cache-provider == 'cloudx' }}
      # main (includes cloudx-io/setup-go#8). No tag contains #8 yet: the
      # newest tag v1.0.0 predates it. #8 adds the `save` input (restore-only
      # mode) and the `cache-matched-key` output this action consumes.
      # Dependabot ignores cloudx-io/setup-go versions <= 1.0.0.
      uses: cloudx-io/setup-go@0bbd76c0381c065220668df9b6694845b937aaa0 # main (includes cloudx-io/setup-go#8)
      with:
        go-version: ${{ steps.select-go.outputs.go-version }}
        cache-key-prefix: ${{ steps.cache-key.outputs.prefix }}
        max-staleness-hours: "2"
        # Verified to expand to go.mod, go.sum and go.work files only in this
        # repository; a single glob is the provider's supported form.
        cache-dependency-path: "**/go.*"

    # The provider's cache-hit is `true` only on an exact primary-key hit,
    # which its run_id-terminated save key makes near impossible on a
    # restore. The matched key (empty on a cold miss) says what was actually
    # restored; the `restored` flag below cross-checks it against the module
    # cache contents, so a disagreement between the two is visible evidence
    # instead of a silent misclassification.
    - name: Derive restore source
      id: restore-source
      if: ${{ inputs.cache == 'true' && inputs.cache-provider == 'cloudx' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cloudx.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.cloudx.outputs.cache-matched-key }}
        DEP_HASH: ${{ hashFiles('**/go.*') }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        # The branch this run is on (the PR source branch for pull
        # requests), to tell a same-branch restore from a fallback.
        CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        # The resolved toolchain and this job's cache-key prefix: both are
        # embedded verbatim in every key the provider can match, so the
        # branch is what follows them and no regex guessing is needed.
        GO_VERSION: ${{ steps.select-go.outputs.go-version }}
        CACHE_KEY_PREFIX: ${{ steps.cache-key.outputs.prefix }}
      run: |
        set -euo pipefail

        source="none"
        dep_match="false"
        # Save-key layout, verified against the pinned provider revision:
        # go-cache-<os>-<arch>-<CACHE_KEY_PREFIX>-<GO_VERSION>-<branch>-
        # <dep-hash>-<run_id>. The prefix and the resolved Go version are
        # known here and appear verbatim (every restore-key tier pins
        # both), so the branch is parsed by stripping them literally. A
        # generic regex cannot split the version from a hyphenated branch:
        # 1.27.2-feature-main parses either way.
        if [[ "$CACHE_HIT" == "true" ]]; then
          source="exact"
        elif [[ -n "$MATCHED_KEY" ]]; then
          source="branch"
        fi
        if [[ -n "$MATCHED_KEY" && "$MATCHED_KEY" == *"-${CACHE_KEY_PREFIX}-${GO_VERSION}-"* ]]; then
          body="${MATCHED_KEY#*-${CACHE_KEY_PREFIX}-${GO_VERSION}-}"
          rest="${body%-*}"      # drop the run ID
          dep_hash="${rest##*-}" # the dependency hash is the last segment
          rest="${rest%-*}"      # what remains is the branch
          if [[ "$dep_hash" =~ ^[0-9a-f]{40,64}$ ]]; then
            # A fallback is a restore of the default branch's entry from a
            # DIFFERENT branch: a run already on the default branch that
            # restores its own earlier entry is a same-branch restore.
            if [[ "$rest" == "$DEFAULT_BRANCH" && "$CURRENT_BRANCH" != "$DEFAULT_BRANCH" && "$source" != "exact" ]]; then
              source="default"
            fi
            if [[ "$dep_hash" == "$DEP_HASH" ]]; then
              dep_match="true"
            fi
          fi
        fi
        printf 'cache-matched-key=%s\n' "$MATCHED_KEY" >> "$GITHUB_OUTPUT"
        printf 'restore-source=%s\n' "$source" >> "$GITHUB_OUTPUT"
        printf 'dep-match=%s\n' "$dep_match" >> "$GITHUB_OUTPUT"

    # A fresh runner has an empty GOMODCACHE before the restore, so a
    # non-empty one afterwards means the provider restored an entry.
    - name: Detect restored module cache
      id: restored
      if: ${{ inputs.cache == 'true' && inputs.cache-provider == 'cloudx' }}
      shell: bash
      run: |
        set -euo pipefail

        gomodcache="$(go env GOMODCACHE)"
        if [[ -n "$(ls -A "$gomodcache" 2>/dev/null)" ]]; then
          echo "restored=true" >> "$GITHUB_OUTPUT"
        else
          echo "restored=false" >> "$GITHUB_OUTPUT"
        fi

    # The provider runs its own nested actions/setup-go, which may rewrite PATH
    # and GOROOT after the realignment above. Both sides are read through
    # `go env`, so Windows path spelling cannot cause a false mismatch.
    - name: Verify the provider kept the selected toolchain
      if: ${{ inputs.cache == 'true' && inputs.cache-provider == 'cloudx' }}
      shell: bash
      env:
        EXPECTED_VERSION: ${{ steps.select-go.outputs.go-version }}
        EXPECTED_GOROOT: ${{ steps.align-goroot.outputs.goroot }}
      run: |
        set -euo pipefail

        actual_version="$(go env GOVERSION)"
        actual_goroot="$(go env GOROOT)"
        if [[ "$actual_version" != "go${EXPECTED_VERSION#go}" ]]; then
          echo "::error::go is ${actual_version}, expected go${EXPECTED_VERSION#go}"
          exit 1
        fi
        if [[ "$actual_goroot" != "$EXPECTED_GOROOT" ]]; then
          echo "::error::GOROOT is ${actual_goroot}, expected ${EXPECTED_GOROOT}"
          exit 1
        fi

    # Mirror the pre-migration observation record. The restore entry carries
    # the cache step's outcome and its raw cache-hit boolean. With cloudx a
    # `false` cache-hit is ambiguous between a prefix restore and a cold miss,
    # so the entry also carries the matched key, the derived restore source
    # and the dependency match, plus the `restored` cross-check computed above
    # (all four omitted when the provider did not complete, and never set for
    # github-cache, whose cache-hit is an exact-match boolean).
    - name: Record cache observations
      id: cache-metrics
      if: always()
      shell: bash
      env:
        PROVIDER: ${{ inputs.cache-provider }}
        WORKLOAD: ${{ inputs.workload || github.job }}
        REQUESTED_VERSION: ${{ inputs.go-version }}
        RESOLVED_VERSION: ${{ steps.select-go.outputs.go-version }}
        CACHE_ENABLED: ${{ inputs.cache }}
        SETUP_OUTCOME: ${{ inputs.cache-provider == 'github-cache' && steps.select-go.outcome || steps.cloudx.outcome }}
        SETUP_CACHE_HIT: ${{ inputs.cache-provider == 'github-cache' && steps.select-go.outputs.cache-hit || steps.cloudx.outputs.cache-hit }}
        RESTORED: ${{ steps.restored.outputs.restored }}
        MATCHED_KEY: ${{ steps.restore-source.outputs.cache-matched-key }}
        RESTORE_SOURCE: ${{ steps.restore-source.outputs.restore-source }}
        DEP_MATCH: ${{ steps.restore-source.outputs.dep-match }}
      run: |
        set -euo pipefail

        # A failed toolchain selection can leave `go` missing; record the
        # observation anyway so incomplete telemetry stays visible.
        paths="$(go env -json GOMODCACHE GOCACHE 2>/dev/null || printf '{}')"
        metrics="$(jq -cn \
          --argjson paths "$paths" \
          --arg provider "$PROVIDER" \
          --arg workload "$WORKLOAD" \
          --arg requested "$REQUESTED_VERSION" \
          --arg version "$RESOLVED_VERSION" \
          --arg enabled "$CACHE_ENABLED" \
          --arg outcome "$SETUP_OUTCOME" \
          --arg hit "$SETUP_CACHE_HIT" \
          --arg restored "$RESTORED" \
          --arg matched "$MATCHED_KEY" \
          --arg source "$RESTORE_SOURCE" \
          --arg dep "$DEP_MATCH" '
          {
            provider: $provider,
            workload: $workload,
            runtime: {name: "go", requested: $requested, version: $version},
            restores: [
              {name: "setup_go", enabled: $enabled, outcome: $outcome, cache_hit: $hit}
              + (if $restored != "" then
                   {restored: $restored,
                    cache_matched_key: $matched,
                    restore_source: $source,
                    dep_match: $dep}
                 else {} end)
            ],
            cache_paths: [
              {name: "go_mod", path: ($paths.GOMODCACHE // null)},
              {name: "go_build", path: ($paths.GOCACHE // null)}
            ]
          }')"
        printf 'cache-metrics=%s\n' "$metrics" >> "$GITHUB_OUTPUT"
        printf 'cache-observation:%s\n' "$metrics"
