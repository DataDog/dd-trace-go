name: 'Setup Go'
description: 'Setup Go and Development tools for running tests'
inputs:
  go-version:
    required: true
    description: Go version to setup.
  tools-bin:
    required: true
    description: Directory to installs tools to.
  tools-dir:
    required: true
    description: Directory that has the tool definitions.
runs:
  using: "composite"
  steps:
    # Make transient module-proxy failures survivable for every step that follows in the job.
    #
    # The separator is load-bearing. Go's default is `https://proxy.golang.org,direct`, and with a
    # comma the go command falls through to the next entry ONLY on 404/410 — a 5xx, a timeout, a
    # TLS error or a dropped HTTP/2 stream is fatal and `direct` is never tried
    # (cmd/go/internal/modfetch/proxy.go: fallBackOnError is set only for `|`). With a pipe it
    # falls through on any error. cmd/go has no retry of its own (golang/go#28194), so this and
    # apps/go-retry.sh are the only two lines of defence.
    #
    # Written to GITHUB_ENV rather than the action's `env:` because a composite action's env does
    # not reach the calling job's later steps. Set only when unset, so a workflow or step that
    # deliberately pins GOPROXY (e.g. GOPROXY=direct for a single command) still wins.
    - name: Configure GOPROXY fallback
      shell: bash
      run: |
        if [[ -z "${GOPROXY:-}" ]]; then
          echo 'GOPROXY=https://proxy.golang.org|direct' >> "$GITHUB_ENV"
        fi

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      id: setup-go
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        check-latest: true

    # Callers that run a tool exporting its own GOROOT into $GITHUB_ENV before this
    # action (e.g. reviewdog/action-golangci-lint installs a different Go release)
    # leave a stale GOROOT behind that overrides the toolchain selected above. Re-align
    # GOROOT with the toolchain actions/setup-go just selected so the `go` binary on
    # PATH and its tool directory always come from the same tree.
    - name: Align GOROOT with the selected toolchain
      shell: bash
      run: |
        unset GOROOT
        echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

    - name: Cache tools
      id: cache-tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.tools-bin }}
        # Key on the resolved toolchain version, not the literal input: `stable`
        # silently changes meaning when a new Go release ships, and a cache built
        # against the old release would then feed stale binaries to the new one.
        key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-tools-${{ inputs.tools-dir }}-${{ inputs.tools-bin}}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        # Keep near-misses usable when the base branch moves go.mod/go.sum, which
        # otherwise invalidates the key for every open PR at once.
        restore-keys: |
          ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-tools-${{ inputs.tools-dir }}-${{ inputs.tools-bin }}-

    - name: Install development tools
      if: steps.cache-tools.outputs.cache-hit != 'true'
      shell: bash
      run: |-
        ./scripts/install_tools.sh --tools-dir ${{ inputs.tools-dir }} --bin-dir ${{ inputs.tools-bin }}
