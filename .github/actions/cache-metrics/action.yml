# Composite action to report GitHub Actions cache effectiveness to Datadog.
#
# Why this is a separate action rather than part of .github/actions/setup-go: the cache
# hit/miss outcomes are only observable at restore time, early in the job, but the API key
# needed to submit them is minted later (dd-sts), and the cache sizes worth recording are
# the post-build ones. So setup-go stashes its outcomes in the environment and this action
# does the submitting, alongside the existing dd-ci-upload call near the end of the job.
#
# Everything here is best-effort. Call it with `continue-on-error: true` and `if: always()`:
# a metrics failure must never fail a test job.
name: 'Cache Metrics'
description: 'Report GitHub Actions cache hit/miss and cache sizes to Datadog'
inputs:
  dd-api-key:
    required: true
    description: Datadog API key used to submit the metrics.
  dd-site:
    required: false
    default: datadoghq.com
    description: Datadog site to submit metrics to.
  measure-sizes:
    required: false
    default: "false"
    description: |
      Whether to walk GOMODCACHE and GOCACHE to report their sizes. Off by default: the walk
      costs tens of seconds on Windows, which is on the PR critical path. Enable it on
      main-branch and scheduled runs, where nothing is waiting on the result.
runs:
  using: "composite"
  steps:
    - name: Measure Go cache sizes
      if: inputs.measure-sizes == 'true'
      shell: bash
      run: |
        set -uo pipefail
        # `go env` prints native paths; on Windows runners this bash is git-bash, which
        # needs them converted before du can walk them.
        to_unix_path() {
          if command -v cygpath >/dev/null 2>&1; then cygpath -u "$1"; else printf '%s' "$1"; fi
        }
        size_kb() {
          local p
          p="$(to_unix_path "$1")"
          if [[ -d "$p" ]]; then du -sk "$p" 2>/dev/null | awk '{print $1}'; else echo 0; fi
        }
        {
          echo "DD_CACHE_GOMODCACHE_KB=$(size_kb "$(go env GOMODCACHE)")"
          echo "DD_CACHE_GOCACHE_KB=$(size_kb "$(go env GOCACHE)")"
        } >> "$GITHUB_ENV"

    - name: Submit cache metrics
      shell: bash
      env:
        DD_API_KEY: ${{ inputs.dd-api-key }}
        DD_SITE: ${{ inputs.dd-site }}
        JOB_NAME: ${{ github.job }}
        WORKFLOW_NAME: ${{ github.workflow }}
        TRIGGER: ${{ github.event_name }}
        RUNNER_OS_TAG: ${{ runner.os }}
        RUNNER_ARCH_TAG: ${{ runner.arch }}
      run: |
        set -uo pipefail

        if [[ -z "${DD_API_KEY:-}" ]]; then
          echo "::notice::No Datadog API key available; skipping cache metrics."
          exit 0
        fi

        now="$(date +%s)"

        # Workflow and job names contain spaces and punctuation ("Pull Request Tests"),
        # which Datadog would normalize on ingest anyway. Doing it here keeps the tag
        # values predictable enough to write dashboard queries against.
        # -E rather than a GNU-only `\+`: this runs on BSD sed on the macOS runners.
        norm_tag() {
          printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E -e 's/[^a-z0-9_.-]+/_/g' -e 's/^_//' -e 's/_$//'
        }

        common_tags=(
          "os:$(norm_tag "${RUNNER_OS_TAG}")"
          "arch:$(norm_tag "${RUNNER_ARCH_TAG}")"
          "go_version:${DD_CACHE_GO_VERSION:-unknown}"
          "workflow:$(norm_tag "${WORKFLOW_NAME}")"
          "job:$(norm_tag "${JOB_NAME}")"
          "trigger:$(norm_tag "${TRIGGER}")"
        )

        series_file="$(mktemp)"
        echo '[]' > "$series_file"

        add_series() { # metric, type (0=gauge,1=count), value, extra tag...
          local metric="$1" mtype="$2" value="$3"; shift 3
          local tags_json
          tags_json="$(printf '%s\n' "${common_tags[@]}" "$@" | jq -Rsc 'split("\n")|map(select(length>0))')"
          jq -c \
            --arg metric "$metric" \
            --argjson type "$mtype" \
            --argjson ts "$now" \
            --argjson value "$value" \
            --argjson tags "$tags_json" \
            '. += [{metric: $metric, type: $type, points: [{timestamp: $ts, value: $value}], tags: $tags}]' \
            "$series_file" > "$series_file.tmp" && mv "$series_file.tmp" "$series_file"
        }

        # One count per cache per job. Summing by outcome gives the hit rate; the cache_name
        # tag keeps the caches that fail for different reasons distinguishable.
        for spec in "tools:${DD_CACHE_TOOLS_HIT:-}" "go_mod:${DD_CACHE_GOMOD_HIT:-}"; do
          cache_name="${spec%%:*}"
          outcome="${spec#*:}"
          [[ -z "$outcome" || "$outcome" == "n/a" ]] && continue
          add_series "dd_trace_go.ci.cache.outcome" 1 1 "cache_name:${cache_name}" "outcome:${outcome}"
        done

        [[ -n "${DD_CACHE_GOMODCACHE_KB:-}" ]] && \
          add_series "dd_trace_go.ci.cache.size_bytes" 0 "$(( DD_CACHE_GOMODCACHE_KB * 1024 ))" "cache_name:go_mod"
        [[ -n "${DD_CACHE_GOCACHE_KB:-}" ]] && \
          add_series "dd_trace_go.ci.cache.size_bytes" 0 "$(( DD_CACHE_GOCACHE_KB * 1024 ))" "cache_name:go_build"

        if [[ "$(jq 'length' "$series_file")" == "0" ]]; then
          echo "::notice::No cache metrics to submit."
          exit 0
        fi

        payload="$(jq -c '{series: .}' "$series_file")"
        code="$(curl -sS -o /tmp/dd-metrics-response -w '%{http_code}' \
          -X POST "https://api.${DD_SITE}/api/v2/series" \
          -H "DD-API-KEY: ${DD_API_KEY}" \
          -H "Content-Type: application/json" \
          -d "$payload" || echo "000")"

        if [[ "$code" != "202" ]]; then
          echo "::warning::Cache metric submission returned HTTP ${code}"
          cat /tmp/dd-metrics-response 2>/dev/null || true
          exit 0
        fi
        echo "Submitted $(jq 'length' "$series_file") cache metric series."
