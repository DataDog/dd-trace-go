# Composite action to upload junit test result files to Datadog CI App
name: 'Datadog CI App Upload'
description: 'Upload junit test result files to Datadog CI App'
inputs:
  dd-api-key:
    required: true
    description: Datadog API key to use to upload the junit files
  service:
    required: false
    default: dd-trace-go
    description: Service name to use with the uploaded test results.
  path:
    required: true
    description: Path containing the JUnit files to upload
  tags:
    required: false
    description: Datadog tags to associate with the uploaded test results.
runs:
  using: "composite"
  steps:
    - if: runner.os == 'Windows'
      shell: bash
      run: echo "DD_CI_CLI_BUILD=win-x64" >> $GITHUB_ENV
    - if: runner.os == 'macOS'
      shell: bash
      run: echo "DD_CI_CLI_BUILD=darwin-x64" >> $GITHUB_ENV
    - if: runner.os == 'Linux'
      shell: bash
      run: echo "DD_CI_CLI_BUILD=linux-x64" >> $GITHUB_ENV

    - name: Datadog CI CLI cache
      id: dd-ci-cli-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./datadog-ci
        key: datadog-ci-cli-${{ env.DD_CI_CLI_BUILD }}

    - name: Install Datadog CI CLI
      if: steps.dd-ci-cli-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        base="https://github.com/DataDog/datadog-ci/releases/latest/download"
        curl -L --fail "${base}/datadog-ci_${{ env.DD_CI_CLI_BUILD }}" \
          --output datadog-ci
        chmod +x datadog-ci

    - name: Add CodeOwners to JUnit files
      shell: bash
      # The add-codeowners helper lives in a sibling action directory and
      # needs the repository's module context for `go run`, so execute from
      # the repository root the action lives in — not the caller's working
      # directory, which is not a Go module in every job (the orchestrion
      # integration tests check out this repository beneath dd-trace-go/).
      working-directory: ${{ github.action_path }}/../../..
      run: |-
        dir="${{ inputs.path }}"
        # Trim a trailing path separator: a trailing backslash would escape
        # the closing quote in Git Bash on Windows and break this command.
        dir="${dir%/}"
        dir="${dir%\\}"
        go run ./.github/actions/add-codeowners/codeowners.go "${dir:-.}"

    - name: Upload the JUnit files
      shell: bash
      run: |
        env DD_API_KEY=${{ inputs.dd-api-key }} ./datadog-ci junit upload \
          --service ${{ inputs.service }} \
          --tags "${{ inputs.tags }}" \
          ${{ inputs.path }}
