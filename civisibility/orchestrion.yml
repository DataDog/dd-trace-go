---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-trace-go/v2/civisibility
  description: CI Visibility with parent-only activation when DD_CIVISIBILITY_ENABLED is unset.

aspects:
  - id: parent-only default
    tracer-internal: true
    join-point:
      all-of:
        - import-path: github.com/DataDog/dd-trace-go/v2/internal/civisibility/envconfig
        - function-call: defaultEnabledMode
    advice:
      - wrap-expression:
          template: EnabledModeParent
