---

net-client:
  target: net/http
  where:
    func: RoundTrip
    recv: "*Transport"
  do:
    - inject_hooks:
        before: BeforeRoundTrip
        after: AfterRoundTrip
        path: github.com/DataDog/dd-trace-go/contrib/net/http/v2/otelc

net-server:
  target: net/http
  where:
    func: ServeHTTP
    recv: serverHandler
  do:
    - inject_hooks:
        before: BeforeServeHTTP
        after: AfterServeHTTP
        path: github.com/DataDog/dd-trace-go/contrib/net/http/v2/otelc

# Unlike Orchestrion, otelc does not yet support `.AST.Fun.Name`, so we instead create four
# different rules for each of the four functions required (GET, HEAD, POST, and POSTFORM).
get:
  target: "$root"
  where:
    function_call: net/http.Get
  do:
    - wrap_call:
        replace: |-
            {{- $ctx := .FuncArgumentOfType "context.Context" -}}
            {{- $req := .FuncArgumentOfType "*net/http.Request" -}}
            {{- if $ctx -}}
              ddhttpclient.Get({{ $ctx }}{{ range $i := .CallArgumentCount }}, {{ $.CallArgument $i }}{{ end }})
            {{- else if $req -}}
              ddhttpclient.Get({{ $req }}.Context(){{ range $i := .CallArgumentCount }}, {{ $.CallArgument $i }}{{ end }})
            {{- else -}}
              {{ . }}
            {{- end -}}
  imports:
    ddhttpclient: github.com/DataDog/dd-trace-go/contrib/net/http/v2/client

