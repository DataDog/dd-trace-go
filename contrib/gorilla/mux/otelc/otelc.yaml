---
# Adds the tracing code to gorilla/mux, copied from router.go: the per-router
# config type and Router.__dd_serveHTTP.
router_declarations:
  target: github.com/gorilla/mux
  do:
    - add_file:
        file: router.go
        path: github.com/DataDog/dd-trace-go/contrib/gorilla/mux/otelc/v2

# Adds the per-router tracing config to mux.Router.
router_config_field:
  target: github.com/gorilla/mux
  where:
    struct: Router
  do:
    - add_struct_fields:
        new_field:
          - name: __dd_config
            type: __dd_routerConfig

# Calls Router.__dd_serveHTTP at the top of ServeHTTP. When it traced and
# served the request, ServeHTTP returns; otherwise ServeHTTP serves it as usual.
# Every router is traced this way, subrouters and routers built in dependencies
# included. The code runs inside gorilla/mux, because a hook compiles against
# the unmodified Router and cannot read __dd_config.
router_serve_http:
  target: github.com/gorilla/mux
  where:
    func: ServeHTTP
    recv: "*Router"
  do:
    - inject_code:
        raw: |-
          if {{ .Receiver }}.__dd_serveHTTP({{ .FuncArgument 0 }}, {{ .FuncArgument 1 }}) {
            return
          }
