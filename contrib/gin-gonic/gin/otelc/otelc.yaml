---
# The otelc port of ../orchestrion.yml. See ../orchestrion.yml for the aspects
# this reproduces and hooks.go for the hook bodies.
#
# `one-of`/`not` do not work at the top of `where` (otelc v1.0.1), so each
# orchestrion `one-of` alternative below is its own rule instead of one
# combined rule.

# --- id: New ---
# orchestrion wraps the gin.New()/gin.Default() call expression itself, so the
# otelc equivalent is a call-site rewrite (wrap_call), not a hook on the
# definition: New()'s call inside Default()'s own body is unqualified and
# never matches, so there is no double-firing risk either way.
new_new:
  target: $root
  where:
    function_call: github.com/gin-gonic/gin.New
  do:
    - wrap_call:
        replace: |-
          func() *gin.Engine {
            e := {{ . }}
            e.Use(ddgin.Middleware(""))
            return e
          }()
  imports:
    gin: github.com/gin-gonic/gin
    ddgin: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/v2

new_default:
  target: $root
  where:
    function_call: github.com/gin-gonic/gin.Default
  do:
    - wrap_call:
        replace: |-
          func() *gin.Engine {
            e := {{ . }}
            e.Use(ddgin.Middleware(""))
            return e
          }()
  imports:
    gin: github.com/gin-gonic/gin
    ddgin: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/v2

# --- id: gin.Context.[Must]Bind ---
bind_bind:
  target: github.com/gin-gonic/gin
  where:
    func: Bind
    recv: "*Context"
  do:
    - inject_hooks:
        after: AfterBind
        path: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/otelc/v2

bind_should_bind:
