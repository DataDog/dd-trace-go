# A call-site rule, not a hook on gin.New: the rewritten package imports the
# contrib, so it is initialized before an engine created in a package-level
# var. The contrib is excluded because its tests create engines. gin.Default
# calls New inside gin, where this rule does not apply, so gin_default covers
# it.
gin_new:
  target:
    - "**"
    - not: "github.com/gin-gonic/gin"
    - not: "github.com/DataDog/dd-trace-go/contrib/gin-gonic/**"
  where:
    function_call: github.com/gin-gonic/gin.New
  do:
    - wrap_call:
        replace: |-
          (func(e *gin.Engine) *gin.Engine {
            e.Use(gintrace.Middleware(""))
            return e
          })({{ . }})
  imports:
    gin: github.com/gin-gonic/gin
    gintrace: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/v2

gin_default:
  target:
    - "**"
    - not: "github.com/gin-gonic/gin"
    - not: "github.com/DataDog/dd-trace-go/contrib/gin-gonic/**"
  where:
    function_call: github.com/gin-gonic/gin.Default
  do:
    - wrap_call:
        replace: |-
          (func(e *gin.Engine) *gin.Engine {
            e.Use(gintrace.Middleware(""))
            return e
          })({{ . }})
  imports:
    gin: github.com/gin-gonic/gin
    gintrace: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/v2

# The bind rules run AppSec on the value a successful *gin.Context bind call
# filled in, one rule per method, since a point selector cannot be alternated.
# All of them share AfterBind, which works because gin declares these methods
# in one file with the same signature.
#
# TODO: merge the bind rules, the render rules, and gin_new with gin_default
# into one rule each once otelc supports one-of in where:
# https://github.com/open-telemetry/opentelemetry-go-compile-instrumentation/issues/1520
gin_context_bind:
  target: github.com/gin-gonic/gin
  where:
    func: Bind
    recv: "*Context"
  do:
    - inject_hooks:
        after: AfterBind
        path: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/otelc/v2

gin_context_should_bind:
  target: github.com/gin-gonic/gin
  where:
    func: ShouldBind
    recv: "*Context"
  do:
    - inject_hooks:
        after: AfterBind
        path: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/otelc/v2

