---
# otelc port of ../orchestrion.yml.
#
# Middleware: like orchestrion, the rules rewrite gin.New and gin.Default call
# sites in every package of the build, dependencies included, except gin itself
# and the gin contrib. gin.Default calls New inside gin, so each call site is
# wrapped once. The contrib's own tests create engines, and wrapping those would
# import the contrib into itself.
#
# AppSec: the rules hook the *gin.Context bind and render methods, one rule per
# method, since a point selector cannot be alternated. See hooks.go.

gin_new:
  target:
    - "**"
    - not: "github.com/gin-gonic/gin"
    - not: "github.com/DataDog/dd-trace-go/contrib/gin-gonic/**"
  where:
    function_call: github.com/gin-gonic/gin.New
  do:
    - wrap_call:
        replace: |-
          (func() *gin.Engine {
            e := {{ . }}
            e.Use(gintrace.Middleware(""))
            return e
          })()
  imports:
    gin: github.com/gin-gonic/gin
    gintrace: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/v2

gin_default:
  target:
    - "**"
    - not: "github.com/gin-gonic/gin"
    - not: "github.com/DataDog/dd-trace-go/contrib/gin-gonic/**"
  where:
    function_call: github.com/gin-gonic/gin.Default
  do:
    - wrap_call:
        replace: |-
          (func() *gin.Engine {
            e := {{ . }}
            e.Use(gintrace.Middleware(""))
            return e
          })()
  imports:
    gin: github.com/gin-gonic/gin
    gintrace: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/v2

gin_context_bind:
  target: github.com/gin-gonic/gin
  where:
    func: Bind
    recv: "*Context"
  do:
    - inject_hooks:
        after: AfterBind
        path: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/otelc/v2

gin_context_should_bind:
  target: github.com/gin-gonic/gin
  where:
    func: ShouldBind
    recv: "*Context"
  do:
    - inject_hooks:
        after: AfterShouldBind
        path: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/otelc/v2

