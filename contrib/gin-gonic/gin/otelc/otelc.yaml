# The render rules run AppSec on the body passed to a *gin.Context render
# method, and skip the write when AppSec blocks the request. They share
# BeforeRender, like the bind rules share AfterBind.
gin_context_ascii_json:
  target: github.com/gin-gonic/gin
  where:
    func: AsciiJSON
    recv: "*Context"
  do:
    - inject_hooks:
        before: BeforeRender
        path: github.com/DataDog/dd-trace-go/contrib/gin-gonic/gin/otelc/v2

