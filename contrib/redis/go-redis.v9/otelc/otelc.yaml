---
# The rules rewrite the call sites of every go-redis client constructor whose
# result the contrib's WrapClient accepts, in every package of the build,
# dependencies included, except go-redis and the go-redis contrib.
#
# go-redis also calls its own constructors, for example for Ring shards,
# Cluster nodes and NewUniversalClient. Those calls are inside go-redis, so they
# are not rewritten and each client is traced once, at the level the
# application created it. A hook on the constructor definitions would fire for
# them too and trace each command twice. A hook also creates no import edge, so
# a client built in a package-level variable could reach the contrib before its
# init runs.
#
# Each template takes the call's results as closure parameters, so the call
# and its arguments are evaluated where the original call was, which matters
# for a go or defer statement.
#
# FIXME: when the application sets RingOptions.NewClient or
# ClusterOptions.NewClient to a function that calls redis.NewClient, that
# call is rewritten too, so the shard or node client and the Ring or Cluster
# are both wrapped and each command reports two spans.
#
# The contrib calls redis.NewClient itself, and wrapping that call would import
# the contrib into itself.

new_client:
  target:
    - "**"
    - not: "github.com/redis/go-redis/v9/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/redis/go-redis.v9/**"
  where:
    function_call: github.com/redis/go-redis/v9.NewClient
  do:
    - wrap_call:
        replace: |-
          (func(client *redis.Client) *redis.Client {
            redistrace.WrapClient(client)
            return client
          })({{ . }})
  imports:
    redis: github.com/redis/go-redis/v9
    redistrace: github.com/DataDog/dd-trace-go/contrib/redis/go-redis.v9/v2

