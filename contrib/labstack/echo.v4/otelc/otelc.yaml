---
# otelc port of ../orchestrion.yml.
#
# The import name differs from the echo v5 rule, so a file that uses both
# echo versions does not get two imports under the same name.
#
# Like orchestrion, the rule rewrites call sites in every package of the build,
# dependencies included, except echo and the echo contribs. Wrapping a call
# inside echo would import the contrib into echo, and the contrib's own tests
# create instances they wrap themselves.

echo_v4_new:
  target:
    - "**"
    - not: "github.com/labstack/echo/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/labstack/**"
  where:
    function_call: github.com/labstack/echo/v4.New
  do:
    - wrap_call:
        replace: echov4trace.Wrap({{ . }})
  imports:
    echov4trace: github.com/DataDog/dd-trace-go/contrib/labstack/echo.v4/v2
