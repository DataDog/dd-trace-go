---
# Call-site rules, not hooks on the constructors: sarama's sync producer
# constructors call the async ones and type assert the result, which a hook
# would break, and the rewritten package imports the contrib, so it is
# initialized before a value built in a package-level var or init. The
# contrib is excluded because its tests wrap sarama values themselves.
sarama_new_consumer:
  target:
    - "**"
    - not: "github.com/IBM/sarama"
    - not: "github.com/IBM/sarama/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/IBM/sarama/**"
  where:
    function_call: github.com/IBM/sarama.NewConsumer
  do:
    - wrap_call:
        replace: |-
          (func(__dd_addrs []string, __dd_cfg *__dd_ibmsarama.Config) (__dd_ibmsarama.Consumer, error) {
            if false {
              return {{ . }}
            }
            __dd_c, __dd_err := __dd_ibmsarama.NewConsumer(__dd_addrs, __dd_cfg)
            if __dd_c != nil {
              __dd_c = __dd_ibmsaramatrace.WrapConsumer(__dd_c, __dd_ibmsaramatrace.WithBrokers(__dd_addrs), __dd_ibmsaramatrace.WithSaramaConfig(__dd_cfg))
            }
            return __dd_c, __dd_err
          })({{ .CallArguments }})
  imports:
    __dd_ibmsarama: github.com/IBM/sarama
    __dd_ibmsaramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2

sarama_new_consumer_from_client:
  target:
    - "**"
    - not: "github.com/IBM/sarama"
    - not: "github.com/IBM/sarama/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/IBM/sarama/**"
  where:
    function_call: github.com/IBM/sarama.NewConsumerFromClient
  do:
    - wrap_call:
        replace: |-
          (func(c __dd_ibmsarama.Consumer, err error) (__dd_ibmsarama.Consumer, error) {
            if c != nil {
              c = __dd_ibmsaramatrace.WrapConsumer(c)
            }
            return c, err
          })({{ . }})
  imports:
    __dd_ibmsarama: github.com/IBM/sarama
    __dd_ibmsaramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2

# The rules for the constructors that take broker addresses pass them to the
# contrib with WithBrokers, for the bootstrap servers tag and the cluster ID
# with Data Streams Monitoring. The consumer rule also passes the config with
# WithSaramaConfig, which the cluster ID lookup connects with.
#
# The producer rules pass the config from the call's arguments, or the client's
# config, to the contrib. A nil config reaches the contrib as nil.
# {{ .CallArguments }} also covers a call whose only argument returns both
# values, such as NewSyncProducer(producerArgs()).
#
# TODO: wrap_call requires the original call in the template, so it stays in a
# branch that never runs. The parameters keep a prefix so they cannot hide a
# variable the original call uses. Remove the branch once wrap_call can replace
# a call outright:
# https://github.com/open-telemetry/opentelemetry-go-compile-instrumentation/issues/1551
sarama_new_sync_producer:
  target:
    - "**"
    - not: "github.com/IBM/sarama"
    - not: "github.com/IBM/sarama/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/IBM/sarama/**"
  where:
    function_call: github.com/IBM/sarama.NewSyncProducer
  do:
    - wrap_call:
        replace: |-
          (func(__dd_addrs []string, __dd_cfg *__dd_ibmsarama.Config) (__dd_ibmsarama.SyncProducer, error) {
            __dd_p, __dd_err := __dd_ibmsarama.NewSyncProducer(__dd_addrs, __dd_cfg)
            if __dd_p != nil {
              __dd_p = __dd_ibmsaramatrace.WrapSyncProducer(__dd_cfg, __dd_p, __dd_ibmsaramatrace.WithBrokers(__dd_addrs))
            }
            return __dd_p, __dd_err
          })({{ .CallArguments }})
  imports:
    __dd_ibmsarama: github.com/IBM/sarama
    __dd_ibmsaramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2

sarama_new_sync_producer_from_client:
  target:
    - "**"
    - not: "github.com/IBM/sarama"
    - not: "github.com/IBM/sarama/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/IBM/sarama/**"
  where:
    function_call: github.com/IBM/sarama.NewSyncProducerFromClient
  do:
    - wrap_call:
        replace: |-
          (func(__dd_client __dd_ibmsarama.Client) (__dd_ibmsarama.SyncProducer, error) {
            __dd_p, __dd_err := __dd_ibmsarama.NewSyncProducerFromClient(__dd_client)
            if __dd_p != nil {
              __dd_p = __dd_ibmsaramatrace.WrapSyncProducer(__dd_client.Config(), __dd_p)
            }
            return __dd_p, __dd_err
          })({{ .CallArgument 0 }})
  imports:
    __dd_ibmsarama: github.com/IBM/sarama
    __dd_ibmsaramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2

