---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
  description: Sarama is a Go library for Apache Kafka

aspects:
  # NewConsumer, NewSyncProducer and NewAsyncProducer take the broker
  # addresses. They are passed to WithBrokers for the bootstrap servers tag,
  # and for the cluster ID with Data Streams Monitoring. The arguments are
  # evaluated once, in order, as in the original call.
  - id: NewConsumer
    join-point:
      function-call: github.com/IBM/sarama.NewConsumer
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            func(addrs []string, config *sarama.Config) (sarama.Consumer, error) {
              c, err := sarama.NewConsumer(addrs, config)
              if c != nil {
                c = saramatrace.WrapConsumer(c, saramatrace.WithBrokers(addrs))
              }
              return c, err
            }({{ index .AST.Args 0 }}, {{ index .AST.Args 1 }})

  - id: NewConsumerClient
    join-point:
      function-call: github.com/IBM/sarama.NewConsumerClient
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            func(c sarama.Consumer, err error) (sarama.Consumer, error) {
              if c != nil {
                c = saramatrace.WrapConsumer(c)
              }
              return c, err
            }({{ . }})

  - id: NewSyncProducer
    join-point:
      function-call: github.com/IBM/sarama.NewSyncProducer
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            func(addrs []string, config *sarama.Config) (sarama.SyncProducer, error) {
              p, err := sarama.NewSyncProducer(addrs, config)
              if p != nil {
                p = saramatrace.WrapSyncProducer(config, p, saramatrace.WithBrokers(addrs))
              }
              return p, err
            }({{ index .AST.Args 0 }}, {{ index .AST.Args 1 }})

  - id: NewSyncProducerFromClient
    join-point:
      function-call: github.com/IBM/sarama.NewSyncProducerFromClient
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            {{- $cfg := .Function.ArgumentOfType "sarama.Config" -}}
            func(p sarama.SyncProducer, err error) (sarama.SyncProducer, error) {
              if p != nil {
                p = saramatrace.WrapSyncProducer(
                  {{- if $cfg -}}
                  {{ $cfg }},
                  {{- else -}}
                  nil,
                  {{- end -}}
                  p,
                )
              }
              return p, err
            }({{ . }})

  - id: NewAsyncProducer
    join-point:
      function-call: github.com/IBM/sarama.NewAsyncProducer
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            func(addrs []string, config *sarama.Config) (sarama.AsyncProducer, error) {
              p, err := sarama.NewAsyncProducer(addrs, config)
              if p != nil {
                p = saramatrace.WrapAsyncProducer(config, p, saramatrace.WithBrokers(addrs))
              }
              return p, err
            }({{ index .AST.Args 0 }}, {{ index .AST.Args 1 }})

  - id: NewAsyncProducerFromClient
    join-point:
      function-call: github.com/IBM/sarama.NewAsyncProducerFromClient
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            {{- $cfg := .Function.ArgumentOfType "sarama.Config" -}}
            func(p sarama.AsyncProducer, err error) (sarama.AsyncProducer, error) {
              if p != nil {
                p = saramatrace.WrapAsyncProducer(
                  {{- if $cfg -}}
                  {{ $cfg }},
                  {{- else -}}
                  nil,
                  {{- end -}}
                  p,
                )
              }
              return p, err
            }({{ . }})
