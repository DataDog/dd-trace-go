---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
  description: Sarama is a Go library for Apache Kafka

aspects:
  # NewConsumer, NewSyncProducer and NewAsyncProducer take the broker
  # addresses and the sarama configuration. The call is rewritten so that its
  # arguments are evaluated once, in order, and passed to the wrapper: the
  # addresses with WithBrokers for the bootstrap servers tag, and for the
  # cluster ID with Data Streams Monitoring, which connects to the brokers with
  # the same configuration as the client. A call with a single multi-value
  # argument, such as NewConsumer(brokersAndConfig()), cannot be rewritten
  # and is wrapped as is.
  - id: NewConsumer
    join-point:
      function-call: github.com/IBM/sarama.NewConsumer
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            {{- if eq (len .AST.Args) 2 -}}
            func(addrs []string, config *sarama.Config) (sarama.Consumer, error) {
              c, err := sarama.NewConsumer(addrs, config)
              if c != nil {
                c = saramatrace.WrapConsumer(c, saramatrace.WithBrokers(addrs), saramatrace.WithSaramaConfig(config))
              }
              return c, err
            }({{ index .AST.Args 0 }}, {{ index .AST.Args 1 }})
            {{- else -}}
            func(c sarama.Consumer, err error) (sarama.Consumer, error) {
              if c != nil {
                c = saramatrace.WrapConsumer(c)
              }
              return c, err
            }({{ . }})
            {{- end -}}

  # The ...FromClient variants take a client: its configuration is passed to
  # the wrapper. The function was listed as NewConsumerClient, which does not
  # exist in sarama, so consumers created from a client were not traced.
  - id: NewConsumerFromClient
    join-point:
      function-call: github.com/IBM/sarama.NewConsumerFromClient
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            func(client sarama.Client) (sarama.Consumer, error) {
              c, err := sarama.NewConsumerFromClient(client)
              if c != nil {
                c = saramatrace.WrapConsumer(c, saramatrace.WithSaramaConfig(client.Config()))
              }
              return c, err
            }({{ index .AST.Args 0 }})

  - id: NewSyncProducer
    join-point:
      function-call: github.com/IBM/sarama.NewSyncProducer
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            {{- if eq (len .AST.Args) 2 -}}
            func(addrs []string, config *sarama.Config) (sarama.SyncProducer, error) {
              p, err := sarama.NewSyncProducer(addrs, config)
              if p != nil {
                p = saramatrace.WrapSyncProducer(config, p, saramatrace.WithBrokers(addrs))
              }
              return p, err
            }({{ index .AST.Args 0 }}, {{ index .AST.Args 1 }})
            {{- else -}}
            {{- $cfg := .Function.ArgumentOfType "sarama.Config" -}}
            func(p sarama.SyncProducer, err error) (sarama.SyncProducer, error) {
              if p != nil {
                p = saramatrace.WrapSyncProducer(
                  {{- if $cfg -}}
                  {{ $cfg }},
                  {{- else -}}
                  nil,
                  {{- end -}}
                  p,
                )
              }
              return p, err
            }({{ . }})
            {{- end -}}

  - id: NewSyncProducerFromClient
    join-point:
      function-call: github.com/IBM/sarama.NewSyncProducerFromClient
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            func(client sarama.Client) (sarama.SyncProducer, error) {
              p, err := sarama.NewSyncProducerFromClient(client)
              if p != nil {
                p = saramatrace.WrapSyncProducer(client.Config(), p)
              }
              return p, err
            }({{ index .AST.Args 0 }})

  - id: NewAsyncProducer
    join-point:
      function-call: github.com/IBM/sarama.NewAsyncProducer
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            {{- if eq (len .AST.Args) 2 -}}
            func(addrs []string, config *sarama.Config) (sarama.AsyncProducer, error) {
              p, err := sarama.NewAsyncProducer(addrs, config)
              if p != nil {
                p = saramatrace.WrapAsyncProducer(config, p, saramatrace.WithBrokers(addrs))
              }
              return p, err
            }({{ index .AST.Args 0 }}, {{ index .AST.Args 1 }})
            {{- else -}}
            {{- $cfg := .Function.ArgumentOfType "sarama.Config" -}}
            func(p sarama.AsyncProducer, err error) (sarama.AsyncProducer, error) {
              if p != nil {
                p = saramatrace.WrapAsyncProducer(
                  {{- if $cfg -}}
                  {{ $cfg }},
                  {{- else -}}
                  nil,
                  {{- end -}}
                  p,
                )
              }
              return p, err
            }({{ . }})
            {{- end -}}

  - id: NewAsyncProducerFromClient
    join-point:
      function-call: github.com/IBM/sarama.NewAsyncProducerFromClient
    advice:
      - wrap-expression:
          imports:
            saramatrace: github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
            sarama: github.com/IBM/sarama
          template: |-
            func(client sarama.Client) (sarama.AsyncProducer, error) {
              p, err := sarama.NewAsyncProducerFromClient(client)
              if p != nil {
                p = saramatrace.WrapAsyncProducer(client.Config(), p)
              }
              return p, err
            }({{ index .AST.Args 0 }})
