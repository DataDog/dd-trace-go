---
# Traces every request an httprouter.Router serves through the contrib,
# routers built in dependencies included. Routers the application wrapped with
# the contrib itself are traced once.
router_serve_http:
  target: github.com/julienschmidt/httprouter
  where:
    func: ServeHTTP
    recv: "*Router"
  do:
    - inject_hooks:
        before: BeforeServeHTTP
        path: github.com/DataDog/dd-trace-go/contrib/julienschmidt/httprouter/otelc/v2
