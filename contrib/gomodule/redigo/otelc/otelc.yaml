---
# ../orchestrion.yml rewrites the redis.Dial, redis.DialContext and
# redis.DialURL call sites to call redigotrace.Dial* instead. otelc's wrap_call
# exposes only the matched call as a whole ({{ . }}), so it cannot re-target a
# call while keeping its arguments.
#
# This hooks the funnel instead: redis.Dial, redis.DialTimeout, redis.DialURL and
# redis.DialURLContext all reach redis.DialContext. Two differences from
# rewriting call sites:
#
#   1. redis.DialTimeout and redis.DialURLContext are traced too.
#   2. The contrib calls redis.DialContext itself, so it marks that call and the
#      hook skips marked ones. See redigotrace.TraceMark.
redigo_dial_context:
  target: github.com/gomodule/redigo/redis
  where:
    func: DialContext
  do:
    - inject_hooks:
        before: BeforeDialContext
        after: AfterDialContext
        path: github.com/DataDog/dd-trace-go/contrib/gomodule/redigo/otelc/v2
