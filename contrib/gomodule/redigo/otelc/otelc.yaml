---
# ../orchestrion.yml rewrites three call sites (redis.Dial, redis.DialContext
# and redis.DialURL) to call redigotrace.Dial* instead. otelc cannot express
# that: its wrap_call replace template exposes only the matched call as a whole
# ({{ . }}), with no way to re-target it while keeping its arguments.
#
# So this hooks the funnel instead. redis.Dial, redis.DialTimeout, redis.DialURL
# and redis.DialURLContext all reach redis.DialContext, so hooking that one
# definition covers every entry point the three aspects wrap, and the network,
# host and port the contrib derives come out the same.
#
# Two consequences of hooking a definition rather than call sites:
#
#   1. redis.DialTimeout and redis.DialURLContext are traced too, which
#      orchestrion does not do.
#   2. The contrib calls redis.DialContext itself, so without a way to tell that
#      call apart, an application dialing through the contrib in an
#      auto-instrumented build would have its connection wrapped twice and report
#      two spans per command. Orchestrion never had this problem: it rewrites
#      call sites in application code and leaves dd-trace-go's own alone. The
#      contrib marks its own dial (../internal/otelcguard) and the hook skips
#      marked ones. Covered by _integration/redigo_manual, which fails at two
#      spans and passes under both tools.
redigo_dial_context:
  target: github.com/gomodule/redigo/redis
  where:
    func: DialContext
  do:
    - inject_hooks:
        before: BeforeDialContext
        after: AfterDialContext
        path: github.com/DataDog/dd-trace-go/contrib/gomodule/redigo/v2/otelc
