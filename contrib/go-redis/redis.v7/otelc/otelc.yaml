---
# Call-site rules, not hooks on the constructors: go-redis builds Ring shards,
# Cluster nodes and universal clients with its own constructors, which a hook
# would wrap a second time, and the rewritten package imports the contrib, so
# it is initialized before a client built in a package-level var or init. The
# contrib is excluded because it calls redis.NewClient itself.
new_client:
  target:
    - "**"
    - not: "github.com/go-redis/redis/v7/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go-redis/redis.v7/**"
  where:
    function_call: github.com/go-redis/redis/v7.NewClient
  do:
    - wrap_call:
        replace: |-
          (func(client *redis.Client) *redis.Client {
            redistrace.WrapClient(client)
            return client
          })({{ . }})
  imports:
    redis: github.com/go-redis/redis/v7
    redistrace: github.com/DataDog/dd-trace-go/contrib/go-redis/redis.v7/v2

