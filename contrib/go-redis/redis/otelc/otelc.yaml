---
# Call-site rules, not hooks on the constructors: the rewritten package imports
# the contrib, so it is initialized before a client built in a package-level
# var or init. The contrib is excluded because it calls redis.NewClient
# itself. Cluster, Ring and universal clients are not traced, because this
# contrib's WrapClient only takes a *redis.Client.
new_client:
  target:
    - "**"
    - not: "github.com/go-redis/redis/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go-redis/redis/**"
  where:
    function_call: github.com/go-redis/redis.NewClient
  do:
    - wrap_call:
        replace: |-
          (func(client *redis.Client) *redis.Client {
            redistrace.WrapClient(client)
            return client
          })({{ . }})
  imports:
    redis: github.com/go-redis/redis
    redistrace: github.com/DataDog/dd-trace-go/contrib/go-redis/redis/v2

new_failover_client:
  target:
    - "**"
    - not: "github.com/go-redis/redis/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go-redis/redis/**"
  where:
    function_call: github.com/go-redis/redis.NewFailoverClient
  do:
    - wrap_call:
        replace: |-
          (func(client *redis.Client) *redis.Client {
            redistrace.WrapClient(client)
            return client
          })({{ . }})
  imports:
    redis: github.com/go-redis/redis
    redistrace: github.com/DataDog/dd-trace-go/contrib/go-redis/redis/v2
