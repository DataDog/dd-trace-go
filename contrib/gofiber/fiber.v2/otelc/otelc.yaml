---
# Wraps fiber.New call sites, in every package of the build, dependencies
# included, except the fiber contrib, whose own tests wrap their apps
# themselves. It also sets DD_Instrumented on the app's fasthttp server, a field
# the fasthttp rules add, so they skip Fiber's server and each request gets one
# span. otelc/all always brings the fasthttp rules into the build.
new_app:
  target:
    - "**"
    - not: "github.com/DataDog/dd-trace-go/contrib/gofiber/**"
  where:
    function_call: github.com/gofiber/fiber/v2.New
  do:
    - wrap_call:
        replace: |-
          func(app *__dd_fiber.App) *__dd_fiber.App {
            app.Server().DD_Instrumented = true
            return app
          }(fibertrace.Wrap({{ . }}))
  imports:
    __dd_fiber: github.com/gofiber/fiber/v2
    fibertrace: github.com/DataDog/dd-trace-go/contrib/gofiber/fiber.v2/v2
