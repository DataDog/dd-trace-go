---
# otelc port of ../orchestrion.yml.
#
# Like orchestrion, the rule rewrites call sites in every package of the build,
# dependencies included, except the fiber contrib. The contrib's own tests
# create apps, and wrapping those would import the contrib into itself.
#
# Like orchestrion, the rule also sets app.Server().DD_Instrumented, a field
# the fasthttp rules add so they skip Fiber's server. Without it, each request
# gets a fasthttp span on top of the fiber one. The fasthttp rules must be part
# of the build, which otelc/all ensures.

new_app:
  target:
    - "**"
    - not: "github.com/DataDog/dd-trace-go/contrib/gofiber/**"
  where:
    function_call: github.com/gofiber/fiber/v2.New
  do:
    - wrap_call:
        replace: |-
          func(app *__dd_fiber.App) *__dd_fiber.App {
            app.Server().DD_Instrumented = true
            return app
          }(fibertrace.Wrap({{ . }}))
  imports:
    __dd_fiber: github.com/gofiber/fiber/v2
    fibertrace: github.com/DataDog/dd-trace-go/contrib/gofiber/fiber.v2/v2
