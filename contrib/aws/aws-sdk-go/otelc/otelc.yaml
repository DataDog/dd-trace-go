---
# A call-site rule, not a hook on NewSession: the rewritten package imports the
# contrib, so it is initialized before a session built in a package-level var
# or init. aws-sdk-go is excluded because the contrib imports it, and the
# contrib because it would import itself.
#
# FIXME: sessions created with session.NewSessionWithOptions or session.New are
# not wrapped.
new_session:
  target:
    - "**"
    - not: "github.com/aws/aws-sdk-go/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go/**"
  where:
    function_call: github.com/aws/aws-sdk-go/aws/session.NewSession
  do:
    - wrap_call:
        replace: |-
          (func(sess *session.Session, err error) (*session.Session, error) {
            if sess != nil {
              sess = awstrace.WrapSession(sess)
            }
            return sess, err
          })({{ . }})
  imports:
    session: github.com/aws/aws-sdk-go/aws/session
    awstrace: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go/v2/aws
