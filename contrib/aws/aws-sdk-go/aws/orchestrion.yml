---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go/v2/aws
  description: The official AWS SDK for Go

aspects:
  # The session package calls these constructors itself and the contrib imports
  # it, so it is excluded.
  - id: session.NewSession
    join-point:
      all-of:
        - not:
            import-path: github.com/aws/aws-sdk-go/aws/session
        - one-of:
            - function-call: github.com/aws/aws-sdk-go/aws/session.NewSession
            - function-call: github.com/aws/aws-sdk-go/aws/session.NewSessionWithOptions
    advice:
      - wrap-expression:
          imports:
            awstrace: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go/v2/aws
            session: github.com/aws/aws-sdk-go/aws/session
          template: |-
            func(sess *session.Session, err error) (*session.Session, error) {
              if sess != nil {
                sess = awstrace.WrapSession(sess)
              }
              return sess, err
            }({{ . }})

  - id: session.New
    join-point:
      all-of:
        - not:
            import-path: github.com/aws/aws-sdk-go/aws/session
        - function-call: github.com/aws/aws-sdk-go/aws/session.New
    advice:
      - wrap-expression:
          imports:
            awstrace: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go/v2/aws
            session: github.com/aws/aws-sdk-go/aws/session
          template: |-
            func(sess *session.Session) *session.Session {
              if sess != nil {
                sess = awstrace.WrapSession(sess)
              }
              return sess
            }({{ . }})
