---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-trace-go/contrib/aws/datadog-lambda-go/v2
  description: |-
    Instruments AWS Lambda invocations after AWS configures the handler. AWS
    retains its original handler options, context, request decoder and response
    encoder. Configuration is read from DD_* environment variables. Handlers
    already wrapped by ddlambda are not instrumented again.

    Continuing traces from upstream services into the function, for event
    sources other than API Gateway, requires the Datadog Lambda Extension.

aspects:
  - id: handlerOptions.instrumented
    join-point:
      struct-definition: github.com/aws/aws-lambda-go/lambda.handlerOptions
    advice:
      - add-struct-field:
          name: __dd_instrumented
          type: bool

  - id: newHandler.manual-instrumentation
    join-point:
      all-of:
        - import-path: github.com/aws/aws-lambda-go/lambda
        - function-body:
            function:
              - name: newHandler
    advice:
      # Linking avoids a cycle: ddlambda's helpers themselves depend on lambda.
      - inject-declarations:
          links:
            - github.com/DataDog/dd-trace-go/contrib/aws/datadog-lambda-go/v2/internal/wrapper
          template: |-
            //go:linkname __dd_lambda_isWrapped github.com/DataDog/dd-trace-go/contrib/aws/datadog-lambda-go/v2/internal/wrapper.IsWrapped
            func __dd_lambda_isWrapped(interface{}) bool
      - prepend-statements:
          template: |-
            {{- $handler := .Function.Argument 0 -}}
            {{- $result := .Function.Result 0 -}}
            defer func() {
              if __dd_lambda_isWrapped({{ $handler }}) {
                {{ $result }}.__dd_instrumented = true
              }
            }()

  # Keep the original handlerOptions object, including its baseContext and any
  # future options. Only decorate the invocation adapter AWS already configured.
  - id: start.instrument-invocations
    join-point:
      all-of:
        - import-path: github.com/aws/aws-lambda-go/lambda
        - function-body:
            function:
              - name: start
    advice:
      - inject-declarations:
          links:
            - github.com/DataDog/dd-trace-go/contrib/aws/datadog-lambda-go/v2
          template: |-
            //go:linkname __dd_lambda_wrapRuntimeHandler github.com/DataDog/dd-trace-go/contrib/aws/datadog-lambda-go/v2.WrapRuntimeHandler
            func __dd_lambda_wrapRuntimeHandler(handlerFunc) handlerFunc
      - prepend-statements:
          template: |-
            {{- $handler := .Function.Argument 0 -}}
            if !{{ $handler }}.__dd_instrumented {
              {{ $handler }}.handlerFunc = __dd_lambda_wrapRuntimeHandler({{ $handler }}.handlerFunc)
              {{ $handler }}.__dd_instrumented = true
            }
