---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-trace-go/contrib/aws/datadog-lambda-go/v2
  description: |-
    Instruments handlers passed to github.com/aws/aws-lambda-go/lambda by
    wrapping the unexported start function after Lambda has applied handler
    options. Start, StartWithOptions, StartWithContext, StartHandler,
    StartHandlerWithContext, and StartHandlerFunc all reach start, so each
    invocation gets an aws.lambda span, enhanced metrics, and a tracer flush.
    Configuration is read from DD_* environment variables. Options passed to
    lambda.StartWithOptions are kept.

    The integration is part of orchestrion/all. A project set up for
    Orchestrion gets it with no extra import.

    Continuing traces from upstream services into the function, for event
    sources other than API Gateway, requires the Datadog Lambda Extension.

aspects:
  - id: lambda.start
    join-point:
      all-of:
        - import-path: github.com/aws/aws-lambda-go/lambda
        - function-body:
            function:
              - name: start
    advice:
      - inject-declarations:
          # ddlambda imports aws-lambda-go, so the injected code cannot import
          # it back. go:linkname reaches the helpers without an import.
          links:
            - github.com/DataDog/dd-trace-go/contrib/aws/datadog-lambda-go/v2
          imports:
            context: context
            io: io
          template: |-
            //go:linkname __dd_lambda_setup github.com/DataDog/dd-trace-go/contrib/aws/datadog-lambda-go/v2.setupOrchestrion
            func __dd_lambda_setup()

            //go:linkname __dd_lambda_invoke github.com/DataDog/dd-trace-go/contrib/aws/datadog-lambda-go/v2.invokeOrchestrion
            func __dd_lambda_invoke(ctx context.Context, payload []byte, next func(context.Context, []byte) (io.Reader, error)) (io.Reader, error)
      - prepend-statements:
          # The same imports as the declarations above. entry.go does not import
          # io, and the alias orchestrion assigns is only applied where the
          # imports map names the selector.
          imports:
            context: context
            io: io
          template: |-
            {{ $h := .Function.Argument 0 }}
            __dd_lambda_setup()
            __dd_orig := {{ $h }}.handlerFunc
            {{ $h }}.handlerFunc = func(ctx context.Context, payload []byte) (io.Reader, error) {
              return __dd_lambda_invoke(ctx, payload, func(ctx context.Context, payload []byte) (io.Reader, error) {
                return __dd_orig(ctx, payload)
              })
            }
