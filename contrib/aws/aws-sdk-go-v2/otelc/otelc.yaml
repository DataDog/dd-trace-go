---
# The aws packages and the service clients are excluded because the contrib
# imports them, the config package because load_default_config covers it, and
# the contrib because its tests build configs. APIOptionsWithTracing, not
# AppendMiddleware, so a middleware the application also adds replaces this
# one instead of adding a second span.
config_literal:
  target:
    - "**"
    - not: "github.com/aws/aws-sdk-go-v2/aws/**"
    - not: "github.com/aws/aws-sdk-go-v2/config/**"
    - not: "github.com/aws/aws-sdk-go-v2/service/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/**"
  where:
    struct_literal: github.com/aws/aws-sdk-go-v2/aws.Config
  do:
    - set_fields:
        field:
          - name: APIOptions
            wrap: "awstrace.APIOptionsWithTracing({{ . }})"
            value: "awstrace.APIOptionsWithTracing(nil)"
  imports:
    awstrace: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/v2/aws

# A call-site rule, not a hook on NewConfig: the rewritten package imports the
# contrib, so it is initialized before a config built in a package-level var or
# init.
new_config:
  target:
    - "**"
    - not: "github.com/aws/aws-sdk-go-v2/aws/**"
    - not: "github.com/aws/aws-sdk-go-v2/service/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/**"
  where:
    function_call: github.com/aws/aws-sdk-go-v2/aws.NewConfig
  do:
    - wrap_call:
        replace: |-
          (func(cfg *aws.Config) *aws.Config {
            cfg.APIOptions = awstrace.APIOptionsWithTracing(cfg.APIOptions)
            return cfg
          })({{ . }})
  imports:
    aws: github.com/aws/aws-sdk-go-v2/aws
    awstrace: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/v2/aws

# The config LoadDefaultConfig returns already holds the API options the
# application passed, for example with config.WithAPIOptions, so the
# middleware is added after them.
load_default_config:
  target:
    - "**"
    - not: "github.com/aws/aws-sdk-go-v2/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/**"
  where:
    function_call: github.com/aws/aws-sdk-go-v2/config.LoadDefaultConfig
  do:
    - wrap_call:
        replace: |-
          (func(cfg aws.Config, err error) (aws.Config, error) {
            if err == nil {
              cfg.APIOptions = awstrace.APIOptionsWithTracing(cfg.APIOptions)
            }
            return cfg, err
          })({{ . }})
  imports:
    aws: github.com/aws/aws-sdk-go-v2/aws
    awstrace: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/v2/aws
