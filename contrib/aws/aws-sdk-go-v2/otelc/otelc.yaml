---
# Also covers the config that config.LoadDefaultConfig builds as a literal. The
# aws packages and the service clients are excluded because the contrib imports
# them, and the contrib because its tests build configs. APIOptionsWithTracing,
# not AppendMiddleware, so a middleware the application also adds replaces this
# one instead of adding a second span.
config_literal:
  target:
    - "**"
    - not: "github.com/aws/aws-sdk-go-v2/aws/**"
    - not: "github.com/aws/aws-sdk-go-v2/service/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/**"
  where:
    struct_literal: github.com/aws/aws-sdk-go-v2/aws.Config
  do:
    - set_fields:
        field:
          - name: APIOptions
            wrap: "awstrace.APIOptionsWithTracing({{ . }})"
            value: "awstrace.APIOptionsWithTracing(nil)"
  imports:
    awstrace: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/v2/aws

# A call-site rule, not a hook on NewConfig: the rewritten package imports the
# contrib, so it is initialized before a config built in a package-level var or
# init.
new_config:
  target:
    - "**"
    - not: "github.com/aws/aws-sdk-go-v2/aws/**"
    - not: "github.com/aws/aws-sdk-go-v2/service/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/**"
  where:
    function_call: github.com/aws/aws-sdk-go-v2/aws.NewConfig
  do:
    - wrap_call:
        replace: |-
          (func(cfg *aws.Config) *aws.Config {
            cfg.APIOptions = awstrace.APIOptionsWithTracing(cfg.APIOptions)
            return cfg
          })({{ . }})
  imports:
    aws: github.com/aws/aws-sdk-go-v2/aws
    awstrace: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/v2/aws

# config.LoadDefaultConfig replaces the APIOptions that config_literal set with
# the ones from its options, which drops the middleware. getAPIOptions is where
# it reads them; this is the plain function, not the LoadOptions method of the
# same name. inject_code, not a hook, for the same init order reason as
# new_config.
load_options_api_options:
  target: github.com/aws/aws-sdk-go-v2/config
  where:
    func: getAPIOptions
  do:
    - inject_code:
        raw: |-
          defer func() {
            if {{ .FuncReturn 1 }} && {{ .FuncReturn 2 }} == nil {
              {{ .FuncReturn 0 }} = awstrace.APIOptionsWithTracing({{ .FuncReturn 0 }})
            }
          }()
  imports:
    awstrace: github.com/DataDog/dd-trace-go/contrib/aws/aws-sdk-go-v2/v2/aws
