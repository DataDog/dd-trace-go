---
# A literal rule, not a hook on api.NewClient: the rewritten package imports the
# contrib, so it is initialized before a config built in a package-level var or
# init. The vault modules are not excluded, since literals inside
# github.com/hashicorp/vault/api are unqualified and never match. The contrib is
# excluded because its tests build configs.
config:
  target:
    - "**"
    - not: "github.com/DataDog/dd-trace-go/contrib/hashicorp/vault/**"
  where:
    struct_literal: github.com/hashicorp/vault/api.Config
  do:
    - set_fields:
        field:
          - name: HttpClient
            wrap: __dd_vaulttrace.WrapHTTPClient({{ . }})
            value: __dd_vaulttrace.NewHTTPClient()
  imports:
    __dd_vaulttrace: github.com/DataDog/dd-trace-go/contrib/hashicorp/vault/v2
