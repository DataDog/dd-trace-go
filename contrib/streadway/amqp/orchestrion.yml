---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-trace-go/contrib/streadway/amqp/v2
  description: Go client for AMQP 0-9-1 (deprecated, superseded by amqp091-go).

aspects:
  - id: Publish
    join-point:
      all-of:
        - not:
            import-path: github.com/DataDog/dd-trace-go/contrib/streadway/amqp/v2
        - not:
            import-path: github.com/streadway/amqp
        - one-of:
            - method-call: {receiver: github.com/streadway/amqp.Channel, name: Publish}
    advice:
      - wrap-expression:
          imports:
            __dd_streadway_amqp: github.com/DataDog/dd-trace-go/contrib/streadway/amqp/v2
          template: |-
            {{- $ctx := .Function.ArgumentOfType "context.Context" -}}
            {{- if eq $ctx "" -}}
            {{- $ctx = .Function.ArgumentThatImplements "context.Context" -}}
            {{- end -}}
            {{- if eq $ctx "" -}}
            __dd_streadway_amqp.{{ .AST.Fun.Name }}({{ .AST.Fun.X }}{{ range .AST.Args }}, {{ . }}{{ end }})
            {{- else -}}
            __dd_streadway_amqp.{{ .AST.Fun.Name }}WithContext({{ $ctx }}, {{ .AST.Fun.X }}{{ range .AST.Args }}, {{ . }}{{ end }})
            {{- end -}}

  - id: Channel
    join-point:
      all-of:
        - not:
            import-path: github.com/DataDog/dd-trace-go/contrib/streadway/amqp/v2
        - not:
            import-path: github.com/streadway/amqp
        - one-of:
            - method-call: {receiver: github.com/streadway/amqp.Channel, name: Consume}
            - method-call: {receiver: github.com/streadway/amqp.Channel, name: Get}
    advice:
      - wrap-expression:
          imports:
            __dd_streadway_amqp: github.com/DataDog/dd-trace-go/contrib/streadway/amqp/v2
          template: |-
            __dd_streadway_amqp.{{ .AST.Fun.Name }}({{ .AST.Fun.X }}{{ range .AST.Args }}, {{ . }}{{ end }})
