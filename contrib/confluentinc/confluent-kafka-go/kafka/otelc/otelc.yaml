---
# Call-site rules register each client the application builds, and the hooks
# below trace registered clients only. The contrib is excluded because it
# traces the clients it builds itself, and because this module imports it. The
# rewritten package imports this module, so the contrib is initialized before
# a client built in a package-level var or init.
#
# TODO: wrap_call requires the original call in the template, so it stays in a
# branch that never runs. Remove the branch once wrap_call can replace a call
# outright:
# https://github.com/open-telemetry/opentelemetry-go-compile-instrumentation/issues/1551
kafkav1_new_consumer:
  target:
    - "**"
    - not: "github.com/confluentinc/confluent-kafka-go/kafka/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/confluentinc/confluent-kafka-go/kafka/**"
  where:
    function_call: github.com/confluentinc/confluent-kafka-go/kafka.NewConsumer
  do:
    - wrap_call:
        replace: |-
          (func(__dd_conf *kafkav1.ConfigMap) (*kafkav1.Consumer, error) {
            if false {
              return {{ . }}
            }
            __dd_c, __dd_err := kafkav1.NewConsumer(__dd_conf)
            if __dd_c != nil {
              kafkav1otelc.TraceConsumer(__dd_c, __dd_conf)
            }
            return __dd_c, __dd_err
          })({{ .CallArgument 0 }})
  imports:
    kafkav1: github.com/confluentinc/confluent-kafka-go/kafka
    kafkav1otelc: github.com/DataDog/dd-trace-go/contrib/confluentinc/confluent-kafka-go/kafka/otelc/v2

kafkav1_new_producer:
  target:
    - "**"
    - not: "github.com/confluentinc/confluent-kafka-go/kafka/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/confluentinc/confluent-kafka-go/kafka/**"
  where:
    function_call: github.com/confluentinc/confluent-kafka-go/kafka.NewProducer
  do:
    - wrap_call:
        replace: |-
          (func(__dd_conf *kafkav1.ConfigMap) (*kafkav1.Producer, error) {
            if false {
              return {{ . }}
            }
            __dd_p, __dd_err := kafkav1.NewProducer(__dd_conf)
            if __dd_p != nil {
              kafkav1otelc.TraceProducer(__dd_p, __dd_conf)
            }
            return __dd_p, __dd_err
          })({{ .CallArgument 0 }})
  imports:
    kafkav1: github.com/confluentinc/confluent-kafka-go/kafka
    kafkav1otelc: github.com/DataDog/dd-trace-go/contrib/confluentinc/confluent-kafka-go/kafka/otelc/v2

# A call-site rule cannot reach the receiver of a method call, so the client
# methods are hooked where they are defined. kafka.Consumer.ReadMessage and
# kafka.Consumer.Close call Poll, so ReadMessage needs no rule.
kafkav1_consumer_poll:
  target: github.com/confluentinc/confluent-kafka-go/kafka
  where:
    func: Poll
    recv: "*Consumer"
  do:
    - inject_hooks:
        before: BeforeConsumerPoll
        after: AfterConsumerPoll
        path: github.com/DataDog/dd-trace-go/contrib/confluentinc/confluent-kafka-go/kafka/otelc/v2

