  where:
    function_call: github.com/Shopify/sarama.NewSyncProducerFromClient
  do:
    - wrap_call:
        replace: |-
          (func(__dd_client sarama.Client) (sarama.SyncProducer, error) {
            if false {
              return {{ . }}
            }
            __dd_p, __dd_err := sarama.NewSyncProducerFromClient(__dd_client)
            if __dd_p != nil {
              __dd_p = saramatrace.WrapSyncProducer(__dd_client.Config(), __dd_p)
            }
            return __dd_p, __dd_err
          })({{ .CallArgument 0 }})
  imports:
    sarama: github.com/Shopify/sarama
    saramatrace: github.com/DataDog/dd-trace-go/contrib/Shopify/sarama/v2

