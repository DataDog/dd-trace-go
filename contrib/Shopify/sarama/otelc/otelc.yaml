---
# Like orchestrion, these rules wrap the result of each sarama constructor call
# with the contrib, in every package of the build, dependencies included,
# except sarama and the contrib. function_call only matches qualified calls, so
# sarama's own calls are never rewritten. That keeps the async producer that
# sarama's sync producer constructors build, and type assert to their own type,
# unwrapped. The contrib's tests build sarama values and wrap them, so
# rewriting those would trace them twice and import the contrib into itself.
#
# The rewritten file imports the contrib, so the contrib is initialized before
# a call from a package-level variable or an init function.
#
# The producer rules read the config from the call's own arguments, or from
# the client for the FromClient constructors, where orchestrion passes the
# enclosing function's *sarama.Config argument or nil. A nil config reaches
# the contrib as nil in both tools.
#
# TODO: wrap_call rejects a replace template without the original call
# ({{ . }}), so the producer templates keep it in a branch that never runs.
# They take the arguments as typed closure parameters, so each argument is
# evaluated once and where the original call was, which matters for a go or
# defer statement, and a nil argument compiles. The parameter names keep a
# prefix so they cannot hide a variable that the original call refers to.
# Remove the branch once wrap_call can replace a call outright:
# https://github.com/open-telemetry/opentelemetry-go-compile-instrumentation/issues/1551

sarama_new_consumer:
  target:
    - "**"
    - not: "github.com/Shopify/sarama"
    - not: "github.com/Shopify/sarama/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/Shopify/sarama/**"
  where:
    function_call: github.com/Shopify/sarama.NewConsumer
  do:
    - wrap_call:
        replace: |-
          (func(c sarama.Consumer, err error) (sarama.Consumer, error) {
            if c != nil {
              c = saramatrace.WrapConsumer(c)
            }
            return c, err
          })({{ . }})
  imports:
    sarama: github.com/Shopify/sarama
    saramatrace: github.com/DataDog/dd-trace-go/contrib/Shopify/sarama/v2

sarama_new_consumer_from_client:
  target:
    - "**"
    - not: "github.com/Shopify/sarama"
    - not: "github.com/Shopify/sarama/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/Shopify/sarama/**"
  where:
    function_call: github.com/Shopify/sarama.NewConsumerFromClient
  do:
    - wrap_call:
        replace: |-
          (func(c sarama.Consumer, err error) (sarama.Consumer, error) {
            if c != nil {
              c = saramatrace.WrapConsumer(c)
            }
            return c, err
          })({{ . }})
  imports:
    sarama: github.com/Shopify/sarama
    saramatrace: github.com/DataDog/dd-trace-go/contrib/Shopify/sarama/v2

sarama_new_sync_producer:
  target:
    - "**"
    - not: "github.com/Shopify/sarama"
    - not: "github.com/Shopify/sarama/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/Shopify/sarama/**"
  where:
    function_call: github.com/Shopify/sarama.NewSyncProducer
  do:
    - wrap_call:
        replace: |-
          (func(__dd_addrs []string, __dd_cfg *sarama.Config) (sarama.SyncProducer, error) {
            if false {
              return {{ . }}
            }
            __dd_p, __dd_err := sarama.NewSyncProducer(__dd_addrs, __dd_cfg)
            if __dd_p != nil {
              __dd_p = saramatrace.WrapSyncProducer(__dd_cfg, __dd_p)
            }
            return __dd_p, __dd_err
          })({{ .CallArgument 0 }}, {{ .CallArgument 1 }})
  imports:
    sarama: github.com/Shopify/sarama
    saramatrace: github.com/DataDog/dd-trace-go/contrib/Shopify/sarama/v2

