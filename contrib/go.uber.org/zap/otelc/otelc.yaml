---
# Rewrites logger.Info(args) into logger.With(trace fields).Info(args) at the
# call site, with the context.Context, or else the *http.Request, of the
# enclosing function. A hook on the logger methods would only see the
# goroutine's span, not the caller's context. The receiver and the arguments
# stay outside any closure, so a deferred call still evaluates them at the
# defer statement.
#
# FIXME: the enclosing function is always the top-level declaration, so a call
# in a function literal uses the outer function's context and ignores the
# literal's own parameters. A call in a function literal assigned to a
# package-level variable fails the build, since there is no enclosing
# declaration.
# https://github.com/open-telemetry/opentelemetry-go-compile-instrumentation/issues/1895
zap_logger_debug:
  target:
    - "**"
    - not: "go.uber.org/zap/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go.uber.org/zap/**"
  where:
    method_call: go.uber.org/zap.*Logger.Debug
  do:
    - wrap_call:
        replace: |-
          {{- $ctx := .FuncArgumentOfType "context.Context" -}}
          {{- if not $ctx -}}
            {{- $ctx = .FuncArgumentThatImplements "context.Context" -}}
          {{- end -}}
          {{- $req := .FuncArgumentOfType "*net/http.Request" -}}
          {{- if $ctx -}}
            {{ .CallReceiver }}.With(__dd_zaptrace.TraceFields({{ $ctx }})...).Debug({{ .CallArguments }})
          {{- else if $req -}}
            {{ .CallReceiver }}.With(__dd_zaptrace.TraceFieldsFromRequest({{ $req }})...).Debug({{ .CallArguments }})
          {{- else -}}
            {{ . }}
          {{- end -}}
  imports:
    __dd_zaptrace: github.com/DataDog/dd-trace-go/contrib/go.uber.org/zap/v2

