---
# Call-site rules, not hooks on the Client methods: the aerospike API takes no
# context.Context, so only the call site can pass the caller's context to the
# span, which also works on a goroutine that does not hold the parent span. The
# library is excluded because its methods call each other (ScanAll calls
# ScanPartitions), and the contrib because its wrapper calls the raw client.
#
# method_call also matches a Client method promoted through an embedded field,
# where the receiver is the outer value, so WrapReceiver takes any receiver.
#
# FIXME: a call outside any function, such as in a package-level var
# initializer, fails the build, because .FuncArgumentOfType returns an error
# there instead of "". https://github.com/open-telemetry/opentelemetry-go-compile-instrumentation/issues/1895
aerospike_v7_client_put:
  target:
    - "**"
    - not: "github.com/aerospike/aerospike-client-go/v7/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/aerospike/aerospike-client-go.v7/**"
  where:
    method_call: github.com/aerospike/aerospike-client-go/v7.*Client.Put
  do:
    - wrap_call:
        replace: |-
          {{- $ctx := .FuncArgumentOfType "context.Context" -}}
          {{- if eq $ctx "" -}}{{- $ctx = .FuncArgumentThatImplements "context.Context" -}}{{- end -}}
          {{- if eq $ctx "" -}}{{- $ctx = "nil" -}}{{- end -}}
          __dd_aerospikeotelc.WrapReceiver({{ .CallReceiver }}, {{ $ctx }}).Put({{ .CallArguments }})
  imports:
    __dd_aerospikeotelc: github.com/DataDog/dd-trace-go/contrib/aerospike/aerospike-client-go.v7/otelc/v2

