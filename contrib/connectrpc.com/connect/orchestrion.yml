---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-trace-go/contrib/connectrpc.com/connect/v2
  description: |-
    Connect is an RPC framework built on Protocol Buffers and net/http.

    ### Details & Caveats
    - Clients generated by protoc-gen-connect-go v1.13.0 or later are instrumented through
      `connect.WithClientOptions`. Versions v1.7.0 to v1.12.x emit that call only for methods with
      an `idempotency_level` option, and older versions never emit it. Direct `connect.NewClient`
      calls need a `connect.WithClientOptions(...)` argument, or
      `connecttrace.NewClientInterceptor()` added manually.
    - Handler constructors called with explicit type arguments, such as
      `connect.NewUnaryHandler[Req, Res](...)`, are not matched: let Go infer the type arguments, or
      add the interceptor manually.
    - The interceptor is appended last, so it is the innermost one: RPCs rejected by earlier
      interceptors, or before the interceptor chain runs (for example while decoding a unary
      request, or by a `connect.WithRequestGate` check, added in connect v1.21.0), produce no
      server span.
    - Handlers created by helper libraries such as `grpchealth` and `grpcreflect` are instrumented
      too.
    - Handler constructors called with a multi-value expression as their arguments, such as
      `connect.NewUnaryHandler(f())`, fail to compile once woven: opt them out with
      `//orchestrion:ignore` and add the interceptor manually.
    - Opt a call out with an `//orchestrion:ignore` comment.

aspects:
  - id: Client
    join-point:
      all-of:
        - function-call: connectrpc.com/connect.WithClientOptions
        - not:
            import-path: connectrpc.com/connect
        - not:
            import-path: github.com/DataDog/dd-trace-go/contrib/connectrpc.com/connect/v2
    advice:
      # Wrapping the option, rather than extending its arguments with append-args, leaves a caller's
      # `opts...` slice untouched, references only qualified identifiers, and works with every
      # Orchestrion version: append-args writes into the slice's spare capacity in v1.14.0 and
      # earlier, which lack DataDog/orchestrion#929 (see DataDog/orchestrion#913), and users who
      # import this integration individually may still weave with one of them.
      - wrap-expression:
          imports:
            connect: connectrpc.com/connect
            connecttrace: github.com/DataDog/dd-trace-go/contrib/connectrpc.com/connect/v2
          template: connect.WithClientOptions({{ . }}, connect.WithInterceptors(connecttrace.NewClientInterceptor()))

  - id: Handler
    join-point:
      all-of:
        - one-of:
            - function-call: connectrpc.com/connect.NewUnaryHandler
            - function-call: connectrpc.com/connect.NewClientStreamHandler
            - function-call: connectrpc.com/connect.NewServerStreamHandler
            - function-call: connectrpc.com/connect.NewBidiStreamHandler
            - function-call: connectrpc.com/connect.NewUnaryHandlerSimple
            - function-call: connectrpc.com/connect.NewClientStreamHandlerSimple
            - function-call: connectrpc.com/connect.NewServerStreamHandlerSimple
        - not:
            import-path: connectrpc.com/connect
        - not:
            import-path: github.com/DataDog/dd-trace-go/contrib/connectrpc.com/connect/v2
    advice:
      # A spread `opts...` slice is passed through connect.WithHandlerOptions unchanged, never copied
      # or appended to, so neither it nor any slice sharing its backing array is written, with every
      # Orchestrion version (append-args writes into it in v1.14.0 and earlier, which lack
      # DataDog/orchestrion#929). The template references only qualified identifiers.
      # Every matched constructor takes two arguments before the options.
      - wrap-expression:
          imports:
            connect: connectrpc.com/connect
            connecttrace: github.com/DataDog/dd-trace-go/contrib/connectrpc.com/connect/v2
          template: |-
            {{- if .AST.Ellipsis -}}
            {{ .AST.Fun }}({{ index .AST.Args 0 }}, {{ index .AST.Args 1 }}, connect.WithHandlerOptions({{ index .AST.Args 2 }}...), connect.WithInterceptors(connecttrace.NewServerInterceptor()))
            {{- else -}}
            {{ .AST.Fun }}({{ range .AST.Args }}{{ . }}, {{ end }}connect.WithInterceptors(connecttrace.NewServerInterceptor()))
            {{- end -}}
