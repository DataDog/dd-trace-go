---
# Registers the tracing plugin on the *gorm.DB that gorm.Open returns, in every
# package of the build, dependencies included. A call-site rewrite makes the
# rewritten package import the contrib, so the contrib is initialized before a
# gorm.Open in a package-level var or init runs, which a hook on gorm.Open does
# not guarantee. It also skips the contrib's own Open, which registers the
# callbacks itself, so those connections are traced once. gorm and its
# subpackages are excluded: callbacks imports gorm, so rewriting it would
# create an import cycle.
#
# Unlike orchestrion, a failed gorm.Open returns the *gorm.DB with the error, as
# the uninstrumented call does.
open:
  target:
    - "**"
    - not: "gorm.io/gorm/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/gorm.io/**"
  where:
    function_call: gorm.io/gorm.Open
  do:
    - wrap_call:
        replace: |-
          (func() (*gorm.DB, error) {
            db, err := {{ . }}
            if err != nil {
              return db, err
            }
            if _, ok := db.Plugins["DDTracePlugin"]; ok {
              return db, nil
            }
            if err := db.Use(gormtrace.NewTracePlugin()); err != nil {
              return nil, err
            }
            return db, nil
          })()
  imports:
    gorm: gorm.io/gorm
    gormtrace: github.com/DataDog/dd-trace-go/contrib/gorm.io/gorm.v1/v2
