---
# The publish span ends in (*PublishResult).Get, so Publish stores its closer on
# the result. A hook cannot do that: PublishResult lives in
# cloud.google.com/go/internal/pubsub, which a hook cannot import, and a hook
# cannot read a field that add_struct_fields adds. So these rules run
# in-package, and Receive uses the same tracer, declared by the add_file rule.
# pubsub v1 shares PublishResult and adds its own field, so the two rule sets
# never collide.
pubsub_v2_publish_result_field:
  target: cloud.google.com/go/internal/pubsub
  where:
    struct: PublishResult
  do:
    - add_struct_fields:
        new_field:
          - name: DD__pubsubV2CloseSpan
            type: func(string, error)

pubsub_v2_publish_result_get:
  target: cloud.google.com/go/internal/pubsub
  where:
    func: Get
    recv: "*PublishResult"
  do:
    - inject_code:
        raw: |-
          {{- $r := .Receiver -}}
          defer func() {
            if {{ $r }}.DD__pubsubV2CloseSpan != nil {
              {{ $r }}.DD__pubsubV2CloseSpan({{ .FuncReturn 0 }}, {{ .FuncReturn 1 }})
            }
          }()

pubsub_v2_helpers:
  target: cloud.google.com/go/pubsub/v2
  do:
    - add_file:
        file: inject.go
        path: github.com/DataDog/dd-trace-go/contrib/cloud.google.com/go/pubsub.v2/otelc/v2

pubsub_v2_publisher_publish:
  target: cloud.google.com/go/pubsub/v2
  where:
    func: Publish
    recv: "*Publisher"
  do:
    - inject_code:
        raw: |-
          {{- $ctx := .FuncArgument 0 -}}
          {{- $res := .FuncReturn 0 -}}
          {{ $ctx }}, __dd_closeSpan := __dd_pubsubTracePublish({{ $ctx }}, {{ .Receiver }}, {{ .FuncArgument 1 }})
          if __dd_closeSpan != nil {
            defer func() {
              if {{ $res }} != nil {
                {{ $res }}.DD__pubsubV2CloseSpan = __dd_closeSpan
              }
            }()
          }

pubsub_v2_subscriber_receive:
  target: cloud.google.com/go/pubsub/v2
  where:
    func: Receive
    recv: "*Subscriber"
  do:
    - inject_code:
        raw: |-
          {{- $f := .FuncArgument 1 -}}
          {{ $f }} = __dd_pubsubWrapReceiveHandler({{ .Receiver }}, {{ $f }})

# pubsub.NewClient builds the admin clients itself, so the rules also rewrite
# cloud.google.com/go/pubsub/v2 and exclude only apiv1 and the contrib.
pubsub_v2_new_topic_admin_client:
  target:
    - "**"
    - not: "cloud.google.com/go/pubsub/v2/apiv1/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/cloud.google.com/go/pubsub.v2/**"
  where:
    function_call: cloud.google.com/go/pubsub/v2/apiv1.NewTopicAdminClient
  do:
    - wrap_call:
        append_args:
          - "option.WithGRPCDialOption(grpc.WithChainUnaryInterceptor(pubsubv2admin.UnaryAdminInterceptor()))"
        variadic_type: "option.ClientOption"
  imports:
    option: google.golang.org/api/option
    grpc: google.golang.org/grpc
    pubsubv2admin: github.com/DataDog/dd-trace-go/contrib/cloud.google.com/go/pubsub.v2/v2/admin

pubsub_v2_new_subscription_admin_client:
  target:
    - "**"
    - not: "cloud.google.com/go/pubsub/v2/apiv1/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/cloud.google.com/go/pubsub.v2/**"
  where:
    function_call: cloud.google.com/go/pubsub/v2/apiv1.NewSubscriptionAdminClient
  do:
    - wrap_call:
        append_args:
          - "option.WithGRPCDialOption(grpc.WithChainUnaryInterceptor(pubsubv2admin.UnaryAdminInterceptor()))"
