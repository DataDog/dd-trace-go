---
# otelc port of ../orchestrion.yml.
#
# The target is the module being built plus main, whose compile-time import
# path is the literal "main" and so is not part of $root. NewRouter calls
# NewMux inside chi, which neither target reaches, so each call site is wrapped
# once.

new_mux:
  target:
    - "$root"
    - main
  where:
    function_call: github.com/go-chi/chi.NewMux
  do:
    - wrap_call:
        replace: |-
          (func() *chi.Mux {
            mux := {{ . }}
            mux.Use(chitrace.Middleware())
            return mux
          })()
  imports:
    chi: github.com/go-chi/chi
    chitrace: github.com/DataDog/dd-trace-go/contrib/go-chi/chi/v2

new_router:
  target:
    - "$root"
    - main
  where:
    function_call: github.com/go-chi/chi.NewRouter
  do:
    - wrap_call:
        replace: |-
          (func() *chi.Mux {
            mux := {{ . }}
            mux.Use(chitrace.Middleware())
            return mux
          })()
  imports:
    chi: github.com/go-chi/chi
    chitrace: github.com/DataDog/dd-trace-go/contrib/go-chi/chi/v2
