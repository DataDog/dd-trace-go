---
# otelc port of ../orchestrion.yml.
#
# Like orchestrion, the rules rewrite call sites in every package of the build,
# dependencies included, except chi and the chi contrib. Inside chi, Route
# creates sub-routers with NewRouter, which orchestrion does not wrap, and
# NewRouter calls NewMux, so each call site is wrapped once. The contrib's own
# tests create routers, and wrapping those would import the contrib into itself.

new_mux:
  target:
    - "**"
    - not: "github.com/go-chi/chi/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go-chi/**"
  where:
    function_call: github.com/go-chi/chi/v5.NewMux
  do:
    - wrap_call:
        replace: |-
          (func() *chi.Mux {
            mux := {{ . }}
            mux.Use(chitrace.Middleware())
            return mux
          })()
  imports:
    chi: github.com/go-chi/chi/v5
    chitrace: github.com/DataDog/dd-trace-go/contrib/go-chi/chi.v5/v2

new_router:
  target:
    - "**"
    - not: "github.com/go-chi/chi/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go-chi/**"
  where:
    function_call: github.com/go-chi/chi/v5.NewRouter
  do:
    - wrap_call:
        replace: |-
          (func() *chi.Mux {
            mux := {{ . }}
            mux.Use(chitrace.Middleware())
            return mux
          })()
  imports:
    chi: github.com/go-chi/chi/v5
    chitrace: github.com/DataDog/dd-trace-go/contrib/go-chi/chi.v5/v2
