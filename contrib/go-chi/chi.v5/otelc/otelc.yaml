---
# chi's own calls, Route creating sub-routers with NewRouter and NewRouter
# calling NewMux, are not rewritten, so each router is wrapped once. The
# contrib is excluded because its tests create routers.
new_mux:
  target:
    - "**"
    - not: "github.com/go-chi/chi/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go-chi/**"
  where:
    function_call: github.com/go-chi/chi/v5.NewMux
  do:
    - wrap_call:
        replace: |-
          (func(mux *__dd_chiv5.Mux) *__dd_chiv5.Mux {
            mux.Use(__dd_chiv5trace.Middleware())
            return mux
          })({{ . }})
  imports:
    __dd_chiv5: github.com/go-chi/chi/v5
    __dd_chiv5trace: github.com/DataDog/dd-trace-go/contrib/go-chi/chi.v5/v2

new_router:
  target:
    - "**"
    - not: "github.com/go-chi/chi/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go-chi/**"
  where:
    function_call: github.com/go-chi/chi/v5.NewRouter
  do:
    - wrap_call:
        replace: |-
          (func(mux *__dd_chiv5.Mux) *__dd_chiv5.Mux {
            mux.Use(__dd_chiv5trace.Middleware())
            return mux
          })({{ . }})
  imports:
    __dd_chiv5: github.com/go-chi/chi/v5
    __dd_chiv5trace: github.com/DataDog/dd-trace-go/contrib/go-chi/chi.v5/v2

endpoint_hook_declaration:
  target: github.com/go-chi/chi/v5
  do:
    - add_file:
        file: endpointhook.go
        path: github.com/DataDog/dd-trace-go/contrib/go-chi/chi.v5/otelc/v2

endpoint_hook:
  target: github.com/go-chi/chi/v5
  where:
    func: handle
    recv: "*Mux"
  do:
    - inject_code:
        raw: |-
          {{- $method := .FuncArgument 0 -}}
          {{- $pattern := .FuncArgument 1 -}}
          {{- $handler := .FuncArgument 2 -}}
          // These unexported chi masks are required; mSTUB excludes mount dispatch.
          if {{ $method }}&mSTUB == 0 {
            {{ $handler }} = __dd_chitrace_wrapEndpoint({{ $handler }}, {{ $method }} != mALL && len({{ $pattern }}) > 0 && {{ $pattern }}[len({{ $pattern }})-1] == '*')
          }
