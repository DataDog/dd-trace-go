---
# otelc port of ../orchestrion.yml.
#
# The import names differ from the chi v1 rules, so a file that uses both chi
# versions does not get two imports under the same name.
#
# Like orchestrion, the rules rewrite call sites in every package of the build,
# dependencies included, except chi and the chi contrib. Inside chi, Route
# creates sub-routers with NewRouter, which orchestrion does not wrap, and
# NewRouter calls NewMux, so each call site is wrapped once. The contrib's own
# tests create routers, and wrapping those would import the contrib into itself.
#
# Each template takes the call's result as a closure parameter, so the call
# and its arguments are evaluated where the original call was, which matters
# for a go or defer statement.

new_mux:
  target:
    - "**"
    - not: "github.com/go-chi/chi/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go-chi/**"
  where:
    function_call: github.com/go-chi/chi/v5.NewMux
  do:
    - wrap_call:
        replace: |-
          (func(mux *chiv5.Mux) *chiv5.Mux {
            mux.Use(chiv5trace.Middleware())
            return mux
          })({{ . }})
  imports:
    chiv5: github.com/go-chi/chi/v5
    chiv5trace: github.com/DataDog/dd-trace-go/contrib/go-chi/chi.v5/v2

new_router:
  target:
    - "**"
    - not: "github.com/go-chi/chi/**"
    - not: "github.com/DataDog/dd-trace-go/contrib/go-chi/**"
  where:
    function_call: github.com/go-chi/chi/v5.NewRouter
  do:
    - wrap_call:
        replace: |-
          (func(mux *chiv5.Mux) *chiv5.Mux {
            mux.Use(chiv5trace.Middleware())
            return mux
          })({{ . }})
  imports:
    chiv5: github.com/go-chi/chi/v5
    chiv5trace: github.com/DataDog/dd-trace-go/contrib/go-chi/chi.v5/v2
