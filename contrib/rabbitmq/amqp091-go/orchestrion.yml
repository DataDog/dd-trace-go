---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/DataDog/dd-trace-go/contrib/rabbitmq/amqp091-go/v2
  description: RabbitMQ AMQP 0-9-1 client for Go.

aspects:
  - id: Publish
    join-point:
      all-of:
        - not:
            import-path: github.com/DataDog/dd-trace-go/contrib/rabbitmq/amqp091-go/v2
        - not:
            import-path: github.com/rabbitmq/amqp091-go
        - one-of:
            - method-call: {receiver: github.com/rabbitmq/amqp091-go.Channel, name: Publish}
            - method-call: {receiver: github.com/rabbitmq/amqp091-go.Channel, name: PublishWithDeferredConfirm}
    advice:
      - wrap-expression:
          imports:
            __dd_amqp091: github.com/DataDog/dd-trace-go/contrib/rabbitmq/amqp091-go/v2
          template: |-
            {{- $ctx := .Function.ArgumentOfType "context.Context" -}}
            {{- if eq $ctx "" -}}
            {{- $ctx = .Function.ArgumentThatImplements "context.Context" -}}
            {{- end -}}
            {{- if eq $ctx "" -}}
            __dd_amqp091.{{ .AST.Fun.Name }}({{ .AST.Fun.X }}{{ range .AST.Args }}, {{ . }}{{ end }})
            {{- else -}}
            __dd_amqp091.{{ .AST.Fun.Name }}WithContext({{ $ctx }}, {{ .AST.Fun.X }}{{ range .AST.Args }}, {{ . }}{{ end }})
            {{- end -}}

  - id: Channel
    join-point:
      all-of:
        - not:
            import-path: github.com/DataDog/dd-trace-go/contrib/rabbitmq/amqp091-go/v2
        - not:
            import-path: github.com/rabbitmq/amqp091-go
        - one-of:
            - method-call: {receiver: github.com/rabbitmq/amqp091-go.Channel, name: Consume}
            - method-call: {receiver: github.com/rabbitmq/amqp091-go.Channel, name: Get}
    advice:
      - wrap-expression:
          imports:
            __dd_amqp091: github.com/DataDog/dd-trace-go/contrib/rabbitmq/amqp091-go/v2
          template: |-
            __dd_amqp091.{{ .AST.Fun.Name }}({{ .AST.Fun.X }}{{ range .AST.Args }}, {{ . }}{{ end }})

  - id: ChannelWithContext
    join-point:
      all-of:
        - not:
            import-path: github.com/DataDog/dd-trace-go/contrib/rabbitmq/amqp091-go/v2
        - not:
            import-path: github.com/rabbitmq/amqp091-go
        - one-of:
            - method-call: {receiver: github.com/rabbitmq/amqp091-go.Channel, name: PublishWithContext}
            - method-call: {receiver: github.com/rabbitmq/amqp091-go.Channel, name: PublishWithDeferredConfirmWithContext}
            - method-call: {receiver: github.com/rabbitmq/amqp091-go.Channel, name: ConsumeWithContext}
    advice:
      - wrap-expression:
          imports:
            __dd_amqp091: github.com/DataDog/dd-trace-go/contrib/rabbitmq/amqp091-go/v2
          template: |-
            __dd_amqp091.{{ .AST.Fun.Name }}({{ index .AST.Args 0 }}, {{ .AST.Fun.X }}{{ range $i, $a := .AST.Args }}{{ if $i }}, {{ $a }}{{ end }}{{ end }})
